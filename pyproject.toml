[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idmc-governance"
version = "0.1.0"
description = "AI-driven Informatica IDMC/CDGC data governance — MCP servers, UI, and full-catalog scale pipeline"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.27.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "fastapi==0.140.13",
    "uvicorn==0.51.0",
    "anthropic==0.120.2",
    "snowflake-connector-python==4.7.1",
    "cryptography==49.0.0",
    "pydantic==2.13.4",
    "psutil==7.2.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# Convenience console entrypoints (equivalent to `python -m idmc_governance.<...>`)
idmc-ui              = "idmc_governance.ui.app:main"
idmc-scale-pipeline  = "idmc_governance.scale.orchestrator:main"
idmc-bulk-import     = "idmc_governance.scale.bulk_import:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"idmc_governance.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
