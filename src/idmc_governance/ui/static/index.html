function TrendRow({ entry, tone }) {
  const color = tone === "down" ? "text-red-600" : tone === "up" ? "text-emerald-600" : "text-slate-500";
  const bar   = tone === "down" ? "bg-red-400"   : tone === "up" ? "bg-emerald-400"   : "bg-slate-300";
  const width = Math.min(Math.abs(entry.delta || 0) * 2, 100);
  return (
    <div className="flex items-center gap-3 px-3 py-2">
      <span className="text-xs font-mono text-slate-600 w-56 truncate shrink-0" title={entry.rule}>{entry.rule}</span>
      <span className="text-xs text-slate-400 shrink-0">{Number(entry.first).toFixed(0)} → {Number(entry.last).toFixed(0)}</span>
      <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${bar}`} style={{ width: `${width}%` }}/></div>
      <span className={`text-xs font-bold w-14 text-right shrink-0 ${color}`}>{entry.delta > 0 ? "+" : ""}{Number(entry.delta).toFixed(1)}</span>
      <span className="text-xs text-slate-300 shrink-0">{entry.points} pts</span>
    </div>
  );
}

function MonitorSection() {
  const [asset, setAsset]       = useState("");
  const [loading, setLoading]   = useState(false);
  const [error, setError]       = useState(null);
  const [scores, setScores]     = useState(null);
  const [trends, setTrends]     = useState(null);
  const [rem, setRem]           = useState(null);
  const [remLoading, setRemLoading] = useState(false);
  const [alerts, setAlerts]     = useState(null);
  const [showAlert, setShowAlert] = useState(false);
  const [alertForm, setAlertForm] = useState({ threshold: "10", notify_email: "", lookback_days: "30" });
  const [alertSaving, setAlertSaving] = useState(false);
  const [alertError, setAlertError] = useState(null);

  const loadAlerts = useCallback(() => { apiGet("/api/monitor/alerts").then(setAlerts).catch(() => {}); }, []);
  useEffect(() => { loadAlerts(); }, []);

  const load = async () => {
    setLoading(true); setError(null); setScores(null); setTrends(null); setRem(null);
    try {
      const [s, t] = await Promise.all([
        apiPost("/api/monitor/scores", { asset_name: asset }),
        apiPost("/api/monitor/trends", { asset_name: asset }).catch(() => null),
      ]);
      setScores(s); setTrends(t);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const loadRemediation = async () => {
    setRemLoading(true);
    try { setRem(await apiPost("/api/monitor/remediation", { asset_name: asset })); }
    catch (e) { setError(e.message); }
    finally { setRemLoading(false); }
  };

  const saveAlert = async () => {
    setAlertSaving(true); setAlertError(null);
    try {
      await apiPost("/api/monitor/alerts/create", {
        asset_name: asset,
        threshold: parseFloat(alertForm.threshold),
        notify_email: alertForm.notify_email,
        lookback_days: parseInt(alertForm.lookback_days, 10),
      });
      setShowAlert(false); loadAlerts();
    } catch (e) { setAlertError(e.message); }
    finally { setAlertSaving(false); }
  };

  const composite = scores?.composite;
  return (
    <div className="space-y-5">
      {/* Asset picker */}
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm flex items-end gap-3">
        <div className="flex-1">
          <Field label="Asset"><input className={INPUT_CLS + " font-mono"} placeholder="e.g. CUSTOMER_MASTER" value={asset} onChange={e => setAsset(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && asset) load(); }}/></Field>
        </div>
        <PrimaryButton onClick={load} running={loading} disabled={!asset}>Load scorecard</PrimaryButton>
        <button onClick={() => setShowAlert(true)} disabled={!asset}
          className={`px-4 py-2 rounded-lg text-sm font-semibold border transition-all ${asset ? "bg-white border-amber-300 text-amber-600 hover:bg-amber-50" : "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed"}`}>
          🔔 Alert rule
        </button>
      </div>
      <ErrorBox error={error}/>

      {scores && (
        <div className="grid grid-cols-3 gap-5">
          <div className="col-span-2 space-y-4">
            {/* Scorecard */}
            <div className="grid grid-cols-3 gap-3">
              <SummaryCard label="Composite score" value={composite != null ? composite.toFixed(1) + "%" : "—"} color={composite == null ? "text-slate-400" : composite >= 90 ? "text-emerald-600" : composite >= 70 ? "text-amber-600" : "text-red-600"}/>
              <SummaryCard label="Rules scored" value={scores.score_count ?? 0}/>
              <SummaryCard label="Dimensions" value={(scores.dimensions || []).length}/>
            </div>
            {scores.score_count === 0 ? (
              <EmptyState icon="⏱" title="No scores on this asset yet — possibly awaiting catalog rollup"
                body="CDGC rolls uploaded DQ scores into the asset scorecard asynchronously — a score uploaded minutes ago may not appear yet. If rules were just published, re-check in a few minutes. Otherwise verify rule occurrences are registered against this asset."/>
            ) : (
              <DataTable
                columns={[
                  { key: "rule", label: "Rule", render: r => <span className="font-mono">{r.rule}</span> },
                  { key: "dimension", label: "Dimension", render: r => <DimChip dim={r.dimension}/> },
                  { key: "value", label: "Score", render: r => <span className={`font-bold ${Number(r.value) >= 90 ? "text-emerald-600" : Number(r.value) >= 70 ? "text-amber-600" : "text-red-600"}`}>{r.value != null && r.value !== "" ? `${r.value}%` : "—"}</span> },
                  { key: "exception", label: "Exceptions", render: r => <span className={r.exception > 0 ? "text-red-500 font-semibold" : "text-slate-400"}>{r.exception ?? 0}{r.total ? ` / ${r.total}` : ""}</span> },
                  { key: "lastRun", label: "Last run" },
                ]}
                rows={scores.scores || []}
              />
            )}

            {/* Trend */}
            {trends && (
              <div className="border border-slate-200 rounded-xl overflow-hidden bg-white">
                <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Score trend — last {trends.lookback_days} days (threshold ±{trends.threshold})</span>
                  <div className="flex gap-3 text-xs">
                    <span className="text-red-600 font-semibold">{(trends.degrading || []).length} degrading</span>
                    <span className="text-emerald-600 font-semibold">{(trends.improving || []).length} improving</span>
                    <span className="text-slate-500">{(trends.stable || []).length} stable</span>
                  </div>
                </div>
                <div className="divide-y divide-slate-50">
                  {(trends.degrading || []).map((e, i) => <TrendRow key={"d" + i} entry={e} tone="down"/>)}
                  {(trends.improving || []).map((e, i) => <TrendRow key={"i" + i} entry={e} tone="up"/>)}
                  {(trends.stable || []).map((e, i) => <TrendRow key={"s" + i} entry={e} tone="flat"/>)}
                  {(trends.no_history || []).length > 0 && (
                    <div className="px-4 py-2 text-xs text-slate-400 italic">
                      {(trends.no_history || []).length} rule(s) have fewer than 2 trend points — trend needs at least two scans.
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* Remediation side panel */}
          <div className="space-y-3">
            <div className="border border-slate-200 rounded-xl bg-white overflow-hidden">
              <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Remediation</span>
                <button onClick={loadRemediation} className="text-xs text-brand font-medium hover:underline">{remLoading ? "Analyzing…" : rem ? "↻ Refresh" : "Analyze"}</button>
              </div>
              {!rem ? (
                <div className="p-4 text-xs text-slate-400 italic">Run analysis to surface failing rules with suggested remediation focus areas.</div>
              ) : (
                <div className="divide-y divide-slate-100">
                  <div className="px-4 py-2 text-xs text-slate-500">
                    {rem.summary?.failing_rule_count ?? 0} of {rem.summary?.rule_count ?? 0} rules failing · {rem.summary?.total_exceptions ?? 0} exceptions
                  </div>
                  {(rem.suggestion_seeds || []).map((s, i) => (
                    <div key={i} className="px-4 py-2.5">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-mono font-semibold text-slate-700 truncate">{s.rule}</span>
                        <DimChip dim={s.dimension}/>
                      </div>
                      <div className="text-xs text-slate-500 mt-1">→ {s.suggested_focus}</div>
                    </div>
                  ))}
                  {(rem.suggestion_seeds || []).length === 0 && <div className="p-4 text-xs text-emerald-600">All rules healthy — nothing to remediate. ✓</div>}
                </div>
              )}
            </div>

            {/* Alert rules list */}
            <div className="border border-slate-200 rounded-xl bg-white overflow-hidden">
              <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200">
                <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Alert rules</span>
              </div>
              <div className="divide-y divide-slate-100">
                {(alerts?.alerts || []).map(a => (
                  <div key={a.id} className="px-4 py-2.5">
                    <div className="text-xs font-semibold text-slate-700">{a.asset_name}</div>
                    <div className="text-xs text-slate-500">drop ≥ {a.threshold} pts / {a.lookback_days}d → {a.notify_email}</div>
                  </div>
                ))}
                {(!alerts || (alerts.alerts || []).length === 0) && <div className="p-4 text-xs text-slate-400 italic">No alert rules configured.</div>}
              </div>
              {/* Be precise about where the alert lives — this is our platform, not CDGC */}
              <div className="px-4 py-2 bg-amber-50 border-t border-amber-100 text-xs text-amber-700">
                Thresholds are stored by <strong>this platform</strong> and evaluated by our scheduler — CDGC exposes no alert-registration API.
              </div>
            </div>
          </div>
        </div>
      )}

      {!scores && !loading && (
        <div className="text-sm text-slate-400 italic px-2">Enter an asset name to load its DQ scorecard, trend and remediation guidance.</div>
      )}

      {/* Alert modal */}
      {showAlert && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50" onClick={() => setShowAlert(false)}>
          <div className="bg-white rounded-2xl shadow-2xl p-6 w-96 space-y-4" onClick={e => e.stopPropagation()}>
            <div>
              <div className="text-sm font-bold text-slate-800">Alert on score degradation</div>
              <div className="text-xs text-slate-500 mt-0.5">Asset: <span className="font-mono">{asset}</span></div>
            </div>
            <Field label="Alert when score drops by at least (points)">
              <input type="number" className={INPUT_CLS} value={alertForm.threshold} onChange={e => setAlertForm(f => ({ ...f, threshold: e.target.value }))}/>
            </Field>
            <Field label="Notify email">
              <input type="email" className={INPUT_CLS} placeholder="steward@company.com" value={alertForm.notify_email} onChange={e => setAlertForm(f => ({ ...f, notify_email: e.target.value }))}/>
            </Field>
            <Field label="Lookback window (days)">
              <input type="number" className={INPUT_CLS} value={alertForm.lookback_days} onChange={e => setAlertForm(f => ({ ...f, lookback_days: e.target.value }))}/>
            </Field>
            <div className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2.5">
              Stored locally by this platform (.dq_monitor_alerts.json) and evaluated by our scheduler — not registered in CDGC.
            </div>
            <ErrorBox error={alertError}/>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setShowAlert(false)} className="px-4 py-2 rounded-lg text-sm text-slate-500 border border-slate-300 bg-white hover:bg-slate-50">Cancel</button>
              <PrimaryButton onClick={saveAlert} running={alertSaving} disabled={!alertForm.notify_email} tone="emerald">Save alert</PrimaryButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function NodeChip({ name, type, location }) {
  return (
    <span className="inline-flex flex-col bg-white border border-slate-200 rounded-lg px-2.5 py-1 max-w-[240px]" title={location || name}>
      <span className="text-xs font-mono font-semibold text-slate-700 truncate">{name || "?"}</span>
      <span className="text-xs text-slate-400 truncate">{(type || "").split(".").pop()}</span>
    </span>
  );
}

// The claimed differentiator is programmatic access + severity classification —
// a node-and-edge rendering is sufficient, not the IDMC lineage visualiser.
function EdgeList({ edges }) {
  const byDistance = {};
  (edges || []).forEach(e => {
    const d = e.distance ?? 1;
    (byDistance[d] = byDistance[d] || []).push(e);
  });
  const distances = Object.keys(byDistance).map(Number).sort((a, b) => a - b);
  return (
    <div className="space-y-3">
      {distances.map(d => (
        <div key={d} className="border border-slate-200 rounded-xl bg-white overflow-hidden">
          <div className="px-4 py-1.5 bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">Hop {d}</div>
          <div className="divide-y divide-slate-50">
            {byDistance[d].map((e, i) => (
              <div key={i} className="flex items-center gap-3 px-4 py-2 flex-wrap">
                <NodeChip name={e.from} type={e.fromType} location={e.fromLocation}/>
                <span className="text-slate-400 text-sm shrink-0">→</span>
                <NodeChip name={e.to} type={e.toType} location={e.toLocation}/>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// Lineage that returns nothing is a legitimate state, not a broken feature.
function LineageEmptyState({ assetName }) {
  return (
    <EmptyState icon="⬡" title={`No dataflow has been cataloged for ${assetName || "this asset"} yet`}
      body="Lineage populates once CDI mappings / ETL jobs referencing this asset are scanned into CDGC. Sample tables loaded directly (e.g. TPC-DS seeds) have no upstream pipeline, so an empty graph is expected. Pick an asset fed by a cataloged mapping to see edges."/>
  );
}

function AssetNotFound({ error, assetName }) {
  const notFound = /no asset|not found|no results/i.test(String(error || ""));
  if (!notFound) return <ErrorBox error={error}/>;
  return (
    <EmptyState icon="🔍" title={`"${assetName}" not found in the catalog`}
      body="Name-to-identity resolution returned nothing — the asset may not be cataloged yet, or the name differs from the catalog entry. Try the exact table name as shown in Discover."/>
  );
}

    <div className="space-y-5">
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm flex items-end gap-3">

      {data && (
        <div className="space-y-4">
          <div className="grid grid-cols-4 gap-3">
            <SummaryCard label="Terms scanned" value={data.term_count ?? 0}/>

            <SummaryCard label="Orphans" value={(data.orphans || []).length} color={(data.orphans || []).length ? "text-amber-600" : "text-emerald-600"}/>

          {(data.duplicates || []).length > 0 && (
            <div className="border border-red-200 rounded-xl bg-white overflow-hidden">
              <div className="px-4 py-2 bg-red-50 border-b border-red-100 text-xs font-semibold text-red-600 uppercase tracking-wider">Duplicate names — merge candidates</div>
              <div className="divide-y divide-slate-50">
                {data.duplicates.map((d, i) => (
                  <div key={i} className="px-4 py-2 flex items-center gap-3">
                    <span className="text-sm font-medium text-slate-700">{d.name}</span>

            <div className="border border-amber-200 rounded-xl bg-white overflow-hidden">
              <div className="px-4 py-2 bg-amber-50 border-b border-amber-100 text-xs font-semibold text-amber-600 uppercase tracking-wider">Orphaned terms — no relationships (first 50 terms checked)</div>
              <div className="p-3 flex flex-wrap gap-1.5">
                {data.orphans.map((o, i) => <span key={i} className="text-xs bg-amber-50 border border-amber-200 text-amber-700 px-2 py-0.5 rounded font-medium">{o.name}</span>)}
              </div>
            </div>
          )}
          {(data.gaps || []).length > 0 && (
            <div className="border border-slate-200 rounded-xl bg-white overflow-hidden">

              <div className="divide-y divide-slate-50">
                {data.gaps.map((g, i) => (

            <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-sm font-semibold text-emerald-800">✓ Glossary is healthy — no duplicates, orphans or definition gaps in the scanned sample.</div>
          )}
        </div>
      )}
    </div>
  );
}

function GlossaryTermsScreen() {
  // Suggest-from-asset flow
  const [suggestForm, setSuggestForm] = useState({ asset_name: "", domain_context: "" });
  const [suggesting, setSuggesting]   = useState(false);
  const [suggestions, setSuggestions] = useState(null);
  const [selTerms, setSelTerms]       = useState(new Set());
  const [bulkCreating, setBulkCreating] = useState(false);
  const [bulkDone, setBulkDone]       = useState(null);
  // Standalone create — how a steward creates a term outside the pipeline
  const [form, setForm] = useState({ term_name: "", definition: "", category: "", synonyms: "" });
  const [creating, setCreating] = useState(false);
  const [created, setCreated]   = useState(null);
  const [error, setError]       = useState(null);

  const suggest = async () => {
    setSuggesting(true); setError(null); setSuggestions(null); setBulkDone(null);
    try {
      const body = { asset_name: suggestForm.asset_name };
      if (suggestForm.domain_context) body.domain_context = suggestForm.domain_context;
      const out = await apiPost("/api/glossary/suggest", body);
      setSuggestions(out);
      setSelTerms(new Set((out.suggestions || []).map(s => s.suggested_term)));
    } catch (e) { setError(e.message); }
    finally { setSuggesting(false); }
  };

  const createSelected = async () => {
    setBulkCreating(true); setError(null);
    const done = [];
    for (const s of (suggestions?.suggestions || []).filter(x => selTerms.has(x.suggested_term))) {
      try {
        const r = await apiPost("/api/glossary/term/create", {
          term_name: s.suggested_term, definition: s.definition || `Business term derived from ${s.source_column}.`,
          synonyms: s.synonyms || [],
        });
        done.push({ name: s.suggested_term, ok: true, id: r.id });
      } catch (e) { done.push({ name: s.suggested_term, ok: false, error: e.message }); }
    }
    setBulkDone(done);
    setBulkCreating(false);
  };

  const createStandalone = async () => {
    setCreating(true); setError(null); setCreated(null);
    try {
      const body = { term_name: form.term_name, definition: form.definition };
      if (form.category) body.category = form.category;
      if (form.synonyms) body.synonyms = form.synonyms.split(",").map(s => s.trim()).filter(Boolean);
      setCreated(await apiPost("/api/glossary/term/create", body));
    } catch (e) { setError(e.message); }
    finally { setCreating(false); }
  };

  return (
    <div className="space-y-5">
      <ErrorBox error={error}/>
      {/* Standalone create */}
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Create a term — standalone</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Term name"><input className={INPUT_CLS} placeholder="e.g. Customer Lifetime Value" value={form.term_name} onChange={e => setForm(f => ({ ...f, term_name: e.target.value }))}/></Field>
          <Field label="Parent category (optional)"><input className={INPUT_CLS} placeholder="external id, or id:<internal>" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}/></Field>
        </div>
        <Field label="Definition"><textarea className={INPUT_CLS} rows="2" placeholder="Business-facing description" value={form.definition} onChange={e => setForm(f => ({ ...f, definition: e.target.value }))}/></Field>
        <Field label="Synonyms (comma-separated, optional)"><input className={INPUT_CLS} placeholder="CLV, LTV" value={form.synonyms} onChange={e => setForm(f => ({ ...f, synonyms: e.target.value }))}/></Field>
        <PrimaryButton onClick={createStandalone} running={creating} disabled={!form.term_name || !form.definition} tone="emerald">＋ Create business term</PrimaryButton>
        {created && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800">
            ✓ <strong>{created.name}</strong> created in CDGC — id <span className="font-mono">{created.id || "?"}</span>
          </div>
        )}
      </div>

      {/* Suggest from asset */}
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Suggest terms from an asset's columns</div>
        <div className="grid grid-cols-3 gap-3 items-end">
          <div className="col-span-2">
            <Field label="Asset"><input className={INPUT_CLS + " font-mono"} value={suggestForm.asset_name} onChange={e => setSuggestForm(f => ({ ...f, asset_name: e.target.value }))}/></Field>
          </div>
          <Field label="Domain hint (optional)"><input className={INPUT_CLS} placeholder="Finance, Customer…" value={suggestForm.domain_context} onChange={e => setSuggestForm(f => ({ ...f, domain_context: e.target.value }))}/></Field>
        </div>
        <PrimaryButton onClick={suggest} running={suggesting} disabled={!suggestForm.asset_name}>❋ Suggest terms</PrimaryButton>
        {suggestions && (suggestions.suggestions || []).length === 0 && (
          <EmptyState title={suggestions.note || "No columns found to derive terms from"}
            body="The asset either wasn't found in the catalog or exposes no column metadata. Scan it first (Govern → Scan Table), then retry."/>
        )}
        {suggestions && (suggestions.suggestions || []).length > 0 && (
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{selTerms.size} / {suggestions.suggestions.length} selected</span>
              <PrimaryButton onClick={createSelected} running={bulkCreating} disabled={selTerms.size === 0} tone="emerald">✓ Create {selTerms.size} terms</PrimaryButton>
            </div>
            <div className="rounded-xl border border-slate-200 bg-white overflow-hidden divide-y divide-slate-100 max-h-96 overflow-y-auto scrollbar-thin">
              {suggestions.suggestions.map((s, i) => {
                const isSel = selTerms.has(s.suggested_term);
                const result = (bulkDone || []).find(d => d.name === s.suggested_term);
                return (
                  <div key={i} className={`flex items-start gap-3 px-4 py-2.5 ${isSel ? "bg-white" : "bg-slate-50 opacity-60"}`}>
                    <input type="checkbox" checked={isSel} className="accent-violet-600 cursor-pointer w-3.5 h-3.5 shrink-0 mt-0.5"
                      onChange={() => setSelTerms(prev => { const n = new Set(prev); n.has(s.suggested_term) ? n.delete(s.suggested_term) : n.add(s.suggested_term); return n; })}/>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-sm font-semibold text-slate-800">{s.suggested_term}</span>
                        <span className="text-xs text-slate-400 font-mono">← {s.source_column}</span>
                        {s.confidence != null && <span className="text-xs text-slate-400">{fmtPct(s.confidence)} confidence</span>}
                        {result && (result.ok
                          ? <span className="text-xs text-emerald-600 font-semibold">✓ created</span>
                          : <span className="text-xs text-red-500 font-semibold" title={result.error}>✗ failed</span>)}
                      </div>
                      <div className="text-xs text-slate-500 mt-0.5">{s.definition}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AdminRuleLibraryScreen() {
  const [orgRules, setOrgRules]   = useState(null);
  const [templates, setTemplates] = useState(null);
  const [error, setError]         = useState(null);
  // Author a custom rule from plain English + a validated template
  const [form, setForm] = useState({ rule_name: "", description: "", dimension: "COMPLETENESS", rule_template: "" });
  const [validating, setValidating] = useState(false);
  const [validation, setValidation] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [saved, setSaved]     = useState(null);
  const [saveError, setSaveError] = useState(null);

  const load = useCallback(async () => {
    setError(null);
    try {
      const [org, tpl] = await Promise.all([
        apiPost("/api/admin/rules/list", { top: 100 }).catch(e => ({ rules: [], _err: e.message })),
        apiGet("/api/admin/rule_templates"),
      ]);
      setOrgRules(org); setTemplates(tpl);
      if (org._err) setError(org._err);
    } catch (e) { setError(e.message); }
  }, []);
  useEffect(() => { load(); }, []);

  const validate = async () => {
    setValidating(true); setValidation(null); setSaveError(null);
    try {
      const body = { dimension: form.dimension };
      if (form.rule_template) body.rule_template = `examples/${form.rule_template}`;
      setValidation(await apiPost("/api/admin/rules/validate", body));
    } catch (e) { setValidation({ valid: false, error: e.message }); }
    finally { setValidating(false); }
  };

  // Multi-step create with rollback on the server — surface as ONE action.
  const save = async () => {
    setSaving(true); setSaveError(null); setSaved(null);
    try {
      const body = { rule_name: form.rule_name, description: form.description, dimension: form.dimension };
      if (form.rule_template) body.rule_template = `examples/${form.rule_template}`;
      setSaved(await apiPost("/api/admin/rules/create", body));
      load();
    } catch (e) { setSaveError(e.message); }
    finally { setSaving(false); }
  };

  return (
    <div className="space-y-5">
      <ErrorBox error={error}/>

      {/* Author panel */}
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Author a rule specification</div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Rule name"><input className={INPUT_CLS} placeholder="e.g. DQ_EMAIL_FORMAT" value={form.rule_name} onChange={e => setForm(f => ({ ...f, rule_name: e.target.value }))}/></Field>
          <Field label="Dimension">
            <select className={INPUT_CLS} value={form.dimension} onChange={e => setForm(f => ({ ...f, dimension: e.target.value }))}>
              {DQ_DIMENSIONS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Describe the rule in plain English" hint="Stored as the rule's business description in CDQ.">
          <textarea className={INPUT_CLS} rows="2" placeholder="e.g. Customer email must be present and match a valid email pattern" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))}/>
        </Field>
        <Field label="Rule logic template" hint="The template supplies the executable logic; its DIMENSION overrides the selection above.">
          <select className={INPUT_CLS} value={form.rule_template} onChange={e => { setForm(f => ({ ...f, rule_template: e.target.value })); setValidation(null); }}>
            <option value="">Built-in null check (COMPLETENESS)</option>
            {(templates?.templates || []).map(t => <option key={t.file} value={t.file}>{t.template} — {t.dimension}</option>)}
          </select>
        </Field>
        <div className="flex items-center gap-3">
          {/* validate_rule runs as a pre-flight check before save */}
          <button onClick={validate} disabled={validating}
            className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold border border-indigo-300 bg-white text-indigo-600 hover:bg-indigo-50 transition-all">
            {validating ? <><Spinner/> Validating…</> : "✓ Validate"}
          </button>
          <PrimaryButton onClick={save} running={saving} disabled={!form.rule_name} tone="emerald">💾 Save to CDQ</PrimaryButton>
          {validation && (validation.valid
            ? <span className="text-xs text-emerald-600 font-semibold">✓ Rule logic is valid — safe to deploy</span>
            : <span className="text-xs text-red-500 font-semibold" title={validation.error || JSON.stringify(validation.raw?.error)}>✗ Validation failed{validation.raw?.error ? `: ${String(validation.raw.error).slice(0, 120)}` : ""}</span>)}
        </div>
        <ErrorBox error={saveError}/>
        {saved && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800 space-y-0.5">
            <div>✓ Rule <strong>{saved.name}</strong> created — state <span className="font-mono">{saved.documentState}</span></div>
            {saved.ui_url && <a href={saved.ui_url} target="_blank" rel="noreferrer" className="text-brand underline">Open in CDQ ↗</a>}
          </div>
        )}
      </div>

      {/* Template library — local JSON, rendered alongside org rules, labelled */}
      <div>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Template library ({templates?.count ?? 0} local templates)</div>
        <div className="grid grid-cols-2 gap-3">
          {(templates?.templates || []).map(t => (
            <div key={t.file} className="bg-white border border-slate-200 rounded-xl p-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-sm font-mono font-semibold text-slate-800">{t.template}</span>
                <DimChip dim={t.dimension}/>
                <span className="text-xs bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">local template</span>
              </div>
              <div className="text-xs text-slate-400 mt-1">fields: {(t.fields || []).join(", ") || "—"}{Object.keys(t.options || {}).length ? ` · knobs: ${Object.entries(t.options).map(([k, v]) => `${k}=${v}`).join(", ")}` : ""}</div>
              {t.description && <div className="text-xs text-slate-500 mt-1 italic truncate" title={t.description}>{t.description}</div>}
            </div>
          ))}
        </div>
      </div>

      {/* Org rules */}
      <div>
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Rule specifications in this org ({orgRules?.count ?? "…"})</div>
        <DataTable
          columns={[
            { key: "name", label: "Rule", render: r => <span className="font-mono font-medium">{r.name}</span> },
            { key: "dimension", label: "Dimension", render: r => <DimChip dim={r.dimension}/> },
            { key: "description", label: "Description", render: r => <span className="text-slate-500">{(r.description || "—").slice(0, 60)}</span> },
            { key: "createdBy", label: "Created by" },
            { key: "lastUpdatedTime", label: "Updated" },
          ]}
          rows={orgRules?.rules || []}
        />
      </div>
    </div>
  );
}

function AdminExportImportScreen() {
  const [ids, setIds]         = useState("");
  const [name, setName]       = useState("");
  const [exporting, setExporting] = useState(false);
  const [exportOut, setExportOut] = useState(null);
  const [error, setError]     = useState(null);
  const [importFile, setImportFile] = useState(null);
  const [importing, setImporting]   = useState(false);
  const [importOut, setImportOut]   = useState(null);
  const [importError, setImportError] = useState(null);

  const doExport = async () => {
    setExporting(true); setError(null); setExportOut(null);
    try {
      const object_ids = ids.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      const body = { object_ids };
      if (name) body.name = name;
      setExportOut(await apiPost("/api/admin/export", body));
    } catch (e) { setError(e.message); }
    finally { setExporting(false); }
  };

  const doImport = async () => {
    if (!importFile) return;
    setImporting(true); setImportError(null); setImportOut(null);
    try {
      const b64 = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(",")[1] || "");
        fr.onerror = reject;
        fr.readAsDataURL(importFile);
      });
      setImportOut(await apiPost("/api/admin/import", { filename: importFile.name, content_base64: b64 }));
    } catch (e) { setImportError(e.message); }
    finally { setImporting(false); }
  };

  return (
    <div className="space-y-5">
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Export assets</div>
        <Field label="Object IDs (comma or newline separated)" hint="v3 asset ids — mappings, tasks, taskflows, connections.">
          <textarea className={INPUT_CLS + " font-mono"} rows="3" value={ids} onChange={e => setIds(e.target.value)}/>
        </Field>
        <Field label="Package name (optional)"><input className={INPUT_CLS} placeholder="export" value={name} onChange={e => setName(e.target.value)}/></Field>
        <PrimaryButton onClick={doExport} running={exporting} disabled={!ids.trim()}>⇩ Export {exporting ? "(polling the export job…)" : ""}</PrimaryButton>
        <ErrorBox error={error}/>
        {exportOut && (
          <div className={`rounded-lg p-3 text-xs space-y-1.5 border ${exportOut.package_path ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-amber-50 border-amber-200 text-amber-800"}`}>
            <div>Job <span className="font-mono">{exportOut.job_id}</span> — state <strong>{exportOut.state}</strong>{exportOut.package_bytes ? ` · ${(exportOut.package_bytes / 1024).toFixed(1)} KB` : ""}</div>
            {exportOut.message && <div>{exportOut.message}</div>}
            {exportOut.download_url && (
              <a href={exportOut.download_url} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-500 transition-colors">⬇ Download package</a>
            )}
          </div>
        )}
      </div>

      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Import package</div>
        <Field label="Asset ZIP (from a previous export)" hint="Conflicts resolve as REUSE — existing assets are kept, not overwritten.">
          <input type="file" accept=".zip" className="text-sm text-slate-600" onChange={e => setImportFile(e.target.files?.[0] || null)}/>
        </Field>
        <PrimaryButton onClick={doImport} running={importing} disabled={!importFile}>⇧ Import {importing ? "(upload + commit + poll…)" : ""}</PrimaryButton>

          <div className={`rounded-lg p-3 text-xs border ${(importOut.state || "").includes("SUCCESS") ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-amber-50 border-amber-200 text-amber-800"}`}>

          </div>
        )}
      </div>
    </div>
  );
}
