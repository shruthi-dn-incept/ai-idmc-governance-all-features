    else if (ss.form === "mccscan") {
      const names = mccForm.tables.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      if (!names.length) return;
      body = { table_names: names };
      if (mccForm.schema_hint) body.schema_hint = mccForm.schema_hint;
    }
    setSubRunning(prev => ({ ...prev, [ss.key]: true }));
    setErrors(prev => ({ ...prev, [step.id]: null }));
    // Requirement 7: after an individual run on a composite step, the dot is
    // re-derived from ALL per-tool outcomes present so far — one failing tool
    // must flip it, one succeeding tool must not paper over earlier failures.
    const settle = (outcome) => {
      if (step.substepsInParent) {
        const merged = { ...(resultsRef.current[step.id] || {}), [ss.key]: outcome };
        const compErr = compositeFailure(step, merged);
        setResults(prev => ({ ...prev, [step.id]: merged }));
        setStatuses(prev => ({ ...prev, [step.id]: compErr ? STATUS.error : STATUS.done }));
        setErrors(prev => ({ ...prev, [step.id]: compErr }));
      } else {
        setSubResults(prev => ({ ...prev, [step.id]: { ...(prev[step.id] || {}), [ss.key]: outcome } }));
      }
    };
    try {
      const data = await apiPost(ss.route, body);
      settle(data);
      // A rule authored at the gate joins the selection and is approved with the rest.
      if (ss.key === "create_dq_rules" && data?.id) {
        setRecItems(prev => prev.length
          ? [...prev, { type: data.dimension || ruleForm.dimension, name: data.name,
                        subtitle: "authored manually — already in CDQ (" + (data.documentState || "?") + ")" }]
          : prev);
        setRecSelected(prev => { const n = new Set(prev); n.add(data.name); return n; });
      }
      // A triggered run joins the live monitoring panel.
      if (ss.key === "run_task" && data?.runId) {
        setJobRuns(prev => [{ runId: data.runId, taskId: body.task_id, taskName: data.taskName || body.task_id, entry: null, state_label: "QUEUED" }, ...prev]);
      }
    } catch(e) {
      settle({ status: "failed", error: e.message });
    } finally {
      setSubRunning(prev => ({ ...prev, [ss.key]: false }));
    }
  }, [propagateForm, lineageForm, glossForm, monitorForm, scanTable, scanSchema, scanDatabase, profileObject, profileSchema, profileDatabase, ruleForm, mtaskForm, dqTaskForm, scheduleForm, taskflowForm, runTaskId, jobRuns, mccForm]);

  const runStep = useCallback(async (stepId) => {
    const controller = new AbortController();
    abortRef.current = controller;
    setStatus(stepId, STATUS.running);
    setErrors(prev => ({ ...prev, [stepId]: null }));
    try {
      let data;
      const sig = controller.signal;
      // Basis for full-schema time estimates on steps 3-6 (from the Scan sample).
      const estBasis = {
        sample: results.scan?.tables_scanned ?? (results.scan?.columns?.filter(Boolean).length || 0),
        total:  results.scan?.total_in_schema ?? 0,
      };
      if      (stepId === "discover")         data = await apiPost("/api/step/discover", {}, sig);
      else if (stepId === "scan") {
        const isAllSchemas = scanSchema === "__ALL_SCHEMAS__";
        const isAll = isAllSchemas || scanTable === "__ALL__";
        let scanTableNames = [];
        let totalInSchema  = 0;
        let schemaArg      = scanSchema;
        if (isAllSchemas) {
          // Sample a couple of tables from every schema across all sources; extrapolate to the grand total.
          const groups = results.discover?.result?.catalog_sources_grouped || [];
          const sample = [];
          groups.forEach(cs => (cs.schemas || []).forEach(s => {
            const tbls = s.tables || [];
            totalInSchema += tbls.length;
            tbls.slice(0, 2).forEach(t => { if (sample.length < 10) sample.push(t.name); });
          }));
          scanTableNames = sample;
          schemaArg = "";   // cross-schema — backend resolves each table by name
        } else if (isAll) {
          const src = (results.discover?.result?.catalog_sources_grouped || []).find(cs => cs.source === scanSource);
          const schemaObj = (src?.schemas || []).find(s => s.schema === scanSchema);
          const allTables = schemaObj?.tables || [];
          totalInSchema   = allTables.length || (results.discover?.result?.tables_for_selection || []).filter(t => t.schema === scanSchema).length;
          const fromGrouped = allTables.map(t => t.name).slice(0, 5);
          if (fromGrouped.length > 0) {
            scanTableNames = fromGrouped;
          } else {
            scanTableNames = (results.discover?.result?.tables_for_selection || [])
              .filter(t => t.schema === scanSchema)
              .map(t => t.name)
              .slice(0, 5);
          }
        }
        data = await apiPost("/api/step/scan", {
          table:                  isAll ? "" : scanTable,
          schema:                 schemaArg,
          scan_all:               isAll,
          table_names:            scanTableNames,
          total_tables_in_schema: totalInSchema,
        }, sig);
      }
      else if (stepId === "profile") {
        const scanned = (resultsRef.current.scan?.columns || []).map(c => c?.table).filter(Boolean);
        const objName = profileObject || (scanTable && scanTable !== "__ALL__" ? scanTable : "") || scanned[0] || "";
        if (!objName) throw new Error("Pick a table to profile — scan one first, or type a name above.");
        // The step-3 card's effect prefills profileSchema/profileDatabase from the
        // discover grouping; read that state (fallback to scanSchema) and carry the
        // {database, schema, table} triple — the fix for the wrong-schema failure.
        const schemaArg = profileSchema || scanSchema || undefined;
        // Carry the database chosen at step 2 forward when step 3's own prefill
        // didn't set one — the {database, schema, table} triple is inherited, not re-picked.
        const dbArg = profileDatabase || scanDatabase || undefined;
        if (profileMode === "local") {
          data = await apiPost("/api/step/profile", { object_name: objName, mode: "local", database: dbArg, schema: schemaArg }, sig);
        } else {
          // Asynchronous: start the IDMC job, poll it, then read stats from CDGC.
          const exec = await apiPost("/api/step/profile", { object_name: objName, mode: "service" }, sig);
          const jobId = exec.profile_job_id;
          if (jobId) {
            for (let i = 0; i < 40; i++) {
              if (sig.aborted) { const e = new Error("aborted"); e.name = "AbortError"; throw e; }
              await new Promise(r => setTimeout(r, 6000));
              try {
                const st = await apiPost("/api/profile/job_status", { job_id: jobId }, sig);
                const s = String(st.job?.status || "").toUpperCase();
                if (["COMPLETE", "SUCCESS", "FINISH"].some(x => s.includes(x))) break;
                if (["FAILED", "ERROR", "CANCEL"].some(x => s.includes(x))) {
                  throw new Error(`Profiling job ${s}: ${st.job?.errorMessage || "see IDMC monitor"}`);
                }
              } catch (pe) {
                if (pe.name === "AbortError" || /Profiling job/.test(pe.message)) throw pe;
              }
            }
          }
          data = await apiPost("/api/step/get_profile_results", { object_name: objName }, sig);
        }
        // Item 1 (correctness): reject a stale/mismatched profile rather than
        // relabeling it under the selected table. The local path echoes
        // source.object; the service path echoes asset.name (the table CDGC
        // actually resolved). A mismatch means this table's run did not produce
        // these stats — surface it and store nothing, or steps 4/7 inherit
        // another table's statistics (the 242-distinct-over-240-rows bug).
        const returnedId = String(data?.source?.object || data?.asset?.name || "").trim();
        if (returnedId && objName && returnedId.toLowerCase() !== objName.toLowerCase()) {
          throw new Error(`Profiling returned results for "${returnedId}", not "${objName}" — the run for `
            + `this table did not complete. Nothing was stored; re-run Profile Data.`);
        }
        data.object_name = objName;
        // Tag with the selection triple so the panel is never rendered for a
        // different {connection, schema, table} (rule 1) and the store stays clean.
        data._selection = { connection: scanSource || "", schema: scanSchema || "", table: objName };
        // Persist to the session store — steps 4 and 7 read from here, never
        // from the profiling tools directly.
        try {
          await apiPost("/api/profile_state", { connection: scanSource || "", schema: scanSchema || "", table: objName, profile: data });
        } catch (e) {}
      }
      else if (stepId === "taxonomy") {
        // Collect scanned table names from the scan result columns
        const scannedCols = results.scan?.columns || [];
        const scannedNames = scannedCols.map(c => c?.table).filter(Boolean);
        const profObj = profileObject || (scanTable && scanTable !== "__ALL__" ? scanTable : "") || scannedNames[0] || "";
        data = await apiPost("/api/step/taxonomy", {
          table_names: scannedNames,
          sample_tables: estBasis.sample, total_in_schema: estBasis.total,
          // Step 3 profile identity — grounds classification in the data.
          connection: scanSource || "", schema: scanSchema || "", table: profObj,
        }, sig);
      }
      else if (stepId === "recommend_rules") {
        const scanned = (resultsRef.current.scan?.columns || []).map(c => c?.table).filter(Boolean);
        const profObj = profileObject || (scanTable && scanTable !== "__ALL__" ? scanTable : "") || scanned[0] || "";
        const out = await apiPost("/api/step/recommend_rules", {
          connection: scanSource || "", schema: scanSchema || "", table: profObj,
        }, sig);
        const recs = out.recommendations || [];
        // Open Gate 3: dimension-grouped review; approving pushes into step 8.
        const items = recs.map((r, i) => ({
          type: r.dimension || "OTHER",
          name: r.suggested_rule_name || `${r.column_name}-${r.dimension}-${i}`,
          parent: r.column_name,
          subtitle: r.rationale,
        }));
        setRecItems(items);
        setRecSelected(new Set(items.map(it => it.name)));
        abortRef.current = null;
        setStatus(stepId, STATUS.idle);
        if (!items.length) {
          setResults(prev => ({ ...prev, recommend_rules: { recommendation_count: 0, approved: [] } }));
          setStatus(stepId, STATUS.done);
          return "done";
        }
        return "gate";
      }
      else if (stepId === "schedule_execution") data = await apiPost("/api/step/schedule_execution", {}, sig);
      else if (stepId === "domain_structure") {
        const preview = await apiPost("/api/step/domain_structure/preview", {
          sample_tables: estBasis.sample, total_in_schema: estBasis.total,
        }, sig);
        if (preview?.result?.awaiting_approval) {
          const allItems = preview.result.items || [];
          setDomainItems(allItems);
          setDomainSelected(new Set(allItems.map(i => i.name)));
          setDomainRenames({});
          abortRef.current = null;
          setStatus(stepId, STATUS.idle);
          return "gate";
        }
        data = preview;
      }
      else if (stepId === "curate") {
        // Gate 2: batches run dry — the LLM proposes links; approving writes
        // exactly the selected subset. Deselected columns stay unlinked.
        const out = await apiPost("/api/step/curate", { sample_tables: estBasis.sample, total_in_schema: estBasis.total }, sig);
        const matches = out.matches || [];
        if (out.awaiting_approval && matches.length) {
          const seen = {};
          const items = matches.map(m => {
            let nm = `${m.table}.${m.column}`;
            seen[nm] = (seen[nm] || 0) + 1;
            if (seen[nm] > 1) nm = `${nm} (${seen[nm]})`;
            const band = m.confidence == null ? "Unscored" : m.confidence >= 0.8 ? "High confidence" : "Medium confidence";
            return { type: band, name: nm, parent: m.term_name,
                     subtitle: `→ ${m.term_name} · ${m.confidence != null ? Math.round(m.confidence * 100) + "% match" : "unscored"}${m.data_type ? " · " + m.data_type : ""}`,
                     match: m };
          });
          setCurMatches(items);
          setCurSelected(new Set(items.map(it => it.name)));
          abortRef.current = null;
          setStatus(stepId, STATUS.idle);
          return "gate";
        }
        data = { ...out, applied: { linked: 0, skipped: 0, errors: [] }, note: "No links proposed by the matcher." };
      }
      // Step 8 = rules + occurrences only; the score upload moved to step 10
      // (upload_dq_scores substep). /api/step/data_quality (rules+scores fused)
      // stays server-side for the run-all path but no ladder step calls it.
      else if (stepId === "data_quality")      data = await apiPost("/api/step/dq_rules", {}, sig);
      else if (stepId === "publish_governance")    data = await apiPost("/api/step/mcc_scan", {}, sig);
      else if (stepId === "monitor_quality") {
        // Entered cold by design — the selector inherits nothing.
        if (!monitorForm.asset_name) throw new Error("Enter an asset name above — Monitor Quality inherits no upstream selection.");
        data = await apiPost("/api/step/monitor_quality", { asset_name: monitorForm.asset_name }, sig);
      }
      else if (stepId === "create_collection")     data = await apiPost("/api/step/create_collection", {}, sig);
      else if (stepId === "publish_marketplace")   data = await apiPost("/api/step/publish_marketplace", {}, sig);
      else if (stepId === "configure_delivery")    data = await apiPost("/api/step/configure_delivery", {}, sig);
      else if (stepId === "consumer_access")       data = await apiPost("/api/step/consumer_access", {}, sig);

      abortRef.current = null;
      setResults(prev => ({ ...prev, [stepId]: data }));
      // An error-shaped result ({error} or {result:{error}}) carries no status field,
      // so it must be detected explicitly — otherwise a hard failure renders as a
      // green "Completed 0/0/0" (the step's summary reads empty created/skipped/errors).
      let errMsg = data?.error || data?.result?.error;
      let isFailed = !!errMsg
        || data?.status === "failed"
        || (typeof data?.status === "number" && data.status >= 400);
      // Requirement 7: composite steps (12, 14) derive the dot from per-tool outcomes.
      const stepDef = STEPS.find(s => s.id === stepId);
      if (!errMsg && stepDef?.substepsInParent) {
        const compErr = compositeFailure(stepDef, data);
        if (compErr) { isFailed = true; errMsg = compErr; }
      }
      // Step 8 fans out to rule creation + occurrence registration inside one route:
      // zero rules created with errors present is a failure, not a green 0/0/0.
      if (!errMsg && stepId === "data_quality") {
        const r = data?.rules;
        const ruleErrs = r?.errors || [];
        const createdCount = (r?.rules_created || []).length + (r?.occurrences_registered || []).length;
        if (!r) { isFailed = true; errMsg = "create_generic_dq_rules did not run — the plan returned no rule action"; }
        else if (ruleErrs.length > 0 && createdCount === 0) { isFailed = true; errMsg = `rule creation failed for every column (${ruleErrs.length} errors)`; }
      }
      if (errMsg) setErrors(prev => ({ ...prev, [stepId]: errMsg }));
      setStatus(stepId, isFailed ? STATUS.error : STATUS.done);
      return isFailed ? "error" : "done";
    } catch (err) {
      if (err.name === "AbortError") return "aborted";
      setErrors(prev => ({ ...prev, [stepId]: err.message }));
      setStatus(stepId, STATUS.error);
      return "error";
    }
  }, [scanTable, scanSchema, scanSource, monitorForm, profileObject, profileMode, profileSchema, profileDatabase]);

  // ── Run-all control ─────────────────────────────────────────────────────────
  // A small secondary control, not a primary CTA. Walks the ladder top to
  // bottom, skipping steps already done, and HALTS at every review gate — the
  // behaviour that distinguishes it from a freeform agent. An orchestrator that
  // blows past an approval gate disproves the exact argument the gates make.
  // It never calls auto_approve_access. Across the marketplace span it calls
  // publish_marketplace_full (steps 12+13 in one request), deriving both dots
  // independently from the per-tool outcomes.
  const [runAll, setRunAll] = useState(null);   // {running, at, halted, note}
  const runAllRef = useRef(false);

  const stopRunAll = useCallback(() => {
    runAllRef.current = false;
    setRunAll(r => r ? { ...r, running: false, note: "stopped — the current step finishes, nothing further runs" } : r);
  }, []);

  const startRunAll = useCallback(async () => {
    if (runAllRef.current) return;
    runAllRef.current = true;
    setRunAll({ running: true, at: null, halted: null, note: null });
    const halt = (stepId, note) => {
      runAllRef.current = false;
      setRunAll({ running: false, at: stepId, halted: stepId, note });
    };
    try {
      for (const step of STEPS) {
        if (!runAllRef.current) return;
        const st = statusesRef.current[step.id];
        if (st === STATUS.done || st === STATUS.skipped) continue;   // resume-after-gate for free
        if (step.id === "publish_marketplace") continue;             // covered by the 12+13 span
        setActiveStep(step.id);
        setRunAll(r => ({ ...r, at: step.id }));

        // Preconditions the runner cannot invent — halt with the fix named.
        if (step.id === "scan" && !(scanSchema && scanTable)) {
          return halt("scan", "select a schema and table at step 2, then press Run all again");
        }
        if (step.id === "monitor_quality" && !monitorForm.asset_name) {
          setStatus("monitor_quality", STATUS.skipped);
          continue;   // monitoring is a cold-entry read — skipping is honest, not a failure
        }

        if (step.id === "create_collection") {
          // Marketplace span: one request covers steps 12 and 13; link runs last
          // so the silent-link defect cannot come back through the orchestrator.
          try {
            const full = await apiPost("/api/step/publish_marketplace_full", {});
            let link = null;
            try { link = await apiPost("/api/step/link_asset_to_collection", {}); }
            catch (e) { link = { status: "failed", error: e.message }; }
            const map12 = { category: full.category, data_asset: full.data_asset, collection: full.collection, link };
            setResults(prev => ({ ...prev, create_collection: map12, publish_marketplace: full.publish }));
            const c12 = compositeFailure(STEPS.find(s => s.id === "create_collection"), map12);
            setStatuses(prev => ({ ...prev, create_collection: c12 ? STATUS.error : STATUS.done }));
            if (c12) setErrors(prev => ({ ...prev, create_collection: c12 }));
            const pubFail = toolOutcomeFailed(full.publish);
            setStatuses(prev => ({ ...prev, publish_marketplace: pubFail ? STATUS.error : STATUS.done }));
            if (c12 || pubFail) return halt(step.id, "marketplace span reported failures — the rows carry the detail");
          } catch (e) {
            setErrors(prev => ({ ...prev, create_collection: e.message }));
            setStatuses(prev => ({ ...prev, create_collection: STATUS.error }));
            return halt(step.id, e.message);
          }
          continue;
        }

        const outcome = await runStep(step.id);
        if (outcome === "gate") {
          return halt(step.id, "review gate open — approve (or adjust the selection), then press Run all to continue");
        }
        if (outcome === "error" || outcome === "aborted") {
          return halt(step.id, outcome === "aborted" ? "stopped" : "step failed — see its error panel");
        }
        if (step.id === "consumer_access") {
          // Gates 4/5 are human decisions. The run never clicks through them
          // and never calls auto_approve_access.
          return halt(step.id, "order placed — approve and withdraw are gated human actions (Gates 4 and 5)");
        }
      }
      runAllRef.current = false;
      setRunAll({ running: false, at: null, halted: null, note: "ladder complete" });
    } finally {
      runAllRef.current = false;
      setRunAll(r => r && r.running ? { ...r, running: false } : r);
    }
  }, [runStep, scanSchema, scanTable, monitorForm]);

  // Gate 2 approve: writes exactly the approved column-to-term links.
  const approveCuration = useCallback(async () => {
    setCurApproving(true);
    setStatus("curate", STATUS.running);
    setErrors(prev => ({ ...prev, curate: null }));
    try {
      const links = curMatches.filter(it => curSelected.has(it.name))
        .map(it => ({ term_id: it.match.term_id, column_id: it.match.column_id,
                      table: it.match.table, column: it.match.column, term_name: it.match.term_name }));
      const out = await apiPost("/api/step/apply_curation_links", { links });
      setResults(prev => ({ ...prev, curate: { applied: out, matches_reviewed: curMatches.length, approved_count: links.length } }));
      const totalFail = (out.errors || []).length > 0 && (out.linked || 0) === 0;
      if ((out.errors || []).length) setErrors(prev => ({ ...prev, curate: `${out.errors.length} link(s) failed — detail in the result` }));
      setStatus("curate", totalFail ? STATUS.error : STATUS.done);
      setCurMatches([]);
    } catch (e) {
      setErrors(prev => ({ ...prev, curate: e.message }));
      setStatus("curate", STATUS.error);
    } finally {
      setCurApproving(false);
    }
  }, [curMatches, curSelected]);

  // Gate 3 approve: pushes the selection into step 8 — writes nothing to CDGC here.
  const approveRecommendations = useCallback(() => {
    const approved = recItems.filter(i => recSelected.has(i.name))
      .map(i => ({ name: i.name, dimension: i.type, column: i.parent, evidence: i.subtitle }));
    setApprovedRecs(approved);
    setResults(prev => ({ ...prev, recommend_rules: { recommendation_count: recItems.length, approved } }));
    setStatus("recommend_rules", STATUS.done);
    setRecItems([]);
  }, [recItems, recSelected]);

  const approveDomainStructure = useCallback(async () => {
    setDomainApproving(true);
    setStatus("domain_structure", STATUS.running);
    setErrors(prev => ({ ...prev, domain_structure: null }));
    try {
      const domainData = await apiPost("/api/step/domain_structure/approve", {
        approved_names: Array.from(domainSelected),
        renames: Object.keys(domainRenames).length > 0 ? domainRenames : undefined,
      });
      const sysData = await apiPost("/api/step/system_dataset", {});
      setResults(prev => ({ ...prev, domain_structure: { ...domainData, system_dataset: sysData } }));
      // Requirement 7: step 5 fans out to two tools — derive from both outcomes.
      const domErr = domainData?.error || domainData?.result?.error;
      const sysErr = sysData?.error || sysData?.result?.error;
      const domRes = domainData?.result || domainData || {};
      const domTotalFail = (domRes.errors || []).length > 0
        && (domRes.created || []).length === 0 && (domRes.skipped || []).length === 0;
      if (domErr || sysErr || domTotalFail) {
        const parts = [];
        if (domErr || domTotalFail) parts.push(`create_domain_structure: ${domErr || "every item errored"}`);
        if (sysErr) parts.push(`create_system_and_dataset: ${sysErr}`);
        setErrors(prev => ({ ...prev, domain_structure: parts.join(" · ") }));
        setStatus("domain_structure", STATUS.error);
      } else {
        setStatus("domain_structure", STATUS.done);
      }
      setDomainItems([]);
    } catch (err) {
      setErrors(prev => ({ ...prev, domain_structure: err.message }));
      setStatus("domain_structure", STATUS.error);
    } finally {
      setDomainApproving(false);
    }
  }, [domainSelected]);

  const toggleDomainItem = useCallback((name) => {
    setDomainSelected(prev => {
      const next = new Set(prev);
      const item = domainItems.find(i => i.name === name);
      if (next.has(name)) {
        // deselect: cascade DOWN — uncheck all children
        next.delete(name);
        if (item?.type === "Domain") {
          domainItems.filter(i => i.type === "SubDomain" && i.parent === name).forEach(sd => {
            next.delete(sd.name);
            domainItems.filter(i => i.type === "BusinessTerm" && i.parent === sd.name).forEach(bt => next.delete(bt.name));
          });
        }
        if (item?.type === "SubDomain") {
          domainItems.filter(i => i.type === "BusinessTerm" && i.parent === name).forEach(bt => next.delete(bt.name));
        }
      } else {
        // select: cascade DOWN — check all children
        next.add(name);
        if (item?.type === "Domain") {
          domainItems.filter(i => i.type === "SubDomain" && i.parent === name).forEach(sd => {
            next.add(sd.name);
            domainItems.filter(i => i.type === "BusinessTerm" && i.parent === sd.name).forEach(bt => next.add(bt.name));
          });
        }
        if (item?.type === "SubDomain") {
          domainItems.filter(i => i.type === "BusinessTerm" && i.parent === name).forEach(bt => next.add(bt.name));
          // cascade UP to Domain
          const dom = domainItems.find(i => i.type === "Domain" && i.name === item.parent);
          if (dom) next.add(dom.name);
        }
        if (item?.type === "BusinessTerm") {
          // cascade UP to SubDomain and Domain
          const sd = domainItems.find(i => i.type === "SubDomain" && i.name === item.parent);
          if (sd) {
            next.add(sd.name);
            const dom = domainItems.find(i => i.type === "Domain" && i.name === sd.parent);
            if (dom) next.add(dom.name);
          }
        }
      }
      return next;
    });
  }, [domainItems]);

  const toggleDomainGroup = useCallback((names, add) => {
    setDomainSelected(prev => {
      const next = new Set(prev);
      names.forEach(n => {
        if (add) {
          next.add(n);
          // cascade up when selecting a group
          const item = domainItems.find(i => i.name === n);
          if (item?.type === "BusinessTerm") {
            const sd = domainItems.find(i => i.type === "SubDomain" && i.name === item.parent);
            if (sd) {
              next.add(sd.name);
              const dom = domainItems.find(i => i.type === "Domain" && i.name === sd.parent);
              if (dom) next.add(dom.name);
            }
          }
          if (item?.type === "SubDomain") {
            const dom = domainItems.find(i => i.type === "Domain" && i.name === item.parent);
            if (dom) next.add(dom.name);
          }
        } else {
          next.delete(n);
        }
      });
      return next;
    });
  }, [domainItems]);

  const renameDomainItem = useCallback((oldName, newName) => {
    // Track rename: resolve back to original name in case item was already renamed once
    setDomainRenames(prev => {
      const original = Object.keys(prev).find(k => prev[k] === oldName) || oldName;
      const next = { ...prev };
      if (original === newName) { delete next[original]; } else { next[original] = newName; }
      return next;
    });
    setDomainItems(prev => prev.map(i => {
      if (i.name === oldName) return { ...i, name: newName };
      if (i.parent === oldName) return { ...i, parent: newName };
      return i;
    }));
    setDomainSelected(prev => {
      const next = new Set(prev);
      if (next.has(oldName)) { next.delete(oldName); next.add(newName); }
      return next;
    });
  }, []);

  const skipStep = useCallback((stepId) => {
    setStatus(stepId, STATUS.skipped);
    setResults(prev => ({ ...prev, [stepId]: null }));
  }, []);

  const active = STEPS.find(s => s.id === activeStep) || STEPS[0];
  const ResultComponent = RESULT_RENDERERS[activeStep];
  // Domain Structure (Step 4) reads the taxonomy from the active table slot; it must not
  // run before Step 3 has produced a taxonomy for the selected table, or it silently
  // writes nothing. Taxonomy status persists in localStorage across reloads.
  const taxonomyReady = statuses["taxonomy"] === STATUS.done || !!results.taxonomy;
  // Steps 4 and 7 read the step 3 profile — they must not proceed on column names.
  const profileReady = statuses["profile"] === STATUS.done || !!results.profile;
  const _scannedTables = (results.scan?.columns || []).map(c => c?.table).filter(Boolean);
  const defaultAsset = (scanTable && scanTable !== "__ALL__" ? scanTable : "") || _scannedTables[0] || "";
  const profileObjectEffective = profileObject || defaultAsset;

  // Resolve {database, schema, source, snowflake?} for a table from the discover
  // grouping, so step 3 sends the triple compute_profile_from_snowflake needs.
  const _cfgDbPath = (config?.dq_schema_path || "").split("/");   // e.g. INCEPT_GOV_DEV/DQ_TEST
  const _NON_SF = /databricks|adls|gen2|_s3\b|s3_|delta|volume|bronze|silver|gold|accuweather|bakehouse|nyctaxi|healthverity/i;
  const resolveProfileLoc = (table) => {
    for (const src of discoverSources) {
      for (const db of (src.databases || [{ database: "", schemas: src.schemas || [] }])) {
        for (const sc of (db.schemas || [])) {
          if ((sc.tables || []).some(t => t.name === table)) {
            const snowflake = !_NON_SF.test(`${src.source} ${sc.schema} ${db.database}`);
            return { source: src.source, schema: sc.schema, database: db.database || _cfgDbPath[0] || "", snowflake };
          }
        }
      }
    }
    return { source: scanSource || "", schema: scanSchema || _cfgDbPath[1] || "", database: _cfgDbPath[0] || "", snowflake: true };
  };
  const profileLoc = resolveProfileLoc(profileObjectEffective);
  const profileSchemaEff = profileSchema || profileLoc.schema;
  const profileDatabaseEff = profileDatabase || profileLoc.database;

  // When the profiled table changes, reset schema/database to the resolved
  // values (steward can still override in the inputs).
  useEffect(() => {
    if (activeStep !== "profile" || !profileObjectEffective) return;
    const loc = resolveProfileLoc(profileObjectEffective);
    setProfileSchema(loc.schema || "");
    setProfileDatabase(loc.database || "");
    if (!loc.snowflake) setProfileMode("service");   // local path is Snowflake-only
  }, [profileObjectEffective, activeStep]);
  const canRun = (activeStep !== "scan" || (scanSchema && scanTable))
              && (activeStep !== "marketplace" || marketplaceCollectionId)
              && (activeStep !== "monitor_quality" || !!monitorForm.asset_name)
              && (activeStep !== "profile" || !!profileObjectEffective)
              && (activeStep !== "taxonomy" || profileReady)
              && (activeStep !== "recommend_rules" || profileReady)
              && (activeStep !== "domain_structure" || taxonomyReady);

  // Which substep forms are missing required inputs (disables their buttons).
  const formIncomplete = (ss) => {
    switch (ss.form) {
      case "propagate":   return !propagateForm.asset_name || propagateForm.score === "";
      case "lineage": case "impact": case "source": return !(lineageForm.asset_name || defaultAsset);
      case "suggest":     return !(glossForm.asset_name || defaultAsset);
      case "term":        return !glossForm.term_name || !glossForm.definition;
      case "trends": case "remediation": return !monitorForm.asset_name;
      case "alert":       return !monitorForm.asset_name || !monitorForm.threshold || !monitorForm.notify_email;
      case "profileObj":  return !profileObjectEffective;
      case "rule":        return !ruleForm.rule_name;
      case "ruleValidate": return false;
      case "mtask":       return !mtaskForm.name || !mtaskForm.mapping_id;
      case "dqtask":      return !dqTaskForm.source_table || !(config && config.has_dq_template);
      case "schedule":    return !scheduleForm.name || !scheduleForm.startLocal;
      case "taskflow":    return !taskflowForm.name || !taskflowForm.picked.length;
      case "runtask":     return !runTaskId;
      case "jobstatus":   return !jobRuns.length;
      case "mccscan":     return !mccForm.tables.trim();
      default:            return false;
    }
  };
  // scanSource is optional — schema alone is sufficient for the scan API

  // Dual-control approvals awaiting a second approver — drives the header chip.
  const pendingApprovals = pending.length;
  const _confirmStamp = () => new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
  // Steps 10 (Publish to Catalog) and 13 (Publish to Marketplace) are single
  // irreversible actions: Run opens a confirmation modal listing consequences first.
  const CONFIRM_STEPS = {
    publish_governance: { title: "Publish to the governance catalog",
      subtitle: "Runs the DQ rules against live data and writes scores.",
      consequences: ["Executes the DQ rules against the selected asset on live Snowflake data",
        "Writes quality scores to the governance catalog", "Visible to every consumer of this asset",
        "Cannot be retracted — only superseded by a later run"], confirmLabel: "Publish" },
    publish_marketplace: { title: "Publish collection to the marketplace",
      subtitle: "The collection becomes discoverable by consumers.",
      consequences: ["Visible to every marketplace consumer in this org",
        "Carries the current composite quality score", "Contains columns linked to identifying business terms",
        "Unpublishing does not revoke access already granted"], confirmLabel: "Publish" },
  };
  const maybeConfirmRun = (stepId) => {
    const c = CONFIRM_STEPS[stepId];
    if (c) setConfirm({ ...c, tool: (STEPS.find(s => s.id === stepId) || {}).route, onConfirm: () => runStep(stepId) });
    else runStep(stepId);
  };
  // Step 15 approve/withdraw open the confirmation modal (spec: Step layouts),
  // not DomainApprovalPanel. Approve additionally carries dual control.
  const openAccessConfirm = (ss) => {
    const order = results.consumer_access || {};
    const requester = order.consumer || "the requesting consumer";
    const asset = order.collection_id ? `collection ${String(order.collection_id).slice(0, 8)}…` : "the published collection";
    if (ss.gated === "withdraw") {
      setConfirm({ title: `Withdraw access — ${requester}`, subtitle: "Destructive and irreversible from the UI.",
        consequences: [`${requester} loses access to ${asset} immediately`,
          "Queries running against this grant will fail", "Restoring requires a new request and a fresh approval"],
        confirmLabel: "Withdraw access", danger: true, tool: ss.tool, onConfirm: () => runSubAction(active, ss) });
    } else {
      setConfirm({ title: `Approve access for ${requester}`, subtitle: "This collection contains identifying fields.",
        consequences: [`Grants standing access to ${asset}`,
          "Contains columns linked to identifying business terms", "Delivery target is the configured share / file / ticket"],
        dual: true, tool: ss.tool, requester });
    }
  };
  const handleConfirm = () => {
    const c = confirm; setConfirm(null); if (!c) return;
    // Dual control: queue for a second approver rather than executing now.
    if (c.dual) setPending(p => [...p, { title: c.title, requester: c.requester || "data_steward@client.example", at: _confirmStamp() }]);
    else if (c.onConfirm) c.onConfirm();
  };
  return (
    <div className="flex flex-col h-screen text-slate-800">

      {/* Header — Incept Data Solutions pill + breadcrumb, then health / approvals /
          session / settings on the right. The logo and run-all moved to the sidebar. */}
      <header className="flex items-center gap-4 px-6 h-14 bg-white border-b border-slate-200 shrink-0">
        <span className="text-xs bg-slate-50 border border-slate-300 text-slate-600 px-2 py-0.5 rounded shadow-sm">Incept Data Solutions</span>
        <span className="text-sm font-semibold text-slate-700">{active.num} · {active.label}</span>
        <div className="ml-auto flex items-center gap-3">
          <HealthIndicator/>
          {/* Awaiting-approver chip — hidden until a dual-control approval is pending
              (Phase 7 / step 15 populates pendingApprovals); clicks through to settings. */}
          {pendingApprovals > 0 && (
            <button onClick={() => setSettingsOpen(true)}
              className="flex items-center gap-1.5 text-xs text-amber-600 pl-3 border-l border-slate-200 hover:text-amber-700">
              ⚑ Awaiting approver <span className="bg-amber-500 text-white font-mono text-[10px] px-1.5 rounded-full">{pendingApprovals}</span>
            </button>
          )}
          <SessionTimer/>
          <button
            onClick={() => setSettingsOpen(true)}
            className="text-slate-400 hover:text-brand text-lg leading-none pl-2 border-l border-slate-200 transition-colors"
            title="Settings — org-scoped actions (export / import, approval policy)"
          >⚙</button>
        </div>
      </header>

      <SessionExpiredBanner message={sessionExpired} onDismiss={() => setSessionExpired(null)}/>
      <ConfirmModal confirm={confirm} onClose={() => setConfirm(null)} onConfirm={handleConfirm}/>

      {/* Run-all status strip — running (indigo) / halted at a gate (amber) */}
      {runAll && (runAll.running || runAll.note) && (
        <div className={`px-6 py-2 border-b flex items-center gap-3 shrink-0 text-xs font-medium
          ${runAll.running ? "bg-indigo-50 border-indigo-200 text-indigo-700" : "bg-amber-50 border-amber-200 text-amber-800"}`}>
          {runAll.running && <Spinner/>}
          <span>
            {runAll.running
              ? `Run-all: at ${(STEPS.find(s => s.id === runAll.at) || {}).label || "…"}`
              : runAll.halted
                ? `Run-all halted at ${(STEPS.find(s => s.id === runAll.halted) || {}).label || runAll.halted} — ${runAll.note}`
                : `Run-all: ${runAll.note}`}
          </span>
          {!runAll.running && (
            <button onClick={() => setRunAll(null)} className="ml-auto text-xs px-2 py-0.5 rounded border border-amber-300 bg-white hover:bg-amber-100">Dismiss</button>
          )}
        </div>
      )}

      {/* Settings slide-over — org-scoped actions live here, not on the ladder.
          A settings panel is not navigation: no status dot, no ladder position,
          no run-all participation. Phase 6 fills it. */}
      {settingsOpen && (
        <div className="fixed inset-0 z-50" onClick={() => setSettingsOpen(false)}>
          <div className="absolute inset-0 bg-slate-900/30"/>
          <div className="absolute right-0 top-0 h-full w-96 bg-white border-l border-slate-300 shadow-2xl p-6 space-y-4 overflow-y-auto scrollbar-thin"
               onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <div>
                <div className="text-sm font-bold text-slate-800">Settings</div>
                <div className="text-xs text-slate-400 mt-0.5">Org-scoped actions — independent of the dataset in flight</div>
              </div>
              <button onClick={() => setSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <div className="bg-slate-50 border border-slate-300 rounded-xl p-4 space-y-3">
              <div className="text-xs font-semibold text-slate-600">Export / Import</div>
              <p className="text-xs text-slate-400 leading-relaxed">
                Asset bundles promoted between environments — org scope, not the table in flight.
                Both are fire-then-poll; export delivers a downloadable ZIP.
              </p>
              <div>
                <label className="block text-xs text-slate-500 font-medium mb-1">Object IDs (comma or newline separated)</label>
                <textarea rows="2" value={expForm.ids}
                  onChange={e => setExpForm(f => ({ ...f, ids: e.target.value }))}
                  className={INPUT_CLS + " font-mono"}/>
              </div>
              <div className="flex items-end gap-2">
                <div className="flex-1">
                  <label className="block text-xs text-slate-500 font-medium mb-1">Package name (optional)</label>
                  <input type="text" value={expForm.name}
                    onChange={e => setExpForm(f => ({ ...f, name: e.target.value }))}
                    placeholder="export" className={INPUT_CLS}/>
                </div>
                <button onClick={doExport} disabled={expBusy || !expForm.ids.trim()}
                  className={`px-4 py-2 rounded-lg text-xs font-semibold border transition-all shadow-sm
                    ${expBusy || !expForm.ids.trim() ? "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed" : "bg-indigo-600 border-indigo-700 text-white hover:bg-indigo-500"}`}>
                  {expBusy ? "Exporting… (polling)" : "⇩ Export"}
                </button>
              </div>
              {expErr && <div className="bg-red-50 border border-red-200 rounded-lg p-2"><pre className="text-xs text-red-700 whitespace-pre-wrap">{expErr}</pre></div>}
              {expOut && (
                <div className={`rounded-lg p-2.5 text-xs space-y-1 border ${expOut.package_path ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-slate-100 border-slate-300 text-slate-600"}`}>
                  <div>Job <span className="font-mono">{expOut.job_id}</span> — {expOut.state}{expOut.package_bytes ? ` · ${(expOut.package_bytes / 1024).toFixed(1)} KB` : ""}</div>
                  {expOut.download_url && (
                    <a href={expOut.download_url} className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-500 transition-colors">⬇ Download package</a>
                  )}
                </div>
              )}
              <div className="border-t border-slate-200 pt-3 space-y-2">
                <label className="block text-xs text-slate-500 font-medium">Import a package ZIP (conflicts resolve as REUSE)</label>
                <div className="flex items-center gap-2">
                  <input type="file" accept=".zip" onChange={e => setImpFile(e.target.files && e.target.files[0] || null)} className="text-xs text-slate-600 flex-1"/>
                  <button onClick={doImport} disabled={impBusy || !impFile}
                    className={`px-4 py-2 rounded-lg text-xs font-semibold border transition-all shadow-sm
                      ${impBusy || !impFile ? "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed" : "bg-indigo-600 border-indigo-700 text-white hover:bg-indigo-500"}`}>
                    {impBusy ? "Importing…" : "⇧ Import"}
                  </button>
                </div>
                {impErr && <div className="bg-red-50 border border-red-200 rounded-lg p-2"><pre className="text-xs text-red-700 whitespace-pre-wrap">{impErr}</pre></div>}
                {impOut && (
                  <div className={`rounded-lg p-2.5 text-xs border ${(impOut.state || "").includes("SUCCESS") ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-slate-100 border-slate-300 text-slate-600"}`}>
                    Job <span className="font-mono">{impOut.upload_job_id}</span> — {impOut.state}{impOut.message ? ` · ${impOut.message}` : ""}
                  </div>
                )}
              </div>
            </div>
            <div className="bg-slate-50 border border-slate-300 rounded-xl p-4">
              <div className="text-xs font-semibold text-slate-600 mb-1">Approval policy</div>
              <p className="text-xs text-slate-400 leading-relaxed">
                Gate configuration lands here when it ships.
              </p>
            </div>
          </div>
        </div>
      )}

      <div className="flex flex-1 overflow-hidden">

        {/* Sidebar */}
        <aside className="w-[264px] bg-white border-r border-slate-200 flex flex-col shrink-0">
          {/* Logo block */}
          <div className="px-4 py-3 border-b border-slate-200 flex items-center gap-2 shrink-0">
            <div className="w-7 h-7 rounded-lg bg-brand flex items-center justify-center text-white text-sm font-bold">I</div>
            <div>
              <div className="text-sm font-bold leading-tight text-slate-800">Incept IDMC Agent</div>
              <div className="text-[10px] text-slate-400 uppercase tracking-wider">Governance Automation</div>
            </div>
          </div>
          {/* Grouped ladder — Governance (1-11) and Marketplace (12-15). One ladder,
              one sequence; the grouping is presentational, not sections. */}
          <div className="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1">
            {[{ name: "Governance", steps: STEPS.filter(s => s.num <= 11) },
              { name: "Marketplace", steps: STEPS.filter(s => s.num >= 12) }].map(group => (
              <div key={group.name}>
                <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-1 pt-2 pb-1.5">{group.name}</div>
                <div className="bg-white rounded-lg border border-slate-200 divide-y divide-slate-100 overflow-hidden">
                  {group.steps.map(step => {
                    const status = statuses[step.id] || STATUS.idle;
                    const isActive = step.id === activeStep;
                    const isNew = step.num === 3 || step.num === 7;
                    const gated = step.gate || step.gateOn;
                    return (
                      <button key={step.id} onClick={() => setActiveStep(step.id)}
                        className={`w-full text-left px-3 py-2 flex gap-2.5 transition-colors ${isActive ? "bg-indigo-50" : "hover:bg-slate-50"}`}>
                        <span className="mt-1 shrink-0"><StatusDot status={status}/></span>
                        <span className="min-w-0 flex-1">
                          <span className={`block text-[12.5px] font-semibold ${status === STATUS.skipped ? "line-through text-slate-400" : "text-slate-700"}`}>
                            {step.num} · {step.label}
                            {isNew && <span className="ml-1 text-[9px] bg-indigo-100 text-brand-dark px-1 py-0.5 rounded font-bold align-middle">NEW</span>}
                            {gated && (step.gatePhase
                              ? <span className="ml-1 text-[9px] bg-slate-100 text-slate-400 px-1 py-0.5 rounded font-bold align-middle" title={`Review gate ships in ${step.gatePhase}`}>REVIEW</span>
                              : <span className="ml-1 text-[9px] bg-amber-100 text-amber-700 px-1 py-0.5 rounded font-bold align-middle" title={step.gateOn ? `Approval gate on: ${step.gateOn.join(", ")}` : "Approval gate"}>REVIEW</span>)}
                          </span>
                          <span className="block text-[11px] text-slate-400 truncate">{stepStatusLine(step, status, results)}</span>
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          {/* Footer — the run-all belongs here, small and annotated, not in the
              header where it reads as a primary action. The note is the argument
              the gates exist to make. */}
          <div className="px-3 py-2.5 border-t border-slate-200 shrink-0">
            <div className="flex items-center gap-2">
              <button
                onClick={async () => {
                  // Clear server-side pipeline state too, not just the browser.
                  try { await fetch('/api/reset', { method: 'POST' }); } catch (e) {}
                  localStorage.removeItem(LS_KEY); window.location.reload();
                }}
                className="text-[11px] px-2 py-1 rounded border border-slate-300 text-slate-500 hover:border-brand hover:text-brand transition-colors"
                title="Clear session (server + browser) and start fresh">Reset</button>
              <button
                onClick={() => runAll?.running ? stopRunAll() : startRunAll()}
                className="flex-1 text-[11px] px-2 py-1 rounded border border-slate-300 text-slate-500 hover:border-brand hover:text-brand transition-colors"
                title="Runs the ladder top to bottom, skipping completed steps — and halts at every review gate. Never auto-approves."
              >{runAll?.running ? "■ Stop run-all" : "Run all unattended"}</button>
            </div>
            <div className="text-[10px] text-slate-400 mt-2 leading-snug">Unattended skips every review gate. Use for reruns, not first passes.</div>
          </div>
        </aside>

        {/* Main content */}
        <main className="flex-1 overflow-y-auto scrollbar-thin bg-slate-200 p-6">
          <div className="max-w-[1080px] space-y-5">

            {/* Step header */}
            <div>
              <div className="flex items-center gap-2 mb-1">
                {(() => { const idx = STEPS.findIndex(s => s.id === activeStep); const prev = STEPS[idx - 1]; return prev ? (
                  <button onClick={() => setActiveStep(prev.id)} className="text-xs text-slate-400 hover:text-brand font-medium mr-1">← {prev.label}</button>
                ) : null; })()}
                <span className="text-xs font-mono text-slate-400 font-medium">STEP {active.num} / {STEPS.length}</span>
                {statuses[activeStep] === STATUS.running && <Spinner/>}
              </div>
              <h1 className="text-xl font-bold text-slate-800">{active.label}</h1>
              <p className="text-sm text-slate-500 mt-0.5">{active.desc}</p>
            </div>

            {/* Progress bar — visible while running or briefly on completion */}
            {(stepProgress[activeStep] > 0) && (
              <div className="w-full">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs text-slate-500 font-medium">
                    {statuses[activeStep] === STATUS.running ? "Running…" : "Complete"}
                  </span>
                  <span className="text-xs font-mono text-slate-400">{Math.round(stepProgress[activeStep])}%</span>
                </div>
                <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                  <div
                    className={`h-full rounded-full progress-bar-fill ${statuses[activeStep] !== STATUS.running ? "done" : ""}`}
                    style={{ width: `${stepProgress[activeStep]}%` }}
                  />
                </div>
              </div>
            )}

            {/* Scan inputs */}
            {activeStep === "scan" && (
              <div className="bg-slate-50 rounded-xl p-4 space-y-3 border border-slate-300 shadow-sm">
                {(() => {
                  // Cascading Database → Schema → Table, all from step 1's
                  // catalog_sources_grouped (source → databases → schemas → tables).
                  // No free text: identifier case is significant against INFORMATION_SCHEMA
                  // and a typo is indistinguishable from a missing grant, so these stay
                  // dropdowns even though every other selector degrades to text
                  // (spec interaction contract rule 0 / cross-cutting requirement 5).
                  const SEL = "w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100 disabled:bg-slate-100 disabled:text-slate-400";
                  const tree = [];
                  discoverSources.forEach(cs => (cs.databases || [{ database: "", schemas: cs.schemas || [] }]).forEach(db =>
                    (db.schemas || []).forEach(sc => tree.push({ source: cs.source, database: db.database || "", schema: sc.schema, tables: sc.tables || [] }))));

                  // Step 2 depends on Discover — show the unmet-dependency state, not
                  // three empty dropdowns (handled the way Domain Structure handles its
                  // own unmet dependency).
                  if (tree.length === 0) {
                    return (
                      <div className="flex items-start gap-3">
                        <span className="text-xl">◱</span>
                        <div className="flex-1">
                          <div className="text-sm font-semibold text-slate-700">Discover hasn't run yet</div>
                          <div className="text-xs text-slate-500 mt-1 leading-relaxed">
                            The database, schema and table pickers populate from the catalog. They are dropdowns rather than
                            free text on purpose — identifier case matters, and a typed name that doesn't match returns
                            "not found" indistinguishably from a missing grant. Run Discover to load the catalog.
                          </div>
                          <button onClick={() => setActiveStep("discover")}
                            className="mt-2 text-xs px-3 py-1.5 rounded-lg bg-brand text-white font-semibold hover:bg-brand-dark">Go to Discover →</button>
                        </div>
                      </div>
                    );
                  }

                  const useDb           = tree.some(e => e.database);
                  const dbKey           = useDb ? "database" : "source";
                  const databases       = [...new Set(tree.map(e => e[dbKey]).filter(Boolean))];
                  const inDb            = tree.filter(e => e[dbKey] === scanDatabase);
                  const schemasInDb     = [...new Set(inDb.map(e => e.schema))].filter(Boolean);
                  const totalTablesInDb = inDb.reduce((n, e) => n + (e.tables?.length || 0), 0);
                  const allSchemasMode  = scanSchema === "__ALL_SCHEMAS__";
                  const selEntry        = inDb.find(e => e.schema === scanSchema);
                  const tablesInSchema  = selEntry ? selEntry.tables : [];
                  const pickDatabase = (val) => {
                    setScanDatabase(val); setScanSchema(""); setScanTable("__ALL__");
                    const e = tree.find(x => x[dbKey] === val);
                    setScanSource(e ? e.source : "");
                  };
                  const pickSchema = (val) => {
                    setScanSchema(val); setScanTable("__ALL__");
                    const e = inDb.find(x => x.schema === val);
                    if (e) setScanSource(e.source);
                  };
                  return (
                    <>
                      {/* Database */}
                      <div>
                        <label className="block text-xs text-slate-500 font-medium mb-1">Database</label>
                        <select value={scanDatabase} onChange={e => pickDatabase(e.target.value)} className={SEL}>
                          <option value="">Select a database…</option>
                          {databases.map(d => <option key={d} value={d}>{d}</option>)}
                        </select>
                      </div>
                      {/* Schema — enabled once a database is chosen */}
                      <div>
                        <label className="block text-xs text-slate-500 font-medium mb-1">Schema</label>
                        <select value={scanSchema} onChange={e => pickSchema(e.target.value)} className={SEL} disabled={!scanDatabase}>
                          <option value="">{scanDatabase ? "Select a schema…" : "Select a database first"}</option>
                          {schemasInDb.length > 0 && totalTablesInDb > 0 && (
                            <option value="__ALL_SCHEMAS__">⚡ All schemas ({totalTablesInDb.toLocaleString()} tables total — samples a few, estimates full run)</option>
                          )}
                          {schemasInDb.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                      </div>
                      {/* Table — hidden while scanning all schemas or before a schema is chosen */}
                      <div className={(scanSchema && !allSchemasMode) ? "" : "hidden"}>
                        <label className="block text-xs text-slate-500 font-medium mb-1">Table</label>
                        <select value={scanTable} onChange={e => setScanTable(e.target.value)} className={SEL}>
                          <option value="__ALL__">⚡ Scan all {tablesInSchema.length.toLocaleString()} tables in this schema (samples a few, estimates full run)</option>
                          {tablesInSchema.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
                        </select>
                      </div>
                    </>
                  );
                })()}
              </div>
            )}

            {/* Stub steps: rung says "next release" instead of being dead */}
            {active.stub && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 flex items-start gap-3">
                <span className="text-2xl">🔜</span>
                <div>
                  <div className="text-sm font-semibold text-amber-800">{active.label} ships in the next release ({active.stubPhase})</div>
                  <div className="text-xs text-amber-700 mt-1 leading-relaxed">
                    The tools behind this step — <span className="font-mono">{(active.substeps || []).map(s => s.tool).join(", ")}</span> — are
                    deployed and reachable on the governance servers; this screen is not built yet.
                  </div>
                </div>
              </div>
            )}

            {/* Pending review gates: the badge must not promise review behaviour
                that doesn't exist yet — same honesty treatment as stub steps */}
            {!active.stub && active.gatePhase && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start gap-3">
                <span className="text-xl">✋</span>
                <div>
                  <div className="text-sm font-semibold text-amber-800">Review gate ships in {active.gatePhase}</div>
                  <div className="text-xs text-amber-700 mt-1 leading-relaxed">
                    {active.gateOn
                      ? `${active.gateOn.join(" and ")} will require explicit approval before executing; today they run directly.`
                      : "This step will pause for steward review and approval; today it runs without one."}
                  </div>
                </div>
              </div>
            )}

            {/* propagate_dq_score inputs (step 10) — corrective push to one asset */}
            {activeStep === "publish_governance" && (
              <div className="bg-slate-50 rounded-xl p-4 space-y-3 border border-slate-300 shadow-sm">
                <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">propagate_dq_score — corrective push to one asset</div>
                <div className="grid grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs text-slate-500 font-medium mb-1">Asset (table, column or DQRO)</label>
                    <input type="text" value={propagateForm.asset_name}
                      onChange={e => setPropagateForm(f => ({ ...f, asset_name: e.target.value }))}
                      placeholder="e.g. DQ_CUSTOMER_NAME_COMPLETENESS"
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100 font-mono"/>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-500 font-medium mb-1">Score (0–100)</label>
                    <input type="number" min="0" max="100" value={propagateForm.score}
                      onChange={e => setPropagateForm(f => ({ ...f, score: e.target.value }))}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100"/>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-500 font-medium mb-1">Dimension</label>
                    <select value={propagateForm.dimension}
                      onChange={e => setPropagateForm(f => ({ ...f, dimension: e.target.value }))}
                      className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100">
                      {["Accuracy","Completeness","Validity","Consistency","Timeliness","Uniqueness"].map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>
                </div>
                <p className="text-xs text-slate-400">
                  Fixes or backfills a single asset's score without re-running the scan — the common case after a
                  partial run. Fill these, then run the <span className="font-mono">propagate_dq_score</span> substep below.
                </p>
              </div>
            )}

            {/* Step 1 substep inputs — catalog source scan */}
            {activeStep === "discover" && (
              <div className="bg-slate-50 rounded-xl p-4 space-y-3 border border-slate-300 shadow-sm">
                <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">scan_mcc_source — catalog metadata for named tables</div>
                <div className="grid grid-cols-3 gap-3">
                  <div className="col-span-2">
                    <label className="block text-xs text-slate-500 font-medium mb-1">Table names (comma or newline separated)</label>
                    <textarea rows="1" value={mccForm.tables}
                      onChange={e => setMccForm(f => ({ ...f, tables: e.target.value }))}
                      placeholder="CUSTOMER_POSITIONS, REF_COMPANY_CODE"
                      className={INPUT_CLS + " font-mono"}/>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-500 font-medium mb-1">Schema hint (optional)</label>
                    <input type="text" value={mccForm.schema_hint}
                      onChange={e => setMccForm(f => ({ ...f, schema_hint: e.target.value }))}
                      className={INPUT_CLS + " font-mono"}/>
                  </div>
                </div>
                <p className="text-xs text-slate-400">Read-only — resolves tables and columns from the already-populated catalog. list_connections needs no inputs.</p>
              </div>
            )}

            {/* Profile inputs (step 3) — profile once, cache for steps 4 and 7 */}
            {activeStep === "profile" && (
              <div className="bg-slate-50 rounded-xl p-4 space-y-3 border border-slate-300 shadow-sm">
                <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">Table to profile — runs once; steps 4 and 7 read the stored profile</div>
                <div className="grid grid-cols-2 gap-3">
