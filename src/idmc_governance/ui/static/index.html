<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INCEPT Data Governance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    body { background: #cbd5e1; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #cbd5e1; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
    .pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
    pre { white-space: pre-wrap; word-break: break-all; }
    @keyframes progress-shine { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .progress-bar-fill {
      transition: width 0.18s ease-out;
      background: linear-gradient(90deg, #6366f1 0%, #818cf8 40%, #6366f1 60%, #4338ca 100%);
      background-size: 200% 100%;
      animation: progress-shine 1.8s linear infinite;
    }
    .progress-bar-fill.done {
      background: #10b981;
      animation: none;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#6366f1', dark: '#4338ca', light: '#818cf8' },
            surface: { DEFAULT: '#f1f5f9', raised: '#e2e8f0', border: '#cbd5e1' },
          }
        }
      }
    }
  </script>
</head>
<body class="h-screen overflow-hidden">
<div id="root"></div>

<script type="text/babel" data-presets="react,env">
const { useState, useCallback, useRef, useEffect } = React;

// ── Sections ──────────────────────────────────────────────────────────────────
// Six-section application: Govern & Marketplace keep the step/status-dot pipeline
// pattern; Operate/Monitor/Explore/Glossary/Admin are standalone screens.
const SECTIONS = [
  { id: "govern",      label: "Govern",      icon: "◈", kind: "pipeline", desc: "IDMC CDGC Onboarding Pipeline" },
  { id: "marketplace", label: "Marketplace", icon: "◉", kind: "pipeline", desc: "Data Marketplace publication & consumer access" },
  { id: "operate",     label: "Operate",     icon: "▶", kind: "screens",  desc: "CDI execution — tasks, schedules, taskflows, runs" },
  { id: "monitor",     label: "Monitor",     icon: "◎", kind: "screens",  desc: "DQ scorecards, trends, alerts & remediation" },
  { id: "explore",     label: "Explore",     icon: "⬡", kind: "screens",  desc: "Lineage, impact analysis & source tracing" },
  { id: "glossary",    label: "Glossary",    icon: "◫", kind: "screens",  desc: "Business glossary health & term management" },
  { id: "admin",       label: "Admin",       icon: "⚙", kind: "screens",  desc: "Connections, rule library, export & import" },
];

// ── Step definitions ──────────────────────────────────────────────────────────
const STEPS = [
  { id: "discover",        num: 1, label: "Discover Catalog",         icon: "⬡", desc: "List all schemas and tables from the CDGC catalog." },
  { id: "scan",            num: 2, label: "Scan Table",                icon: "◈", desc: "Select a table and fetch its column metadata (cached after first run)." },
  { id: "taxonomy",        num: 3, label: "Generate Taxonomy",         icon: "◫", desc: "LLM generates a domain / subdomain / business-term tree from the scanned column metadata." },
  { id: "domain_structure",num: 4, label: "Domain Structure",          icon: "◧", desc: "Review and approve the proposed domain hierarchy, then write it to CDGC and register the source system and dataset." },
  { id: "curate",          num: 5, label: "Curate Columns",            icon: "◩", desc: "Link every column to its matching business term." },
  { id: "profile",         num: 6, label: "Profile Data",              icon: "◍", desc: "Measure what is actually in the data — null counts, distinct counts, min/max, patterns — per column." },
  { id: "recommend_rules", num: 7, label: "Recommend Rules",           icon: "❋", desc: "Evidence-backed DQ rule recommendations derived from the profiling statistics. Select the ones to carry into Data Quality." },
  { id: "data_quality",           num: 8,  label: "Data Quality",                    icon: "◎", desc: "Creates DQ rules and generates interim scores for all registered rule occurrences in CDGC." },
  { id: "publish_governance",     num: 9,  label: "Publish to Governance Catalog",        icon: "◉", desc: "Triggers the MCC scan — CDQ rules run on live Snowflake data (5000 rows) and publish real DQ scores to the Governance Catalog." },
];

const MARKETPLACE_STEPS = [
  { id: "create_collection",        num: 1, label: "Create Collection",       icon: "◈", desc: "Create the CDMP category, data asset and data collection for the governed dataset." },
  { id: "link_asset",               num: 2, label: "Link Asset",              icon: "◧", desc: "Link the governed data asset to its Data Collection (bulk CSV upload)." },
  { id: "publish_marketplace_full", num: 3, label: "Publish to Marketplace",  icon: "◉", desc: "Publish the collection so consumers can discover and request it." },
  { id: "configure_delivery",       num: 4, label: "Configure Delivery",      icon: "◫", desc: "Usage contexts, delivery template, terms of use and delivery target." },
  { id: "consumer_access",          num: 5, label: "Consumer Access",         icon: "◩", desc: "Place a consumer order for the collection (with optional auto-approval)." },
  { id: "verify_access",            num: 6, label: "Verify Access",           icon: "✓", desc: "Confirm the order was approved and fulfilled." },
  { id: "withdraw_access",          num: 7, label: "Withdraw Access",         icon: "⊗", desc: "Revoke consumer access — the full lifecycle including offboarding." },
];

const PIPELINE_STEPS = { govern: STEPS, marketplace: MARKETPLACE_STEPS };

// ── Helpers ───────────────────────────────────────────────────────────────────
const STATUS = { idle: "idle", running: "running", done: "done", error: "error", skipped: "skipped" };
const SKIPPABLE = new Set(["taxonomy", "domain_structure", "curate", "profile", "recommend_rules", "data_quality", "publish_governance", "create_collection", "link_asset", "publish_marketplace_full", "configure_delivery", "consumer_access", "verify_access", "withdraw_access"]);

// One shared interceptor: HTTP 401 from any bridge route means the IDMC session
// died (REPO_38205) — every screen surfaces the same "reconnect" affordance.
let notifySessionExpired = null;

async function apiPost(path, body = {}, signal = undefined) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal,
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    const msg = typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail || r.statusText);
    if (r.status === 401 && notifySessionExpired) notifySessionExpired(msg);
    const e = new Error(msg);
    e.status = r.status;
    throw e;
  }
  return r.json();
}

async function apiGet(path, signal = undefined) {
  const r = await fetch(path, { signal });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    const msg = typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail || r.statusText);
    if (r.status === 401 && notifySessionExpired) notifySessionExpired(msg);
    const e = new Error(msg);
    e.status = r.status;
    throw e;
  }
  return r.json();
}

// Shared fire-then-poll helper — profiling, export/import and job runs all use it.
function usePolling(fn, intervalMs, active) {
  useEffect(() => {
    if (!active) return;
    fn();
    const iv = setInterval(fn, intervalMs);
    return () => clearInterval(iv);
  }, [active, intervalMs]);
}

// ── Sub-components ────────────────────────────────────────────────────────────

function StatusDot({ status }) {
  if (status === STATUS.idle)    return <span className="w-2 h-2 rounded-full bg-slate-300 inline-block"/>;
  if (status === STATUS.running) return <span className="w-2 h-2 rounded-full bg-violet-500 inline-block pulse"/>;
  if (status === STATUS.done)    return <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"/>;
  if (status === STATUS.skipped) return <span className="w-2 h-2 rounded-full bg-amber-400 inline-block" title="Skipped"/>;
  if (status === STATUS.error)   return <span className="w-2 h-2 rounded-full bg-red-500 inline-block"/>;
}

function Spinner() {
  return (
    <svg className="spin w-4 h-4 text-brand" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeOpacity="0.2"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
    </svg>
  );
}

function JsonViewer({ data, maxHeight = "320px" }) {
  const [expanded, setExpanded] = useState(false);
  const text = JSON.stringify(data, null, 2);
  return (
    <div className="rounded-lg bg-slate-800 border border-slate-700 overflow-hidden">
      <div className="flex items-center justify-between px-3 py-1.5 border-b border-slate-700 bg-slate-900">
        <span className="text-xs text-slate-400 font-mono">JSON</span>
        <button onClick={() => setExpanded(e => !e)} className="text-xs text-slate-400 hover:text-violet-400">
          {expanded ? "Collapse" : "Expand"}
        </button>
      </div>
      <div className="overflow-auto scrollbar-thin" style={{ maxHeight: expanded ? "none" : maxHeight }}>
        <pre className="p-3 text-xs text-slate-300 font-mono">{text}</pre>
      </div>
    </div>
  );
}

function SummaryCard({ label, value, color = "text-brand" }) {
  return (
    <div className="bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 flex flex-col gap-0.5 shadow-sm overflow-hidden">
      <span className={`text-lg font-bold truncate ${color}`} title={typeof value === 'string' ? value : undefined}>{value}</span>
      <span className="text-xs text-slate-400 uppercase tracking-wider font-medium">{label}</span>
    </div>
  );
}

// ── Step result renderers ─────────────────────────────────────────────────────

function SchemaTableList({ tables }) {
  const PREVIEW = 12;
  const [expanded, setExpanded] = React.useState(false);
  const shown = expanded ? tables : tables.slice(0, PREVIEW);
  return (
    <div className="flex flex-wrap gap-1 mt-1.5">
      {shown.map(t => (
        <span key={t.name} className="text-xs bg-white border border-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-mono max-w-[220px] truncate inline-block" title={t.name}>{t.name}</span>
      ))}
      {!expanded && tables.length > PREVIEW && (
        <button onClick={() => setExpanded(true)}
          className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2 py-0.5 rounded hover:bg-indigo-100 cursor-pointer font-medium">
          +{tables.length - PREVIEW} more
        </button>
      )}
      {expanded && tables.length > PREVIEW && (
        <button onClick={() => setExpanded(false)}
          className="text-xs bg-slate-100 border border-slate-200 text-slate-500 px-2 py-0.5 rounded hover:bg-slate-200 cursor-pointer">
          show less
        </button>
      )}
    </div>
  );
}

function DiscoverResult({ data }) {
  const catalogSources  = data?.result?.catalog_sources_grouped || [];
  const total           = data?.result?.total_tables || 0;
  const [collapsed, setCollapsed] = React.useState({});
  const toggle = (key) => setCollapsed(prev => ({ ...prev, [key]: !prev[key] }));

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <SummaryCard label="Catalog Sources" value={catalogSources.length}/>
        <SummaryCard label="Total Tables"    value={total.toLocaleString()}/>
      </div>
      {catalogSources.map(cs => {
        const csKey  = cs.source;
        const isOpen = !collapsed[csKey];
        const dbCount = (cs.databases || []).length;
        const schemaCount = (cs.schemas || []).length;
        return (
          <div key={csKey} className="bg-white border border-indigo-200 rounded-xl overflow-hidden shadow-sm">
            {/* Level 1 — Catalog Source */}
            <button onClick={() => toggle(csKey)}
              className="w-full bg-indigo-600 text-white px-4 py-2.5 flex items-center justify-between hover:bg-indigo-700 transition-colors">
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold tracking-wide">{cs.source}</span>
              </div>
              <div className="flex items-center gap-3 text-indigo-200 text-xs">
                <span>{cs.total_tables?.toLocaleString()} tables · {schemaCount} schema{schemaCount !== 1 ? "s" : ""}</span>
                <span className="text-lg leading-none">{isOpen ? "▾" : "▸"}</span>
              </div>
            </button>

            {isOpen && (cs.databases || [{ database: "", schemas: cs.schemas || [] }]).map(db => {
              const dbKey   = csKey + "/" + db.database;
              const dbOpen  = !collapsed[dbKey];
              const showDb  = db.database && db.database !== cs.source;
              return (
                <div key={dbKey}>
                  {/* Level 2 — Database (only shown when it differs from source name) */}
                  {showDb && (
                    <button onClick={() => toggle(dbKey)}
                      className="w-full bg-indigo-50 border-b border-indigo-100 px-4 py-1.5 flex items-center justify-between hover:bg-indigo-100 transition-colors">
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-indigo-400 font-medium uppercase tracking-wider">Database</span>
                        <span className="text-xs font-mono font-semibold text-indigo-700">{db.database}</span>
                      </div>
                      <span className="text-indigo-400 text-sm">{dbOpen ? "▾" : "▸"}</span>
                    </button>
                  )}

                  {(!showDb || dbOpen) && (
                    <div className="p-3 space-y-2">
                      {(db.schemas || []).map(s => {
                        const sKey  = dbKey + "/" + s.schema;
                        const sOpen = !collapsed[sKey];
                        return (
                          <div key={sKey} className="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
                            {/* Level 3 — Schema */}
                            <button onClick={() => toggle(sKey)}
                              className="w-full px-2.5 py-1.5 flex items-center justify-between hover:bg-slate-100 transition-colors">
                              <div className="flex items-center gap-1.5">
                                <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>
                                <span className="text-xs font-semibold text-slate-700">{s.schema}</span>
                                <span className="text-xs text-slate-400">({s.tables.length})</span>
                              </div>
                              <span className="text-slate-400 text-xs">{sOpen ? "▾" : "▸"}</span>
                            </button>
                            {/* Level 4 — Tables */}
                            {sOpen && (
                              <div className="px-2.5 pb-2.5">
                                <SchemaTableList tables={s.tables} />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function ScanResult({ data, scanSource, scanSchema }) {
  const cols = data?.columns?.[0];
  const scan = data?.scan?.result;
  if (!cols && !scan) return <JsonViewer data={data}/>;
  if (!cols) {
    const missing    = scan?.missing || [];
    const foundCount = scan?.found_count ?? 0;
    return (
      <div className="space-y-4">
        <div className="grid grid-cols-3 gap-3">
          <SummaryCard label="Found"   value={foundCount}       color="text-slate-500"/>
          <SummaryCard label="Missing" value={missing.length}   color="text-red-500"/>
          <SummaryCard label="Status"  value="Not Found"        color="text-red-500"/>
        </div>
        {missing.length > 0 && (
          <div className="bg-red-50 border border-red-200 rounded-lg p-3">
            <div className="text-xs text-red-500 font-medium mb-2 uppercase tracking-wider">Tables not found in catalog</div>
            <div className="flex flex-wrap gap-1.5">
              {missing.map(m => (
                <span key={m} className="text-xs bg-white border border-red-200 text-red-600 px-2 py-0.5 rounded font-mono">{m}</span>
              ))}
            </div>
            <p className="text-xs text-red-400 mt-2">Table may not be catalogued yet. Try scanning the MCC source first or select a different table.</p>
          </div>
        )}
      </div>
    );
  }

  const columnsList   = data?.columns?.filter(Boolean) || [cols];
  const scanned       = data?.tables_scanned  ?? columnsList.length;
  const totalInSchema = data?.total_in_schema ?? 0;
  const elapsed       = data?.elapsed_seconds ?? 0;
  const estMin        = data?.estimated_full_minutes ?? 0;

  const estLabel = estMin >= 60
    ? `~${(estMin / 60).toFixed(1)} hr`
    : estMin > 0 ? `~${estMin} min` : null;

  // Map column results to scan table metadata (schema/connection per table)
  const scanTables = scan?.tables || [];

  return (
    <div className="space-y-4">
      {/* Summary banner */}
      <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
        <span>Scanned <strong>{scanned}</strong> {scanned === 1 ? "table" : "tables"}{totalInSchema > scanned ? ` of ${totalInSchema.toLocaleString()}` : ""} in <span className="font-mono">{scanSchema === "__ALL_SCHEMAS__" ? "all schemas" : (scanSchema || "schema")}</span> — <strong>{elapsed}s</strong></span>
        {estLabel && totalInSchema > scanned && (
          <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">
            {scanSchema === "__ALL_SCHEMAS__" ? "All schemas" : "Full schema"}: {estLabel} ({totalInSchema.toLocaleString()} tables)
          </span>
        )}
      </div>

      {/* Catalog Source header */}
      {(scanSource || scanSchema) && (
        <div className="border border-indigo-200 rounded-xl overflow-hidden">
          {/* Level 1 — Catalog Source */}
          <div className="bg-indigo-600 text-white px-4 py-2 flex items-center justify-between">
            <span className="text-sm font-semibold tracking-wide">{scanSource || scanSchema}</span>
            <span className="text-indigo-200 text-xs">{scanned} tables scanned</span>
          </div>

          {/* Level 2 — Schema */}
          <div className="bg-indigo-50 border-b border-indigo-100 px-4 py-2 flex items-center gap-2">
            <span className="text-xs text-indigo-400 font-medium uppercase tracking-wider">Schema</span>
            <span className="text-xs font-mono font-semibold text-indigo-700">{scanSchema || scanTables[0]?.schema || "—"}</span>
          </div>

          {/* Level 3+4 — Tables with columns */}
          <div className="divide-y divide-slate-200">
            {columnsList.map((c, i) => {
              const tblMeta = scanTables[i] || {};
              return (
                <div key={i} className="px-4 py-3 space-y-2">
                  {/* Level 3 — Table */}
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-slate-400 font-medium">TABLE</span>
                      <span className="text-sm font-mono font-bold text-slate-800">{c.table || tblMeta.name || "—"}</span>
                    </div>
                    <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">{c.column_count} columns</span>
                  </div>
                  {/* Level 4 — Column chips */}
                  <div className="flex flex-wrap gap-1.5">
                    {(c.columns_preview || []).map(col => (
                      <span key={col} className="text-xs bg-indigo-50 border border-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-mono max-w-[200px] truncate inline-block" title={col}>{col}</span>
                    ))}
                    {c.column_count > (c.columns_preview || []).length && (
                      <span className="text-xs text-slate-400 px-2 py-0.5">+{c.column_count - (c.columns_preview || []).length} more</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// Shared full-schema time-estimate banner (steps 2-6), styled like the Scan banner.
function EstimateBanner({ data }) {
  const elapsed = data?.elapsed_seconds ?? 0;
  const sample  = data?.sample_tables ?? 0;
  const total   = data?.total_in_schema ?? 0;
  const estMin  = data?.estimated_full_minutes ?? 0;
  const fixed   = data?.fixed_cost === true;
  if (!elapsed) return null;
  // Hide the banner when there's no real per-table count to show (avoids a
  // misleading "Processed 0 tables"). Fixed-cost steps render without a count.
  if (!fixed && sample <= 0) return null;
  const estLabel = estMin >= 60 ? `~${(estMin / 60).toFixed(1)} hr` : estMin > 0 ? `~${estMin} min` : null;
  // Fixed-cost step (e.g. Domain Structure): one-time write, does not scale with tables.
  if (fixed) {
    return (
      <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
        <span>Completed in <strong>{elapsed}s</strong></span>
        <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">One-time step — does not scale with table count</span>
      </div>
    );
  }
  return (
    <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
      <span>Processed <strong>{sample}</strong> {sample === 1 ? "table" : "tables"}{total > sample ? ` of ${total.toLocaleString()}` : ""} — <strong>{elapsed}s</strong></span>
      {estLabel && total > sample && (
        <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">Full schema: {estLabel} ({total.toLocaleString()} tables)</span>
      )}
    </div>
  );
}

function TaxonomyResult({ data }) {
  const domains = data?.domains || data?.result?.domains || [];
  const s = data?._summary || data?.result?._summary || {};
  return (
    <div className="space-y-4">
      <EstimateBanner data={data} />
      <div className="grid grid-cols-3 gap-3">
        <SummaryCard label="Domains"    value={s.domain_count || domains.length}/>
        <SummaryCard label="Subdomains" value={s.subdomain_count || "—"}/>
        <SummaryCard label="Business Terms" value={s.term_count || "—"}/>
      </div>
      {domains.map(d => (
        <div key={d.name} className="bg-slate-100 border border-slate-300 rounded-lg p-3 space-y-2">
          <div className="text-sm font-semibold text-brand">◈ {d.name}</div>
          {(d.subdomains || []).map(sd => (
            <div key={sd.name} className="ml-3">
              <div className="text-xs text-slate-600 font-semibold mb-1">◧ {sd.name}</div>
              <div className="flex flex-wrap gap-1.5 ml-3">
                {(sd.business_terms || []).map(bt => (
                  <span key={bt.name} className="text-xs bg-slate-50 border border-slate-300 text-slate-600 px-2 py-0.5 rounded shadow-sm max-w-[200px] truncate inline-block" title={bt.name}>{bt.name}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function DomainStructureResult({ data, domainItems, domainSelected }) {
  const [showSelection, setShowSelection] = React.useState(false);
  // handle both wrapped {result: {...}} and direct {created, skipped, ...} formats
  const r = (data?.result && !data.result.awaiting_approval) ? data.result : (data || {});
  // An error result (e.g. "No taxonomy in state") has no created/skipped/errors —
  // surface it instead of rendering a misleading 0/0/0 summary.
  const errMsg = data?.error || data?.result?.error || r.error;
  if (errMsg) {
    return (
      <div className="bg-red-50 border border-red-200 rounded-lg p-4">
        <div className="text-xs text-red-600 font-medium mb-1 uppercase tracking-wider">Step failed — nothing written to CDGC</div>
        <div className="text-sm text-red-700 font-mono">{errMsg}</div>
      </div>
    );
  }
  const s = r.summary || {};

      {errors.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-lg p-3">
          <div className="text-xs text-red-600 font-medium mb-2 uppercase tracking-wider">Errors</div>
          <div className="space-y-1">
            {errors.map((e, i) => (
              <div key={i} className="text-xs">

          >

          {showSelection && (
            <div className="p-4 space-y-3 bg-white">
              {groups.map(g => {

                <span className="text-xs text-slate-400 w-20 shrink-0 pt-0.5 font-medium">System</span>
                <div className="flex-1 min-w-0">

                  {sys.id && <div className="text-xs font-mono text-slate-400 truncate">{sys.id}</div>}
                  {sys.status && <span className={`inline-block text-xs px-1.5 py-0.5 rounded mt-0.5 font-medium ${sys.status.includes("created") ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{sys.status}</span>}

function DomainApprovalPanel({ items, selected, onToggle, onToggleGroup, onSelectAll, onDeselectAll, onApprove, onRename, approving }) {
  const groups = [
    { type: "Domain",       label: "Domains",          color: "text-violet-600",  bg: "bg-violet-50",  border: "border-violet-200" },
    { type: "SubDomain",    label: "Sub-Domains",       color: "text-indigo-600",  bg: "bg-indigo-50",  border: "border-indigo-200" },
    { type: "BusinessTerm", label: "Business Terms",    color: "text-slate-700",   bg: "bg-slate-50",   border: "border-slate-200"  },
  ];
  const [editingName, setEditingName] = React.useState(null);
  const [editValue,   setEditValue]   = React.useState("");

  const startEdit = (name, e) => {
    e.preventDefault(); e.stopPropagation();
    setEditingName(name);
    setEditValue(name);
  };
  const commitEdit = (oldName) => {
    const newName = editValue.trim();
    if (newName && newName !== oldName) onRename(oldName, newName);
    setEditingName(null);
  };

  return (
    <div className="space-y-4">
      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center gap-3">
        <span className="text-lg">✋</span>
        <div>
          <div className="text-sm font-semibold text-amber-800">Review before creating in CDGC</div>
          <div className="text-xs text-amber-600">Deselect any items you don't want. Click a name to rename it.</div>
        </div>
      </div>

      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{selected.size} / {items.length} selected</span>
        <div className="flex gap-2">
          <button onClick={onSelectAll}   className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-brand hover:text-brand transition-colors">Select all</button>
          <button onClick={onDeselectAll} className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-red-300 hover:text-red-500 transition-colors">Deselect all</button>
        </div>
      </div>

      {groups.map(g => {
        const groupItems = items.filter(i => i.type === g.type);
        if (!groupItems.length) return null;
        const groupSelected = groupItems.filter(i => selected.has(i.name));
        const allChecked = groupSelected.length === groupItems.length;
        return (
          <div key={g.type} className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm">
            {/* Group header */}
            <div className={`flex items-center gap-2 px-4 py-2.5 ${g.bg} border-b border-slate-200`}>
              <input
                type="checkbox"
                checked={allChecked}
                onChange={() => onToggleGroup(groupItems.map(i => i.name), !allChecked)}
                className="accent-violet-600 cursor-pointer w-3.5 h-3.5"
              />
              <span className={`text-xs font-bold uppercase tracking-wider ${g.color}`}>{g.label}</span>
              <span className="text-xs text-slate-400 font-medium">{groupSelected.length} / {groupItems.length}</span>
            </div>
            {/* Item rows */}
            <div className="divide-y divide-slate-100">
              {groupItems.map(item => {
                const isSelected = selected.has(item.name);
                const isEditing  = editingName === item.name;
                return (
                  <div key={item.name}
                    className={`flex items-center gap-3 px-4 py-2.5 group transition-colors ${isSelected ? "bg-white hover:bg-slate-50" : "bg-slate-50 opacity-50"}`}>
                    <input
                      type="checkbox"
                      checked={isSelected}
                      onChange={() => onToggle(item.name)}
                      className="accent-violet-600 cursor-pointer w-3.5 h-3.5 shrink-0"
                    />
                    <div className="flex-1 min-w-0 flex items-center gap-2">
                      {isEditing ? (
                        <input
                          autoFocus
                          value={editValue}
                          onChange={e => setEditValue(e.target.value)}
                          onBlur={() => commitEdit(item.name)}
                          onKeyDown={e => { if (e.key === "Enter") commitEdit(item.name); if (e.key === "Escape") setEditingName(null); }}
                          onClick={e => e.stopPropagation()}
                          className="flex-1 border border-violet-300 rounded px-2 py-0.5 text-sm font-medium text-slate-800 outline-none bg-white shadow-inner"
                        />
                      ) : (
                        <span className="text-sm font-medium text-slate-700 break-words">{item.name}</span>
                      )}
                      {item.parent && !isEditing && (
                        <span className="shrink-0 text-xs bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded font-normal truncate max-w-[120px]" title={item.parent}>{item.parent}</span>
                      )}
                    </div>
                    <button
                      onClick={e => startEdit(item.name, e)}
                      className="shrink-0 opacity-0 group-hover:opacity-100 transition-all px-2 py-0.5 rounded bg-violet-100 text-violet-600 hover:bg-violet-200 text-xs font-medium"
                      title="Rename"
                    >✎ Rename</button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      <button
        onClick={onApprove}
        disabled={approving || selected.size === 0}
        className={`w-full flex items-center justify-center gap-2 px-5 py-3 rounded-xl font-semibold text-sm transition-all
          ${approving || selected.size === 0
            ? "bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200"
            : "bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-md shadow-emerald-100 hover:shadow-emerald-200"}`}
      >
        {approving ? <><Spinner/> Creating in CDGC…</> : <>✓ Approve &amp; Create ({selected.size} items)</>}
      </button>
    </div>
  );
}

function CurateResult({ data }) {
  const batches = data?.batches || [];
  const last = batches[batches.length - 1] || {};
  const totalLinked  = last.total_linked_so_far  ?? 0;
  const totalSkipped = last.total_skipped_so_far ?? batches.reduce((s, b) => s + (b.skipped || 0), 0);
  const totalCols    = (() => { const m = (last.progress || "").match(/(\d+)\/(\d+)/); return m ? parseInt(m[2]) : 0; })();
  const unmatched    = totalCols - totalLinked - totalSkipped;
  const pct          = last.progress?.match(/\((\d+)%\)/)?.[1] || "100";
  return (
    <div className="space-y-4">
      <EstimateBanner data={data} />
      <div className="grid grid-cols-3 gap-3">
        <SummaryCard label="Linked"    value={totalLinked}  color="text-emerald-600"/>
        <SummaryCard label="Skipped"   value={totalSkipped} color="text-amber-600"/>
        <SummaryCard label="Total cols" value={totalCols}   color="text-slate-500"/>
      </div>
      <div className="bg-slate-100 border border-slate-300 rounded-lg p-3">
        <div className="flex items-center gap-2 mb-1">
          <div className="flex-1 bg-slate-300 rounded-full h-2">
            <div className="bg-emerald-500 h-2 rounded-full transition-all" style={{width: `${pct}%`}}/>
          </div>
          <span className="text-xs text-slate-500 font-medium">{last.progress}</span>
        </div>
        {batches.length > 1 && (
          <div className="text-xs text-slate-400 mt-1">{totalLinked} linked · {totalSkipped} skipped{unmatched > 0 ? ` · ${unmatched} no match` : ""}</div>
        )}
      </div>
    </div>
  );
}

        <div>

        </div>
      </div>

function SubStepRow({ label, result, detail }) {
  const s = result?.status || "";
  const ok = ["created","existing","done","published","linked","already_linked","found","partial"].some(v => s.includes(v));
  const failed = s.includes("failed") || result?.error;
  const icon = failed ? "✗" : ok ? "✓" : "–";
  const color = failed ? "text-red-500" : ok ? "text-emerald-600" : "text-slate-400";
  return (
    <div className="flex items-start gap-3 py-2 border-b border-slate-100 last:border-0">
      <span className={`text-sm font-bold w-4 shrink-0 ${color}`}>{icon}</span>
      <div className="flex-1 min-w-0">
        <div className="text-xs font-semibold text-slate-700">{label}</div>
        {result?.error && <div className="text-xs text-red-500 mt-0.5 truncate">{result.error}</div>}
        {!result?.error && detail && <div className="text-xs text-slate-500 mt-0.5">{detail}</div>}
        {!result?.error && !detail && s && <div className="text-xs text-slate-400 mt-0.5">{s}</div>}
      </div>
    </div>
  );
}

    { label: "Terms of Use",      key: "terms_of_use" },

    const r = data?.[s.key]; const st = r?.status || "";

  function detailFor(key, r) {
    if (!r) return null;
    const name = r.name || r.template_name || r.target_name || r.title || null;

    return name || null;

  return (
    <div className="space-y-3">
      <div className="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
        {all.map(s => <SubStepRow key={s.key} label={s.label} result={data?.[s.key]} detail={detailFor(s.key, data?.[s.key])}/>)}

      {allOk && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm font-semibold text-emerald-800">✓ Delivery configuration complete</div>}

            <div className="text-sm font-semibold text-slate-700">Access withdrawn</div>
            <div className="text-xs text-slate-500">Full governance lifecycle demonstrated: onboard → govern → publish → access → revoke.</div>
          </div>
        </div>
      )}
      {data?.error && <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{data.error}</pre></div>}
    </div>
  );
}

function UsageContextResult({ data }) {
  const ok = data?.status === "done" || data?.status === "partial";
  const created = data?.created || [];
  const skipped = data?.skipped || [];
  const failed  = data?.failed  || [];
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-3 gap-3">
        <SummaryCard label="Created" value={created.length} color="text-emerald-600"/>
        <SummaryCard label="Skipped" value={skipped.length} color="text-amber-600"/>
        <SummaryCard label="Failed"  value={failed.length}  color={failed.length ? "text-red-500" : "text-slate-400"}/>
      </div>
      {created.length > 0 && (
        <div className="bg-slate-100 border border-slate-300 rounded-lg p-4">
          <div className="text-xs font-semibold text-slate-500 mb-2">Created</div>
          <div className="flex flex-wrap gap-2">{created.map(c => <span key={c} className="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">{c}</span>)}</div>
        </div>
      )}
      {skipped.length > 0 && (
        <div className="bg-slate-100 border border-slate-300 rounded-lg p-4">
          <div className="text-xs font-semibold text-slate-500 mb-2">Already existed</div>
          <div className="flex flex-wrap gap-2">{skipped.map(c => <span key={c} className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded">{c}</span>)}</div>
        </div>
      )}
      {failed.length > 0 && <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{JSON.stringify(failed, null, 2)}</pre></div>}
    </div>
  );
}

function GovernMetadataResult({ data }) {
  const all = [
    { label: "Taxonomy",          key: "taxonomy" },
    { label: "Domain Structure",  key: "domain_structure" },
    { label: "System & Dataset",  key: "system_dataset" },
  ];
  const allOk = all.every(s => {
    const r = data?.[s.key]; const st = r?.status || "";
    return ["created","existing","done","published","linked","found","complete","ok"].some(v => st.includes(v)) || (s.key === "taxonomy" && r?.result);
  });
  return (
    <div className="space-y-3">
      <div className="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
        {all.map(s => <SubStepRow key={s.key} label={s.label} result={
          s.key === "taxonomy"
            ? { status: data?.[s.key]?.result ? "done" : data?.[s.key] ? "done" : "" }
            : data?.[s.key]
        }/>)}
      </div>
      {allOk && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm font-semibold text-emerald-800">✓ Metadata governance complete</div>}
    </div>
  );
}

function DataQualityResult({ data }) {
  const dqR    = data?.dq_rules;
  const scR    = data?.scores;
  const dqOk   = (dqR?.rules?.occurrences_registered?.length ?? 0) > 0;
  const scOk   = scR?.pushed > 0 || scR?.scores?.length > 0;
  const dqCount = dqR?.rules?.occurrences_registered?.length ?? null;
  const scCount = scR?.pushed ?? scR?.scores?.length ?? null;
  const dqErrors = dqR?.rules?.errors || [];
  const allOk  = dqOk && scOk;
  return (
    <div className="space-y-3">
      <EstimateBanner data={data} />
      <div className="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
        <SubStepRow label="DQ Rules"        result={{ status: dqOk ? "done" : dqErrors.length ? "failed" : dqR ? "done" : "", error: dqR?.error }} detail={dqCount != null ? `${dqCount} rule occurrences` : null}/>
        <SubStepRow label="Generate Scores" result={{ status: scOk ? "done" : scR ? "done" : "", error: scR?.error }} detail={scCount != null ? `${scCount} scores pushed` : null}/>
      </div>
      {dqErrors.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-lg p-3">
          <div className="text-xs font-semibold text-red-700 mb-1">Rule creation errors ({dqErrors.length})</div>
          {dqErrors.slice(0, 3).map((e, i) => <div key={i} className="text-xs text-red-600 truncate">{e}</div>)}
          {dqErrors.length > 3 && <div className="text-xs text-red-400">…and {dqErrors.length - 3} more</div>}
        </div>
      )}
      {allOk && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm font-semibold text-emerald-800">✓ DQ rules and scores registered in CDGC</div>}
    </div>
  );
}

function PublishGovernanceResult({ data }) {
  const r = data?.result || data || {};
  const ok = r.job_id || r.scan_triggered;
  const jobId = r.job_id || "—";
  const source = r.catalog_source || "—";
  const status = r.status || (ok ? "Triggered" : "—");
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <SummaryCard label="Status"         value={status} color={ok ? "text-emerald-600" : "text-red-500"}/>
        <SummaryCard label="Catalog Source" value={source} color="text-slate-600"/>
      </div>
      {jobId !== "—" && (
        <div className="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-lg border border-slate-200">
          <span className="text-xs text-slate-400 font-medium shrink-0">Job ID</span>
          <span className="text-xs font-mono text-slate-600 break-all">{jobId}</span>
        </div>
      )}
      {ok && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm font-semibold text-emerald-800">✓ MCC scan triggered — real DQ scores will publish to the Governance Catalog</div>}
      {!ok && (r.trigger_error || r.note) && (
        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
          <div className="text-xs font-semibold text-amber-800 mb-1">Why the scan didn't run</div>
          {r.trigger_error && <pre className="text-xs text-amber-800 whitespace-pre-wrap break-all">{r.trigger_error}</pre>}
          {r.note && <div className="text-xs text-amber-700 mt-2 whitespace-pre-wrap">{r.note}</div>}
        </div>
      )}
      {data?.error && <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{data.error}</pre></div>}
    </div>
  );
}

const INPUT_CLS = "w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100";

function Field({ label, hint, children }) {
  return (
    <div>
      <label className="block text-xs text-slate-500 font-medium mb-1">{label}</label>
      {children}
      {hint && <p className="text-xs text-slate-400 mt-1">{hint}</p>}
    </div>
  );
}

function PrimaryButton({ onClick, running, disabled, children, tone = "indigo" }) {
  const enabled = !running && !disabled;
  const toneCls = tone === "emerald"
    ? "bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-md shadow-emerald-100"
    : "bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow-md shadow-indigo-200";
  return (
    <button onClick={onClick} disabled={!enabled}
      className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold text-sm transition-all
        ${enabled ? toneCls : "bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200"}`}>
      {running ? <><Spinner/> Running…</> : children}

}

function ErrorBox({ error }) {
  if (!error) return null;
  return (
    <div className="bg-red-50 border border-red-200 rounded-xl p-4">
      <div className="text-xs font-semibold text-red-600 mb-1 uppercase tracking-wider">Error</div>
      <div className="text-sm text-red-700 font-mono break-words">{String(error)}</div>
    </div>
  );
}

// Empty results that are legitimate need copy explaining WHY — otherwise they
// read as a broken feature in front of a client.
function EmptyState({ icon = "◌", title, body }) {
  return (
    <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 flex items-start gap-3">
      <span className="text-2xl">{icon}</span>
      <div>
        <div className="text-sm font-semibold text-amber-800">{title}</div>
        <div className="text-xs text-amber-700 mt-1 leading-relaxed">{body}</div>
      </div>
    </div>
  );
}

function DimChip({ dim }) {
  return <span className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100 text-xs">{dim || "—"}</span>;
}

function SevBadge({ severity }) {
  const s = (severity || "").toUpperCase();
  const cls = s === "HIGH"   ? "bg-red-100 text-red-700 border-red-300"
            : s === "MEDIUM" ? "bg-amber-100 text-amber-700 border-amber-300"
            :                  "bg-emerald-100 text-emerald-700 border-emerald-300";
  return <span className={`px-2 py-0.5 rounded-full border text-xs font-bold ${cls}`}>{s || "LOW"}</span>;
}

function SectionTabs({ tabs, active, onChange }) {
  return (
    <div className="flex flex-wrap gap-1 border-b border-slate-300 pb-0 mb-5">
      {tabs.map(t => (
        <button key={t.id} onClick={() => onChange(t.id)}
          className={`px-4 py-2 text-sm font-medium rounded-t-lg border border-b-0 transition-colors
            ${active === t.id
              ? "bg-slate-50 border-slate-300 text-indigo-700 font-semibold"
              : "bg-transparent border-transparent text-slate-500 hover:text-slate-700"}`}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function DataTable({ columns, rows, empty }) {
  if (!rows || rows.length === 0) return empty || <div className="text-xs text-slate-400 italic p-3">No entries.</div>;
  return (
    <div className="overflow-x-auto border border-slate-200 rounded-xl">
      <table className="w-full text-xs">
        <thead className="bg-slate-100 text-slate-500 uppercase tracking-wider">
          <tr>{columns.map(c => <th key={c.key} className="px-3 py-2 text-left whitespace-nowrap">{c.label}</th>)}</tr>
        </thead>
        <tbody className="divide-y divide-slate-100 bg-white">
          {rows.map((r, i) => (
            <tr key={i} className="hover:bg-slate-50">
              {columns.map(c => <td key={c.key} className="px-3 py-2 text-slate-700 align-top">{c.render ? c.render(r) : (r[c.key] ?? "—")}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Shared renderer for orchestrator step reports (onboard_and_govern,
// profile_and_govern, run_governance_pipeline).
function PipelineStepsList({ steps }) {
  if (!steps || !steps.length) return null;
  return (
    <div className="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">
      {steps.map((s, i) => {
        const st = (s.status || "").toUpperCase();
        const ok = st === "SUCCESS";
        const failed = st === "FAILED";
        const icon = ok ? "✓" : failed ? "✗" : "⊘";
        const color = ok ? "text-emerald-600" : failed ? "text-red-500" : "text-amber-500";
        return (
          <div key={i} className="flex items-start gap-3 px-4 py-2.5">
            <span className={`text-sm font-bold w-4 shrink-0 ${color}`}>{icon}</span>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-slate-700 font-mono">{s.step}</span>
                <span className={`text-xs font-medium ${color}`}>{st}</span>
                {s.elapsed_ms != null && <span className="text-xs text-slate-400">{(s.elapsed_ms / 1000).toFixed(1)}s</span>}
              </div>
              {s.error  && <div className="text-xs text-red-500 mt-0.5 break-words">{s.error}</div>}
              {s.reason && <div className="text-xs text-amber-600 mt-0.5">{s.reason}</div>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Header widgets ────────────────────────────────────────────────────────────

// Polls all six MCP servers and NAMES the ones that are down. During a demo a
// silent failure is worse than a visible one.
function HealthIndicator() {
  const [health, setHealth] = useState(null);
  usePolling(async () => {
    try { setHealth(await apiGet("/api/health")); }
    catch (e) { setHealth({ servers: [], down: ["ui backend"], all_ok: false, online: 0, total: 6 }); }
  }, 30000, true);

  if (!health) return (
    <div className="flex items-center gap-2">
      <span className="w-2 h-2 rounded-full bg-slate-300 pulse inline-block"/>
      <span className="text-xs text-slate-400 font-medium">Checking MCP servers…</span>
    </div>
  );
  if (health.all_ok) return (
    <div className="flex items-center gap-2" title={(health.servers || []).map(s => s.server).join(", ")}>
      <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"/>
      <span className="text-xs text-slate-400 font-medium">MCP servers {health.online}/{health.total} online</span>
    </div>
  );
  return (
    <div className="flex items-center gap-2" title={(health.servers || []).filter(s => !s.ok).map(s => `${s.server}: ${s.error || "down"}`).join("\n")}>
      <span className="w-2 h-2 rounded-full bg-red-500 pulse inline-block"/>
      <span className="text-xs text-red-500 font-semibold">{(health.down || []).join(", ")} down</span>
    </div>
  );
}

function SessionExpiredBanner({ message, onDismiss }) {
  if (!message) return null;
  return (
    <div className="bg-red-50 border-b border-red-200 px-6 py-2.5 flex items-center gap-3 shrink-0">
      <span className="text-lg">⚠️</span>
      <div className="flex-1">
        <span className="text-sm font-semibold text-red-800">IDMC session expired — </span>
        <span className="text-xs text-red-700">refresh the session (scripts/refresh-session.sh or re-login), then re-run the action.</span>
      </div>
      <button onClick={onDismiss} className="text-xs px-3 py-1 rounded-lg border border-red-300 text-red-600 font-semibold bg-white hover:bg-red-100">Dismiss</button>
    </div>
  );
}

function fmtPct(v) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return (n <= 1 ? n * 100 : n).toFixed(1) + "%";
}

function ProfileResult({ data }) {
  const cols = data?.columns || {};
  const names = Object.keys(cols);
  const pathLabel = data?.profile_path === "snowflake_direct" ? "Computed locally — direct Snowflake query"
                  : data?.profile_path === "cdgc_catalog"     ? "Informatica profiling service (via CDGC catalog)"
                  : "Informatica profiling service";
  const profiled = data?.profiled_count;
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-3 gap-3">
        <SummaryCard label="Rows profiled" value={(data?.total_rows ?? "—").toLocaleString ? (data?.total_rows ?? 0).toLocaleString() : (data?.total_rows ?? "—")}/>
        <SummaryCard label="Columns" value={names.length}/>
        <SummaryCard label="Statistics path" value={data?.profile_path === "snowflake_direct" ? "Snowflake direct" : "IDMC service"} color="text-slate-600"/>
      </div>
      <div className="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2 text-xs text-indigo-700 font-medium">
        {pathLabel} — the two paths have different fidelity; this panel always states which one produced the numbers.
      </div>
      {profiled === 0 && (
        <EmptyState icon="⏱" title="Profile ran, statistics not yet in the catalog"
          body="CDGC ingests profiling statistics asynchronously — results typically appear a few minutes after the profiling job completes. Re-run this step shortly, or use 'Compute locally' for immediate statistics."/>
      )}
      {names.length > 0 && (
        <DataTable
          columns={[
            { key: "name",     label: "Column",   render: r => <span className="font-mono font-semibold">{r.name}</span> },
            { key: "type",     label: "Type",     render: r => <span className="text-slate-500">{r.stats.data_type || "—"}</span> },
            { key: "nulls",    label: "Nulls",    render: r => {
                const pct = r.stats.null_pct;
                const bad = Number(pct) > (Number(pct) <= 1 ? 0.1 : 10);
                return <span className={bad ? "text-red-600 font-semibold" : ""}>{r.stats.null_count ?? "—"} ({fmtPct(pct)})</span>;
              } },
            { key: "distinct", label: "Distinct", render: r => r.stats.distinct_count ?? "—" },
            { key: "min",      label: "Min",      render: r => <span className="font-mono">{String(r.stats.min_value ?? "—").slice(0, 24)}</span> },
            { key: "max",      label: "Max",      render: r => <span className="font-mono">{String(r.stats.max_value ?? "—").slice(0, 24)}</span> },
            { key: "top",      label: "Top value", render: r => {
                const tv = (r.stats.top_values || [])[0];
                return tv ? <span className="font-mono">{String(tv.value).slice(0, 20)} ×{tv.count}</span> : "—";
              } },
          ]}
          rows={names.map(n => ({ name: n, stats: cols[n] || {} }))}
        />
      )}
      {names.length === 0 && !profiled && (
        <EmptyState title="No column statistics returned"
          body="This connector may not be able to enumerate columns through the profiling service. Use 'Compute locally' to query the warehouse directly."/>
      )}
    </div>
  );
}

// Selectable recommendations — same checkbox pattern as Domain Structure approval.
function RecommendRulesResult({ data, recSelected, onToggleRec, onSetAllRecs }) {
  const recs = data?.recommendations || [];
  if (!recs.length) return (
    <EmptyState icon="✓" title="No rule recommendations — the profiled data looks healthy"
      body="The profiling statistics did not cross any recommendation thresholds (nulls, blanks, ranges, patterns, staleness, duplicates). You can still add rules manually in the Data Quality step."/>
  );
  const selected = recSelected || new Set();
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <SummaryCard label="Recommendations" value={data?.recommendation_count ?? recs.length}/>
        <SummaryCard label="Selected" value={selected.size} color="text-emerald-600"/>
      </div>
      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{selected.size} / {recs.length} selected — flows into the Data Quality step</span>
        <div className="flex gap-2">
          <button onClick={() => onSetAllRecs(true)}  className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-brand hover:text-brand transition-colors">Select all</button>
          <button onClick={() => onSetAllRecs(false)} className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-red-300 hover:text-red-500 transition-colors">Deselect all</button>
        </div>
      </div>
      <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm divide-y divide-slate-100">
        {recs.map((r, i) => {
          const key = r.suggested_rule_name || `${r.column_name}-${r.dimension}-${i}`;
          const isSel = selected.has(key);
          return (
            <div key={key} className={`flex items-start gap-3 px-4 py-3 transition-colors ${isSel ? "bg-white hover:bg-slate-50" : "bg-slate-50 opacity-60"}`}>
              <input type="checkbox" checked={isSel} onChange={() => onToggleRec(key)}
                className="accent-violet-600 cursor-pointer w-3.5 h-3.5 shrink-0 mt-0.5"/>
              <div className="flex-1 min-w-0">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-mono font-semibold text-slate-800">{r.column_name}</span>
                  <DimChip dim={r.dimension}/>
                  <SevBadge severity={r.severity}/>
                  {r.affected_rows != null && <span className="text-xs text-slate-400">{r.affected_rows.toLocaleString ? r.affected_rows.toLocaleString() : r.affected_rows} rows affected</span>}
                </div>
                {/* The profiling evidence behind the recommendation — the differentiator */}
                <div className="text-xs text-slate-600 mt-1">{r.rationale}</div>
                <div className="text-xs text-slate-400 mt-0.5 font-mono">{r.suggested_rule_name} · template: {r.rule_template}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LinkAssetResult({ data }) {
  const ok = (data?.status || "").includes("upload") || data?.csv_upload?.status === "uploaded";
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <SummaryCard label="Status" value={data?.status || "—"} color={ok ? "text-emerald-600" : "text-amber-600"}/>
        <SummaryCard label="Collection" value={(data?.collection_name || "—").slice(0, 28)} color="text-slate-600"/>
      </div>
      <div className="bg-slate-100 border border-slate-300 rounded-lg p-4 space-y-2">
        <div className="flex items-start gap-2">
          <span className="text-xs text-slate-400 w-28 shrink-0 font-medium">Asset</span>
          <span className="text-xs font-medium text-slate-700">{data?.asset_name || "—"}</span>
        </div>
        <div className="flex items-start gap-2">
          <span className="text-xs text-slate-400 w-28 shrink-0 font-medium">Collection ID</span>
          <span className="text-xs font-mono text-brand break-all">{data?.collection_id || "—"}</span>
        </div>
        {data?.csv_upload && <UploadBadge upload={data.csv_upload} label="Link CSV"/>}
      </div>
      {data?.error && <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{data.error}</pre></div>}
    </div>

}

// Phase 2 — Operate section

const JOB_TERMINAL = new Set(["SUCCESS", "FAILED", "WARNING", "STOPPED"]);

function JobStateChip({ label }) {
  const l = (label || "").toUpperCase();
  const cls = l === "SUCCESS" ? "bg-emerald-100 text-emerald-700 border-emerald-300"
            : l === "FAILED"  ? "bg-red-100 text-red-700 border-red-300"
            : l === "WARNING" ? "bg-amber-100 text-amber-700 border-amber-300"
            : l === "STOPPED" ? "bg-slate-200 text-slate-600 border-slate-300"
            :                   "bg-indigo-100 text-indigo-700 border-indigo-300";
  const running = !JOB_TERMINAL.has(l);
  return (
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-xs font-semibold ${cls}`}>
      {running && <span className="w-1.5 h-1.5 rounded-full bg-indigo-500 pulse inline-block"/>}
      {label || "…"}
    </span>
  );
}

// M_DQ_Generic is a hard dependency of DQ execution — detect its absence on
// screen load and show setup guidance instead of failing at run time.
function TemplateGuard({ config }) {
  if (!config || config.has_dq_template) return null;
  return (
    <EmptyState icon="🔧" title="DQ execution template not configured (M_DQ_Generic)"
      body="Mapping-task generation binds the parameterized M_DQ_Generic mapping. Import it into this org (Data Integration → Import), then set IDMC_DQ_TEMPLATE_MAPPING_ID in .env to its published mapping id. Until then, 'New task from rule' is disabled."/>
  );
}

  const [error, setError]     = useState(null);

          { key: "id", label: "Task ID", render: r => <span className="font-mono text-slate-500">{r.id}</span> },

// Presets match the comparison-document wording exactly: daily, hourly, weekly, monthly.
const SCHEDULE_PRESETS = [
  { id: "Hourly",  label: "Hourly" },
  { id: "Daily",   label: "Daily" },
  { id: "Weekly",  label: "Weekly" },
  { id: "Monthly", label: "Monthly" },
];
const WEEKDAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

function OperateSchedulesScreen() {
  const [form, setForm] = useState({ name: "", interval: "Daily", startLocal: "", frequency: "", day_of_month: "", days: {} });
  const [running, setRunning] = useState(false);
  const [error, setError]     = useState(null);
  const [created, setCreated] = useState(null);

  const submit = async () => {
    setRunning(true); setError(null);
    try {
      if (!form.startLocal) throw new Error("Pick a first-run date & time.");
      const iso = new Date(form.startLocal).toISOString();   // always .000Z — the API silently mis-fires on malformed timestamps
      const body = { name: form.name, interval: form.interval, start_time: iso, start_time_utc: iso };
      if (form.frequency) body.frequency = parseInt(form.frequency, 10);
      if (form.interval === "Weekly") WEEKDAYS.forEach(d => { if (form.days[d]) body[d] = true; });
      if (form.interval === "Monthly" && form.day_of_month) body.day_of_month = parseInt(form.day_of_month, 10);
      setCreated(await apiPost("/api/operate/schedules/create", body));
    } catch (e) { setError(e.message); }
    finally { setRunning(false); }
  };

  return (
    <div className="space-y-5">
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">New execution schedule</div>
        <Field label="Schedule name"><input className={INPUT_CLS} placeholder="e.g. Nightly_DQ_Run" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))}/></Field>
        <Field label="Recurrence">
          <div className="flex gap-2">
            {SCHEDULE_PRESETS.map(p => (
              <button key={p.id} onClick={() => setForm(f => ({ ...f, interval: p.id }))}
                className={`px-4 py-1.5 rounded-lg text-xs font-semibold border transition-all
                  ${form.interval === p.id ? "bg-indigo-600 border-indigo-700 text-white" : "bg-white border-slate-300 text-slate-600 hover:border-brand hover:text-brand"}`}>
                {p.label}
              </button>
            ))}
          </div>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="First run (local time)" hint="Sent to IDMC as UTC (.000Z)">
            <input type="datetime-local" className={INPUT_CLS} value={form.startLocal} onChange={e => setForm(f => ({ ...f, startLocal: e.target.value }))}/>
          </Field>
          {(form.interval === "Hourly" || form.interval === "Daily") && (
            <Field label={form.interval === "Hourly" ? "Every N hours" : "Every N days"}>
              <select className={INPUT_CLS} value={form.frequency} onChange={e => setForm(f => ({ ...f, frequency: e.target.value }))}>
                <option value="">1 (default)</option>
                {(form.interval === "Hourly" ? [2, 3, 4, 6, 8, 12] : [2, 3, 5, 7, 10, 14, 30]).map(n => <option key={n} value={n}>{n}</option>)}
              </select>
            </Field>
          )}
          {form.interval === "Monthly" && (
            <Field label="Day of month"><input type="number" min="1" max="28" className={INPUT_CLS} value={form.day_of_month} onChange={e => setForm(f => ({ ...f, day_of_month: e.target.value }))}/></Field>
          )}
        </div>
        {form.interval === "Weekly" && (
          <Field label="Run on">
            <div className="flex gap-2 flex-wrap">
              {WEEKDAYS.map(d => (
                <label key={d} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all
                    ${form.days[d] ? "bg-indigo-600 border-indigo-700 text-white" : "bg-white border-slate-300 text-slate-600"}`}>
                  <input type="checkbox" className="hidden" checked={!!form.days[d]} onChange={() => setForm(f => ({ ...f, days: { ...f.days, [d]: !f.days[d] } }))}/>
                  {d.toUpperCase()}
                </label>
              ))}
            </div>
          </Field>
        )}
        <PrimaryButton onClick={submit} running={running} disabled={!form.name || !form.startLocal}>＋ Create schedule</PrimaryButton>
        <ErrorBox error={error}/>
        {created && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800 space-y-1">
            <div>✓ Schedule <strong>{created.name}</strong> created — {created.interval}{created.frequency ? ` (every ${created.frequency})` : ""}</div>
            <div className="font-mono text-emerald-700">id {created.id} · first run {created.startTime}</div>
            <div className="text-emerald-600">Attach it to a mapping task in the Mapping Tasks tab, or reference it from a taskflow.</div>
          </div>
        )}
      </div>
    </div>
  );
}

function OperateTaskflowsScreen() {
  const [tasks, setTasks]   = useState([]);

  useEffect(() => {
    apiPost("/api/operate/tasks/list", { top: 100 }).then(d => setTasks(d.tasks || [])).catch(e => setError(e.message));
  }, []);

  const toggle = (id) => setPicked(prev => prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id]);

  const submit = async () => {
    setRunning(true); setError(null);
    try {
      const flowTasks = picked.map(id => {
        const t = tasks.find(x => x.id === id);
        return { taskId: id, type: "MTT", name: t?.name || id };
      });
      setCreated(await apiPost("/api/operate/taskflows/create", { name, tasks: flowTasks }));

  return (

        <Field label="Tasks — click to add in run order" hint={picked.length ? `Order: ${picked.map(id => (tasks.find(t => t.id === id)?.name) || id).join(" → ")}` : "Tasks run sequentially in the order selected"}>
          <div className="rounded-xl border border-slate-200 bg-white divide-y divide-slate-100 max-h-64 overflow-y-auto scrollbar-thin">

              return (
                <button key={t.id} onClick={() => toggle(t.id)}
                  className={`w-full flex items-center gap-3 px-4 py-2 text-left transition-colors ${idx >= 0 ? "bg-indigo-50" : "hover:bg-slate-50"}`}>
                  <span className={`w-5 h-5 rounded-full text-xs flex items-center justify-center font-bold shrink-0 ${idx >= 0 ? "bg-indigo-600 text-white" : "bg-slate-200 text-slate-400"}`}>{idx >= 0 ? idx + 1 : "+"}</span>
                  <span className="text-sm font-medium text-slate-700 truncate">{t.name}</span>
                  <span className="ml-auto text-xs font-mono text-slate-400">{t.id}</span>
                </button>
              );
            })}
            {!tasks.length && <div className="text-xs text-slate-400 italic p-3">No mapping tasks yet — create one in the Mapping Tasks tab first.</div>}
          </div>
        </Field>
        <PrimaryButton onClick={submit} running={running} disabled={!name || picked.length === 0}>＋ Create taskflow ({picked.length} tasks)</PrimaryButton>
        <ErrorBox error={error}/>
        {created && (
          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs text-emerald-800">
            ✓ Taskflow <strong>{created.name}</strong> created — {created.taskCount} tasks, id <span className="font-mono">{created.id}</span>
          </div>
        )}
      </div>
    </div>
  );
}

function OperateRunsScreen() {
  const [tasks, setTasks]     = useState([]);
  const [taskId, setTaskId]   = useState("");
  const [starting, setStarting] = useState(false);
  const [error, setError]     = useState(null);
  const [runs, setRuns]       = useState([]);   // {runId, taskId, taskName, entry, state_label}

  useEffect(() => {
    apiPost("/api/operate/tasks/list", { top: 100 }).then(d => setTasks(d.tasks || [])).catch(e => setError(e.message));
  }, []);

  const anyLive = runs.some(r => !JOB_TERMINAL.has((r.state_label || "").toUpperCase()));

  usePolling(async () => {
    const live = runs.filter(r => !JOB_TERMINAL.has((r.state_label || "").toUpperCase()));
    for (const r of live) {
      try {
        const st = await apiPost("/api/operate/job_status", { run_id: r.runId, task_id: r.taskId });
        const entry = st.first || (st.entries || [])[0];
        if (entry) {
          setRuns(prev => prev.map(p => p.runId === r.runId ? { ...p, entry, state_label: entry.state_label, source: st.source } : p));
        }
        // An empty monitor response is NOT failure — the job may have moved to the log.
      } catch (e) {}
    }
  }, 5000, anyLive);

  const trigger = async () => {
    setStarting(true); setError(null);
    try {
      const out = await apiPost("/api/operate/run", { task_id: taskId });
      const t = tasks.find(x => x.id === taskId);
      setRuns(prev => [{ runId: out.runId, taskId, taskName: out.taskName || t?.name || taskId, entry: null, state_label: "QUEUED" }, ...prev]);
    } catch (e) { setError(e.message); }
    finally { setStarting(false); }
  };

  return (
    <div className="space-y-5">
      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm space-y-3">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Trigger a job</div>
        <div className="flex gap-3 items-end">
          <div className="flex-1">
            <Field label="Mapping task">
              <select className={INPUT_CLS} value={taskId} onChange={e => setTaskId(e.target.value)}>
                <option value="">Select a task…</option>
                {tasks.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </Field>
          </div>
          <PrimaryButton onClick={trigger} running={starting} disabled={!taskId}>▶ Run now</PrimaryButton>
        </div>
        <ErrorBox error={error}/>
      </div>

      <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Job runs (live — polls the activity monitor, falls back to the activity log)</div>
      {runs.length === 0
        ? <div className="text-xs text-slate-400 italic p-3 bg-white border border-slate-200 rounded-xl">No runs triggered this session.</div>
        : (
          <div className="border border-slate-200 rounded-xl overflow-hidden bg-white divide-y divide-slate-100">
            {runs.map(r => (
              <div key={r.runId} className="px-4 py-3 flex items-center gap-4">
                <JobStateChip label={r.state_label}/>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-slate-700 truncate">{r.taskName}</div>
                  <div className="text-xs text-slate-400 font-mono">run {r.runId}{r.entry?.start_time ? ` · started ${r.entry.start_time}` : ""}{r.entry?.end_time ? ` · ended ${r.entry.end_time}` : ""}</div>
                  {r.entry?.error_message && <div className="text-xs text-red-500 mt-0.5 break-words">{r.entry.error_message}</div>}
                </div>
                {r.entry && (
                  <div className="text-xs text-slate-500 text-right shrink-0">
                    <div><span className="text-emerald-600 font-semibold">{r.entry.success_target_rows ?? "—"}</span> rows ok</div>
                    <div><span className={r.entry.failed_target_rows ? "text-red-500 font-semibold" : ""}>{r.entry.failed_target_rows ?? "—"}</span> failed</div>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
    </div>
  );
}
