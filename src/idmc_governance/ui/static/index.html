            {activeStep === "recommend_rules" && recItems.length > 0 && statuses["recommend_rules"] !== STATUS.done && (() => {
              const palettes = [
                { color: "text-violet-600",  bg: "bg-violet-50" },
                { color: "text-indigo-600",  bg: "bg-indigo-50" },
                { color: "text-slate-700",   bg: "bg-slate-50" },
                { color: "text-emerald-600", bg: "bg-emerald-50" },
                { color: "text-amber-600",   bg: "bg-amber-50" },
              ];
              const recGroups = [...new Set(recItems.map(i => i.type))].map((t, i) => ({ type: t, label: t, ...palettes[i % palettes.length] }));
              return (
                <DomainApprovalPanel
                  items={recItems}
                  selected={recSelected}
                  onToggle={(name) => setRecSelected(prev => { const n = new Set(prev); if (n.has(name)) n.delete(name); else n.add(name); return n; })}
                  onToggleGroup={(names, add) => setRecSelected(prev => { const n = new Set(prev); names.forEach(x => add ? n.add(x) : n.delete(x)); return n; })}
                  onSelectAll={() => setRecSelected(new Set(recItems.map(i => i.name)))}
                  onDeselectAll={() => setRecSelected(new Set())}
                  onApprove={approveRecommendations}
                  onRename={(oldName, newName) => {
                    setRecItems(prev => prev.map(i => i.name === oldName ? { ...i, name: newName } : i));
                    setRecSelected(prev => { const s = new Set(prev); if (s.has(oldName)) { s.delete(oldName); s.add(newName); } return s; });
                  }}
                  approving={false}
                  groups={recGroups}
                  banner={{ title: "Review before pushing to step 8",
                            body: "Each row carries the profiling evidence behind it. Deselect what you don't want; rules authored below join the selection." }}
                  approveLabel="Approve & Push to Step 8"
                  busyLabel="Approving…"
                />
              );
            })()}

            {/* Gate 2 — Curate Columns: SAME panel, grouped by match confidence.
                Approving writes the selected links; deselected columns stay
                unlinked, never linked to a fallback term. */}
            {activeStep === "curate" && curMatches.length > 0 && statuses["curate"] !== STATUS.done && (() => {
              const palettes = {
                "High confidence":   { color: "text-emerald-600", bg: "bg-emerald-50" },
                "Medium confidence": { color: "text-amber-600",   bg: "bg-amber-50" },
                "Unscored":          { color: "text-slate-700",   bg: "bg-slate-50" },
              };
              const curGroups = ["High confidence", "Medium confidence", "Unscored"]
                .filter(t => curMatches.some(i => i.type === t))
                .map(t => ({ type: t, label: t, ...palettes[t] }));
              return (
                <DomainApprovalPanel
                  items={curMatches}
                  selected={curSelected}
                  onToggle={(name) => setCurSelected(prev => { const n = new Set(prev); if (n.has(name)) n.delete(name); else n.add(name); return n; })}
                  onToggleGroup={(names, add) => setCurSelected(prev => { const n = new Set(prev); names.forEach(x => add ? n.add(x) : n.delete(x)); return n; })}
                  onSelectAll={() => setCurSelected(new Set(curMatches.map(i => i.name)))}
                  onDeselectAll={() => setCurSelected(new Set())}
                  onApprove={approveCuration}
                  onRename={() => {}}
                  renamable={false}
                  approving={curApproving}
                  groups={curGroups}
                  banner={{ title: "Review column-to-term links before writing to CDGC",
                            body: "Grouped by match confidence. Deselected columns are left unlinked — never linked to a fallback term. Create a missing term with the glossary tools above without leaving this review." }}
                  approveLabel="Approve & Write Links"
                  busyLabel="Writing links…"
                />
              );
            })()}

            {/* Gates 4/5 — step 15: single-item confirmation before an
                authorisation decision (approve) or an irreversible one (withdraw) */}
            {/* Step 15 dual control — approvals submitted for a second approver.
                A requester cannot approve their own request, so the Approve action
                here is disabled; the confirmation itself is the modal opened above. */}
            {activeStep === "consumer_access" && (
              <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
                  <span className="text-sm font-semibold text-slate-600">Awaiting second approver</span>
                  <span className="text-xs bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-mono">{pending.length}</span>
                  <span className="ml-auto text-xs text-slate-400">A requester cannot approve their own request</span>
                </div>
                {pending.length === 0 ? (
                  <div className="p-4 text-xs text-slate-400">No requests awaiting a second approver.</div>
                ) : (
                  <table className="w-full text-sm"><tbody className="divide-y divide-slate-50">
                    {pending.map((pr, i) => (
                      <tr key={i}>
                        <td className="px-4 py-2.5 text-sm text-slate-700">{pr.title}</td>
                        <td className="px-4 py-2.5 font-mono text-xs text-slate-500">{pr.requester}</td>
                        <td className="px-4 py-2.5 font-mono text-xs text-slate-500">{pr.at}</td>
                        <td className="px-4 py-2.5"><span className="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded font-semibold">awaiting second approver</span></td>
                        <td className="px-4 py-2.5 text-right whitespace-nowrap">
                          <button disabled title="Requester cannot approve their own request"
                            className="text-xs px-2.5 py-1 rounded border border-slate-200 text-slate-300 cursor-not-allowed">Approve</button>
                          <button onClick={() => setPending(p => p.filter((_, j) => j !== i))}
                            className="text-xs px-2.5 py-1 rounded border border-slate-300 text-slate-600 ml-1 hover:border-red-300 hover:text-red-600">Withdraw</button>
                        </td>
                      </tr>
                    ))}
                  </tbody></table>
                )}
              </div>
            )}

            {/* Step 8: the approved step 7 selection is carried into this run */}
            {activeStep === "data_quality" && approvedRecs.length > 0 && (
              <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-xs text-indigo-700">
                ❋ <strong>{approvedRecs.length} evidence-backed recommendation{approvedRecs.length === 1 ? "" : "s"}</strong> approved at step 7 and carried into this run:
                <span className="font-mono"> {approvedRecs.slice(0, 5).map(r => r.name).join(", ")}{approvedRecs.length > 5 ? ` +${approvedRecs.length - 5} more` : ""}</span>
              </div>
            )}

            {/* Run individually — one row for every step, driven by the STEPS
                declaration. Substeps are labelled by TOOL name (the ladder table
                is authoritative). Muted entries belong to phases that have not
                landed; parent entries run via the step's own Run action. */}
            {(() => {
              const subs = active.substeps || [];
              // A lone parent-alias substep (steps 4, 13) would duplicate the Run button.
              if (!subs.length || (subs.length === 1 && subs[0].parent)) return null;
              const anyRunning = statuses[activeStep] === STATUS.running || Object.values(subRunning).some(Boolean);
              return (
                <div className="space-y-2">
                  <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">Run individually</div>
                <div className="flex flex-wrap gap-2">
                  {subs.map(ss => {
                    // Muted: owning phase has not landed (or executes inside another tool).
                    if (!ss.parent && !ss.route) {
                      return (
                        <span key={ss.tool} title={ss.note || "Next release"}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed select-none">
                          <span className="font-mono">{ss.tool}</span>
                          <span className="uppercase tracking-wider text-slate-300">soon</span>
                        </span>
                      );
                    }
                    // Parent alias: the step's Run action executes this tool.
                    if (ss.parent) {
                      const st = statuses[activeStep];
                      return (
                        <button key={ss.tool}
                          onClick={() => maybeConfirmRun(activeStep)}
                          disabled={anyRunning || active.stub}
                          title="Runs via this step's Run action"
                          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all shadow-sm
                            ${st === STATUS.running ? "bg-indigo-100 border-indigo-300 text-indigo-500 cursor-not-allowed"
                            : st === STATUS.error   ? "bg-red-100 border-red-400 text-red-700 hover:bg-red-200"
                            : st === STATUS.done    ? "bg-emerald-100 border-emerald-400 text-emerald-800 hover:bg-emerald-200"
                            :                         "bg-indigo-600 border-indigo-700 text-white hover:bg-indigo-500"}`}
                        >
                          {st === STATUS.running ? <Spinner/> : st === STATUS.done ? <span className="text-emerald-500">✓</span> : st === STATUS.error ? <span className="text-red-500">✗</span> : null}
                          <span className="font-mono">{ss.tool}</span>
                        </button>
                      );
                    }
                    // Own route.
                    const isRunning = subRunning[ss.key];
                    const res = active.substepsInParent ? results[activeStep]?.[ss.key] : (subResults[activeStep] || {})[ss.key];
                    const failed = res && (res.error || (res.status || "").includes("failed"));
                    const ok = res && !failed;
                    const needsForm = formIncomplete(ss);
                    return (
                      <button
                        key={ss.tool}
                        onClick={() => ss.gated ? openAccessConfirm(ss) : runSubAction(active, ss)}
                        disabled={anyRunning || needsForm}
                        title={needsForm ? "Fill this tool's inputs above first" : (ss.gated ? "Opens a confirmation gate" : undefined)}
                        className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all shadow-sm
                          ${isRunning || needsForm ? "bg-indigo-100 border-indigo-300 text-indigo-500 cursor-not-allowed"
                          : failed    ? "bg-red-100 border-red-400 text-red-700 hover:bg-red-200"
                          : ok        ? "bg-emerald-100 border-emerald-400 text-emerald-800 hover:bg-emerald-200"
                          :             "bg-indigo-600 border-indigo-700 text-white hover:bg-indigo-500"}`}
                      >
                        {isRunning ? <Spinner/> : ok ? <span className="text-emerald-500">✓</span> : failed ? <span className="text-red-500">✗</span> : null}
                        {ss.label
                          ? <span>{ss.label} <span className="font-mono font-normal opacity-70 text-[10px]">{ss.tool}</span></span>
                          : <span className="font-mono">{ss.tool}</span>}
                      </button>
                    );
                  })}
                </div>
                </div>
              );
            })()}

            {/* Run / Stop / Skip buttons — suppressed for stub steps and open gates */}
            {!active.stub
              && !(activeStep === "domain_structure" && domainItems.length > 0 && statuses["domain_structure"] !== STATUS.done)
              && !(activeStep === "recommend_rules" && recItems.length > 0 && statuses["recommend_rules"] !== STATUS.done)
              && !(activeStep === "curate" && curMatches.length > 0 && statuses["curate"] !== STATUS.done) && (
            <div className="flex items-center gap-3">
              <button
                onClick={() => maybeConfirmRun(activeStep)}
                disabled={statuses[activeStep] === STATUS.running || !canRun}
                className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm transition-all
                  ${statuses[activeStep] === STATUS.running || !canRun
                    ? "bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200"
                    : "bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow-md shadow-indigo-200 hover:shadow-indigo-300"}`}
              >
                {statuses[activeStep] === STATUS.running ? (
                  <><Spinner/> Running…</>
                ) : statuses[activeStep] === STATUS.done ? (
                  <><span className="text-emerald-300">✓</span> Re-run Step</>
                ) : (
                  <><span>▶</span> Run Step</>
                )}
              </button>

              {activeStep === "domain_structure" && !taxonomyReady && (
                <span className="text-xs text-amber-600 font-medium">
                  Run <strong>Generate Taxonomy</strong> (Step 4) for this table first.
                </span>
              )}
              {(activeStep === "taxonomy" || activeStep === "recommend_rules") && !profileReady && (
                <span className="text-xs text-amber-600 font-medium">
                  Run <strong>Profile Data</strong> (step 3) first — this step reads its stored profile.{" "}
                  <button onClick={() => setActiveStep("profile")} className="underline text-brand">Go to step 3</button>
                </span>
              )}

              {statuses[activeStep] === STATUS.running && (
                <button
                  onClick={() => stopStep(activeStep)}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-semibold text-red-600 border border-red-200 bg-red-50 hover:bg-red-100 hover:border-red-300 transition-all"
                >
                  <span>■</span> Stop
                </button>
              )}

              {SKIPPABLE.has(activeStep) && statuses[activeStep] !== STATUS.running && (
                <button
                  onClick={() => skipStep(activeStep)}
                  className="flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm text-slate-600 border border-slate-300 bg-slate-50 hover:border-slate-400 hover:text-slate-800 shadow-sm transition-all"
                >
                  Skip
                </button>
              )}
            </div>
            )}

            {/* Error */}
            {errors[activeStep] && (
              <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                <div className="text-xs font-semibold text-red-600 mb-1 uppercase tracking-wider">Error</div>
                <div className="text-sm text-red-700 font-mono">{errors[activeStep]}</div>
              </div>
            )}

            {/* Skipped notice */}
            {statuses[activeStep] === STATUS.skipped && (() => {
              const idx = STEPS.findIndex(s => s.id === activeStep);
              const next = STEPS[idx + 1];
              return (
                <div className="space-y-3">
                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm flex items-center gap-3">
                    <span className="text-slate-400 text-lg">⊘</span>
                    <div>
                      <div className="text-sm font-semibold text-slate-600">Step skipped</div>
                      <div className="text-xs text-slate-400">This step was skipped for this demo run.</div>
                    </div>
                  </div>
                  {next && (
                    <div className="flex justify-end pt-1">
                      <button
                        onClick={() => setActiveStep(next.id)}
                        className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-50 border border-slate-300 text-slate-600 hover:border-brand hover:text-brand shadow-sm transition-all"
                      >
                        Next: {next.label} <span>→</span>
                      </button>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Results */}
            {results[activeStep]
              && !(activeStep === "domain_structure" && domainItems.length > 0 && statuses["domain_structure"] !== STATUS.done)
              && !(activeStep === "recommend_rules" && recItems.length > 0 && statuses["recommend_rules"] !== STATUS.done)
              && !(activeStep === "curate" && curMatches.length > 0 && statuses["curate"] !== STATUS.done) && (
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Result</div>
                  <button
                    onClick={() => setShowJson(prev => ({ ...prev, [activeStep]: !prev[activeStep] }))}
                    className="text-xs text-slate-400 hover:text-brand font-medium"
                  >
                    {showJson[activeStep] ? "Show summary" : "Show raw JSON"}
                  </button>
                </div>

                {/* Next button (top) */}
                {(statuses[activeStep] === STATUS.done || statuses[activeStep] === STATUS.skipped) && (() => {
                  const idx = STEPS.findIndex(s => s.id === activeStep);
                  const next = STEPS[idx + 1];
                  if (!next) return null;
                  return (
                    <div className="flex justify-end">
                      <button
                        onClick={() => setActiveStep(next.id)}
                        className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-50 border border-slate-300 text-slate-600 hover:border-brand hover:text-brand shadow-sm transition-all"
                      >
                        Next: {next.label} <span>→</span>
                      </button>
                    </div>
                  );
                })()}

                <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm">
                  {showJson[activeStep]
                    ? <JsonViewer data={results[activeStep]}/>
                    : <ResultComponent data={results[activeStep]} domainItems={domainItems} domainSelected={domainSelected} scanSource={scanSource} scanSchema={scanSchema} scanTable={scanTable} profileObject={profileObject}
                        onSelectSchema={(source, schema) => {
                          // Discover's schema Select → set step 2's dropdowns and jump there.
                          setScanSource(source);
                          setScanSchema(schema);
                          setScanTable("__ALL__");
                          setActiveStep("scan");
                        }}
                        onGoToStep={(id) => setActiveStep(id)}/>
                  }
                </div>

                {/* Next button (bottom) */}
                {(statuses[activeStep] === STATUS.done || statuses[activeStep] === STATUS.skipped) && (() => {
                  const idx = STEPS.findIndex(s => s.id === activeStep);
                  const next = STEPS[idx + 1];
                  if (!next) return null;
                  return (
                    <div className="flex justify-end pt-1">
                      <button
                        onClick={() => setActiveStep(next.id)}
                        className="flex items-center gap-2 px-5 py-2.5 rounded-lg font-semibold text-sm bg-slate-50 border border-slate-300 text-slate-600 hover:border-brand hover:text-brand shadow-sm transition-all"
                      >
                        Next: {next.label} <span>→</span>
                      </button>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* Step 2: Lineage (left) + Impact (right), side by side beneath the
                column metadata table. Layout per the mock; built from index.html
                components + theme. The other step-2 substep (find_data_source)
                still renders in the generic panel list below. */}
            {activeStep === "scan"
              && ((subResults.scan || {}).trace_lineage !== undefined || (subResults.scan || {}).generate_impact_report !== undefined) && (
              <div className="grid grid-cols-2 gap-4 items-start">
                {[["trace_lineage", "Lineage"], ["generate_impact_report", "Impact if this changes"]].map(([key, label]) => {
                  const data = (subResults.scan || {})[key];
                  const R = SUB_RENDERERS[key];
                  return (
                    <div key={key} className="space-y-2">
                      <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{label}</div>
                      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm">
                        {data === undefined ? (
                          <div className="text-xs text-slate-400 italic">Run <span className="font-mono">{key}</span> above to populate.</div>
                        ) : data?.error ? (
                          /no asset|not found|no results/i.test(String(data.error)) ? (
                            <div className="bg-slate-100 border border-slate-300 rounded-lg p-3 text-xs text-slate-600 space-y-1">
                              <div><strong>Asset not found in catalog.</strong> Name-to-identity resolution returned nothing — the asset may not be cataloged yet, or the name differs. Use the exact name shown in Discover.</div>
                              <div className="text-slate-400 font-mono">{String(data.error).slice(0, 160)}</div>
                            </div>
                          ) : (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{data.error}</pre></div>
                          )
                        ) : (R ? <R data={data}/> : <JsonViewer data={data}/>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Substep results — steps whose parent result is not a substep map
                render each tool's output in its own panel */}
            {Object.keys(subResults[activeStep] || {}).length > 0 && (
              <div className="space-y-3">
                {(active.substeps || []).filter(ss => (subResults[activeStep] || {})[ss.key] !== undefined
                    && !(activeStep === "scan" && (ss.key === "trace_lineage" || ss.key === "generate_impact_report"))).map(ss => {
                  const data = subResults[activeStep][ss.key];
                  const R = SUB_RENDERERS[ss.key];
                  return (
                    <div key={ss.key} className="space-y-2">
                      <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider font-mono">{ss.tool}</div>
                      <div className="bg-slate-50 rounded-xl p-4 border border-slate-300 shadow-sm">
                        {data?.error ? (
                          /no asset|not found|no results/i.test(String(data.error)) ? (
                            // Requirement 4: resolution returning nothing says "not found
                            // in catalog", not "no results".
                            <div className="bg-slate-100 border border-slate-300 rounded-lg p-3 text-xs text-slate-600 space-y-1">
                              <div><strong>Asset not found in catalog.</strong> Name-to-identity resolution returned nothing —
                              the asset may not be cataloged yet, or the name differs from the catalog entry.
                              Use the exact name shown in Discover.</div>
                              <div className="text-slate-400 font-mono">{String(data.error).slice(0, 180)}</div>
                            </div>
                          ) : (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-3"><pre className="text-xs text-red-700 whitespace-pre-wrap">{data.error}</pre></div>
                          )
                        ) : (R ? <R data={data}/> : <JsonViewer data={data}/>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

          </div>
        </main>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
