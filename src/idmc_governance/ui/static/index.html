// ── Helpers ───────────────────────────────────────────────────────────────────
const STATUS = { idle: "idle", running: "running", done: "done", error: "error", skipped: "skipped" };
const SKIPPABLE = new Set(["taxonomy", "domain_structure", "curate", "data_quality", "publish_governance", "create_collection", "publish_marketplace", "configure_delivery", "consumer_access"]);

// Cross-cutting requirement 1: one shared interceptor. 401, or 403 carrying
// REPO_38205 (and kin), means the IDMC session died — the most likely demo
// failure. Every screen surfaces the same reconnect affordance instead of a
// raw error. (403 alone is NOT expiry — REPO_36004 template errors are 403s.)
let notifySessionExpired = null;
const SESSION_EXPIRY_RE = /REPO_38205|UnknownSigner|Unauthorized|session (has )?expired|invalid session/i;

async function apiPost(path, body = {}, signal = undefined) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal,
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    const msg = typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail || r.statusText);
    if ((r.status === 401 || SESSION_EXPIRY_RE.test(msg)) && notifySessionExpired) notifySessionExpired(msg);
    const e = new Error(msg);
    e.status = r.status;
    throw e;
  }
  return r.json();
}

// Requirement 7: composite status derives from per-tool outcomes, never from
// the HTTP call completing. A step whose four tools all failed must not read
// green — the dot is what a steward scans; the rows are what they read
// afterwards, if the dot gives them a reason to.
function toolOutcomeFailed(r) {
  if (!r) return false;   // tool not attempted (e.g. only some substeps run individually)
  const st = String(r.status || "").toLowerCase();
  return !!r.error || st === "failed" || st === "not_found";
}

function compositeFailure(stepDef, data) {
  const keys = (stepDef?.substeps || []).map(ss => ss.key);
  const failed = keys.filter(k => toolOutcomeFailed(data?.[k]));
  if (!failed.length) return null;
  return `${failed.length} of ${keys.length} tools failed: ${failed.join(", ")} — the rows below carry the detail`;
}

const INPUT_CLS = "w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand focus:ring-2 focus:ring-indigo-100";

// ── Sub-components ────────────────────────────────────────────────────────────

function StatusDot({ status }) {
  if (status === STATUS.idle)    return <span className="w-2 h-2 rounded-full bg-slate-300 inline-block"/>;
  if (status === STATUS.running) return <span className="w-2 h-2 rounded-full bg-violet-500 inline-block pulse"/>;
  if (status === STATUS.done)    return <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"/>;
  if (status === STATUS.skipped) return <span className="w-2 h-2 rounded-full bg-amber-400 inline-block" title="Skipped"/>;
  if (status === STATUS.error)   return <span className="w-2 h-2 rounded-full bg-red-500 inline-block"/>;
}

function Spinner() {
  return (
    <svg className="spin w-4 h-4 text-brand" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeOpacity="0.2"/>
      <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
    </svg>
  );
}

function JsonViewer({ data, maxHeight = "320px" }) {
  const [expanded, setExpanded] = useState(false);
  const text = JSON.stringify(data, null, 2);
  return (
    <div className="rounded-lg bg-slate-800 border border-slate-700 overflow-hidden">
      <div className="flex items-center justify-between px-3 py-1.5 border-b border-slate-700 bg-slate-900">
        <span className="text-xs text-slate-400 font-mono">JSON</span>
        <button onClick={() => setExpanded(e => !e)} className="text-xs text-slate-400 hover:text-violet-400">
          {expanded ? "Collapse" : "Expand"}
        </button>
      </div>
      <div className="overflow-auto scrollbar-thin" style={{ maxHeight: expanded ? "none" : maxHeight }}>
        <pre className="p-3 text-xs text-slate-300 font-mono">{text}</pre>
      </div>
    </div>
  );
}

function SummaryCard({ label, value, color = "text-brand" }) {
  return (
    <div className="bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 flex flex-col gap-0.5 shadow-sm overflow-hidden">
      <span className={`text-lg font-bold truncate ${color}`} title={typeof value === 'string' ? value : undefined}>{value}</span>
      <span className="text-xs text-slate-400 uppercase tracking-wider font-medium">{label}</span>
    </div>
  );
}

// ── Step result renderers ─────────────────────────────────────────────────────

function SchemaTableList({ tables }) {
  const PREVIEW = 12;
  const [expanded, setExpanded] = React.useState(false);
  const shown = expanded ? tables : tables.slice(0, PREVIEW);
  return (
    <div className="flex flex-wrap gap-1 mt-1.5">
      {shown.map(t => (
        <span key={t.name} className="text-xs bg-white border border-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-mono max-w-[220px] truncate inline-block" title={t.name}>{t.name}</span>
      ))}
      {!expanded && tables.length > PREVIEW && (
        <button onClick={() => setExpanded(true)}
          className="text-xs bg-indigo-50 border border-indigo-200 text-indigo-600 px-2 py-0.5 rounded hover:bg-indigo-100 cursor-pointer font-medium">
          +{tables.length - PREVIEW} more
        </button>
      )}
      {expanded && tables.length > PREVIEW && (
        <button onClick={() => setExpanded(false)}
          className="text-xs bg-slate-100 border border-slate-200 text-slate-500 px-2 py-0.5 rounded hover:bg-slate-200 cursor-pointer">
          show less
        </button>
      )}
    </div>
  );
}

// Short "Jul 17, 2026" from an ISO timestamp; blank on anything unparseable.
function fmtScanned(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function DiscoverResult({ data, onSelectSchema }) {
  const catalogSources  = data?.result?.catalog_sources_grouped || [];
  const total           = data?.result?.total_tables || 0;
  // Invert: an `open` map defaulting empty means everything COLLAPSED. Sources
  // render closed; expanding a source reveals its schemas closed; expanding a
  // schema reveals its tables. (Was `collapsed` with isOpen = !collapsed[k],
  // so an empty map opened the whole 6,000-table tree on load.)
  const [open, setOpen] = React.useState({});
  const toggle = (key) => setOpen(prev => ({ ...prev, [key]: !prev[key] }));

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <SummaryCard label="Catalog Sources" value={catalogSources.length}/>
        <SummaryCard label="Total Tables"    value={total.toLocaleString()}/>
      </div>
      {catalogSources.map(cs => {
        const csKey  = cs.source;
        const isOpen = !!open[csKey];
        const schemaCount = (cs.schemas || []).length;
        const scanned = fmtScanned(cs.last_scanned);
        return (
          <div key={csKey} className="bg-white border border-indigo-200 rounded-xl overflow-hidden shadow-sm">
            {/* Level 1 — Catalog Source */}
            <button onClick={() => toggle(csKey)}
              className="w-full bg-indigo-600 text-white px-4 py-2.5 flex items-center justify-between hover:bg-indigo-700 transition-colors">
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold tracking-wide">{cs.source}</span>
              </div>
              <div className="flex items-center gap-3 text-indigo-200 text-xs">
                <span>{cs.total_tables?.toLocaleString()} tables · {schemaCount} schema{schemaCount !== 1 ? "s" : ""} · {scanned ? <>scanned {scanned}</> : <span className="text-amber-300 font-semibold">never scanned</span>}</span>
                <span className="text-lg leading-none">{isOpen ? "▾" : "▸"}</span>
              </div>
            </button>

            {isOpen && (cs.databases || [{ database: "", schemas: cs.schemas || [] }]).map(db => {
              const dbKey   = csKey + "/" + db.database;
              const dbOpen  = !!open[dbKey];
              const showDb  = db.database && db.database !== cs.source;
              return (
                <div key={dbKey}>
                  {/* Level 2 — Database (only shown when it differs from source name) */}
                  {showDb && (
                    <button onClick={() => toggle(dbKey)}
                      className="w-full bg-indigo-50 border-b border-indigo-100 px-4 py-1.5 flex items-center justify-between hover:bg-indigo-100 transition-colors">
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-indigo-400 font-medium uppercase tracking-wider">Database</span>
                        <span className="text-xs font-mono font-semibold text-indigo-700">{db.database}</span>
                      </div>
                      <span className="text-indigo-400 text-sm">{dbOpen ? "▾" : "▸"}</span>
                    </button>
                  )}

                  {(!showDb || dbOpen) && (
                    <div className="p-3 space-y-2">
                      {(db.schemas || []).map(s => {
                        const sKey  = dbKey + "/" + s.schema;
                        const sOpen = !!open[sKey];
                        return (
                          <div key={sKey} className="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
                            {/* Level 3 — Schema (toggle + Select action) */}
                            <div className="w-full px-2.5 py-1.5 flex items-center justify-between hover:bg-slate-100 transition-colors">
                              <button onClick={() => toggle(sKey)} className="flex items-center gap-1.5 flex-1 text-left">
                                <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>
                                <span className="text-xs font-semibold text-slate-700">{s.schema}</span>
                                <span className="text-xs text-slate-400">({s.tables.length})</span>
                              </button>
                              <div className="flex items-center gap-2 shrink-0">
                                {onSelectSchema && (
                                  <button
                                    onClick={(e) => { e.stopPropagation(); onSelectSchema(cs.source, s.schema); }}
                                    className="text-xs px-2 py-0.5 rounded border border-indigo-300 bg-white text-indigo-600 font-medium hover:bg-indigo-50 transition-colors"
                                    title="Scan this schema — sets it on step 2 and jumps there"
                                  >Select →</button>
                                )}
                                <button onClick={() => toggle(sKey)} className="text-slate-400 text-xs">{sOpen ? "▾" : "▸"}</button>
                              </div>
                            </div>
                            {/* Level 4 — Tables */}
                            {sOpen && (
                              <div className="px-2.5 pb-2.5">
                                <SchemaTableList tables={s.tables} />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function ScanResult({ data, scanSource, scanSchema }) {
  const cols = data?.columns?.[0];
  const scan = data?.scan?.result;
  if (!cols && !scan) return <JsonViewer data={data}/>;
  if (!cols) {
    const missing    = scan?.missing || [];
    const foundCount = scan?.found_count ?? 0;
    return (
      <div className="space-y-4">
        <div className="grid grid-cols-3 gap-3">
          <SummaryCard label="Found"   value={foundCount}       color="text-slate-500"/>
          <SummaryCard label="Missing" value={missing.length}   color="text-red-500"/>
          <SummaryCard label="Status"  value="Not Found"        color="text-red-500"/>
        </div>
        {missing.length > 0 && (
          <div className="bg-red-50 border border-red-200 rounded-lg p-3">
            <div className="text-xs text-red-500 font-medium mb-2 uppercase tracking-wider">Tables not found in catalog</div>
            <div className="flex flex-wrap gap-1.5">
              {missing.map(m => (
                <span key={m} className="text-xs bg-white border border-red-200 text-red-600 px-2 py-0.5 rounded font-mono">{m}</span>
              ))}
            </div>
            <p className="text-xs text-red-400 mt-2">Table may not be catalogued yet. Try scanning the MCC source first or select a different table.</p>
          </div>
        )}
      </div>
    );
  }

  const columnsList   = data?.columns?.filter(Boolean) || [cols];
  const scanned       = data?.tables_scanned  ?? columnsList.length;
  const totalInSchema = data?.total_in_schema ?? 0;
  const elapsed       = data?.elapsed_seconds ?? 0;
  const estMin        = data?.estimated_full_minutes ?? 0;

  const estLabel = estMin >= 60
    ? `~${(estMin / 60).toFixed(1)} hr`
    : estMin > 0 ? `~${estMin} min` : null;

  // Map column results to scan table metadata (schema/connection per table)
  const scanTables = scan?.tables || [];

  return (
    <div className="space-y-4">
      {/* Summary banner */}
      <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
        <span>Scanned <strong>{scanned}</strong> {scanned === 1 ? "table" : "tables"}{totalInSchema > scanned ? ` of ${totalInSchema.toLocaleString()}` : ""} in <span className="font-mono">{scanSchema === "__ALL_SCHEMAS__" ? "all schemas" : (scanSchema || "schema")}</span> — <strong>{elapsed}s</strong></span>
        {estLabel && totalInSchema > scanned && (
          <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">
            {scanSchema === "__ALL_SCHEMAS__" ? "All schemas" : "Full schema"}: {estLabel} ({totalInSchema.toLocaleString()} tables)
          </span>
        )}
      </div>

      {/* Catalog Source header */}
      {(scanSource || scanSchema) && (
        <div className="border border-indigo-200 rounded-xl overflow-hidden">
          {/* Level 1 — Catalog Source */}
          <div className="bg-indigo-600 text-white px-4 py-2 flex items-center justify-between">
            <span className="text-sm font-semibold tracking-wide">{scanSource || scanSchema}</span>
            <span className="text-indigo-200 text-xs">{scanned} tables scanned</span>
          </div>

          {/* Level 2 — Schema */}
          <div className="bg-indigo-50 border-b border-indigo-100 px-4 py-2 flex items-center gap-2">
            <span className="text-xs text-indigo-400 font-medium uppercase tracking-wider">Schema</span>
            <span className="text-xs font-mono font-semibold text-indigo-700">{scanSchema || scanTables[0]?.schema || "—"}</span>
          </div>

          {/* Level 3+4 — Tables with columns */}
          <div className="divide-y divide-slate-200">
            {columnsList.map((c, i) => {
              const tblMeta = scanTables[i] || {};
              return (
                <div key={i} className="px-4 py-3 space-y-2">
                  {/* Level 3 — Table */}
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-slate-400 font-medium">TABLE</span>
                      <span className="text-sm font-mono font-bold text-slate-800">{c.table || tblMeta.name || "—"}</span>
                    </div>
                    <span className="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">{c.column_count} columns</span>
                  </div>
                  {/* Column metadata — COLUMN · TYPE · NULLABLE · DESCRIPTION.
                      TYPE is forwarded from the scan tool (columns_detail); NULLABLE
                      and DESCRIPTION are not in the scan output at all and render
                      muted (— / none), not synthesised. Falls back to names-only for
                      results cached before columns_detail existed. */}
                  {(() => {
                    const detail = (c.columns_detail && c.columns_detail.length)
                      ? c.columns_detail
                      : (c.columns_preview || []).map(n => ({ name: n, data_type: "" }));
                    if (!detail.length) return null;
                    return (
                      <div className="border border-slate-200 rounded-lg overflow-x-auto">
                        <table className="w-full text-sm">
                          <thead>
                            <tr className="text-[10px] uppercase tracking-wider text-slate-400 border-b border-slate-100 bg-slate-50">
                              <th className="text-left px-3 py-1.5 font-semibold">Column</th>
                              <th className="text-left px-3 py-1.5 font-semibold">Type</th>
                              <th className="text-left px-3 py-1.5 font-semibold">Nullable</th>
                              <th className="text-left px-3 py-1.5 font-semibold">Description</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-50">
                            {detail.map((col, ci) => (
                              <tr key={ci}>
                                <td className="px-3 py-1.5 font-mono text-xs text-slate-700">{col.name}</td>
                                <td className="px-3 py-1.5 font-mono text-xs text-slate-500">{col.data_type ? col.data_type : <span className="text-slate-300">—</span>}</td>
                                <td className="px-3 py-1.5 text-xs text-slate-300">—</td>
                                <td className="px-3 py-1.5 text-xs text-slate-300">none</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    );
                  })()}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// Shared full-schema time-estimate banner (steps 2-6), styled like the Scan banner.
function EstimateBanner({ data }) {
  const elapsed = data?.elapsed_seconds ?? 0;
  const sample  = data?.sample_tables ?? 0;
  const total   = data?.total_in_schema ?? 0;
  const estMin  = data?.estimated_full_minutes ?? 0;
  const fixed   = data?.fixed_cost === true;
  if (!elapsed) return null;
  // Hide the banner when there's no real per-table count to show (avoids a
  // misleading "Processed 0 tables"). Fixed-cost steps render without a count.
  if (!fixed && sample <= 0) return null;
  const estLabel = estMin >= 60 ? `~${(estMin / 60).toFixed(1)} hr` : estMin > 0 ? `~${estMin} min` : null;
  // Fixed-cost step (e.g. Domain Structure): one-time write, does not scale with tables.
  if (fixed) {
    return (
      <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
        <span>Completed in <strong>{elapsed}s</strong></span>
        <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">One-time step — does not scale with table count</span>
      </div>
    );
  }
  return (
    <div className="bg-green-50 border border-green-200 rounded-lg px-4 py-2 text-sm text-green-700 font-medium flex flex-wrap items-center gap-2">
      <span>Processed <strong>{sample}</strong> {sample === 1 ? "table" : "tables"}{total > sample ? ` of ${total.toLocaleString()}` : ""} — <strong>{elapsed}s</strong></span>
      {estLabel && total > sample && (
        <span className="text-green-600 text-xs bg-green-100 px-2 py-0.5 rounded">Full schema: {estLabel} ({total.toLocaleString()} tables)</span>
      )}
    </div>
  );
}

function TaxonomyResult({ data, onGoToStep }) {

  const grounded = domains.some(d => (d.subdomains || []).some(sd => (sd.business_terms || []).some(bt => bt.evidence)));
  return (
    <div className="space-y-3">
      <EstimateBanner data={data} />
      {/* Proposed taxonomy card */}
      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">

          <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Proposed taxonomy</span>
          {grounded && <span className="text-xs bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">PROFILE INFORMED</span>}
          <span className="ml-auto text-xs text-slate-400">{s.domain_count || domains.length} domains · {s.subdomain_count || "—"} subdomains · {s.term_count || "—"} terms</span>
        </div>
        <div className="p-4 space-y-3">
          {domains.map(d => (
            <div key={d.name} className="space-y-1.5">
              <div className="flex items-center gap-2">
                <span className="text-sm font-bold text-slate-800">{d.name}</span>
                <span className="text-xs bg-violet-100 text-violet-700 px-1.5 py-0.5 rounded font-bold tracking-wide">DOMAIN</span>
              </div>
              {(d.subdomains || []).map(sd => (
                <div key={sd.name} className="ml-4 space-y-0.5">
                  <div className="text-xs font-semibold text-slate-600">{sd.name}</div>
                  <div className="ml-4 space-y-0.5">
                    {(sd.business_terms || []).map(bt => (
                      <div key={bt.name} className="text-xs text-slate-500 leading-relaxed">
                        {bt.name}
                        {/* The Opella argument on screen: evidence inline, in indigo */}
                        {bt.evidence && <span className="text-indigo-600"> ← {bt.evidence}</span>}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ))}

      </div>
      {/* Footer — nothing written yet; the next step is the gate */}
      <div className="bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 flex items-center justify-between gap-3">
        <span className="text-xs text-slate-500">Nothing written to the catalog yet. The next step is where you choose.</span>
        {onGoToStep && (
          <button onClick={() => onGoToStep("domain_structure")}
            className="shrink-0 text-xs px-3 py-1.5 rounded-lg border border-indigo-300 bg-white text-indigo-600 font-semibold hover:bg-indigo-50 transition-colors">
            Review and select →
          </button>
        )}
      </div>
    </div>
  );
}

function DomainStructureResult({ data, domainItems, domainSelected }) {
  const [showSelection, setShowSelection] = React.useState(false);
  // handle both wrapped {result: {...}} and direct {created, skipped, ...} formats
  const r = (data?.result && !data.result.awaiting_approval) ? data.result : (data || {});
  // An error result (e.g. "No taxonomy in state") has no created/skipped/errors —
  // surface it instead of rendering a misleading 0/0/0 summary.
  const errMsg = data?.error || data?.result?.error || r.error;
  if (errMsg) {
    return (
      <div className="bg-red-50 border border-red-200 rounded-lg p-4">
        <div className="text-xs text-red-600 font-medium mb-1 uppercase tracking-wider">Step failed — nothing written to CDGC</div>
        <div className="text-sm text-red-700 font-mono">{errMsg}</div>
      </div>
    );
  }
  const s = r.summary || {};
  const created = r.created || [];
  const skipped = r.skipped || [];
  const errors  = r.errors  || [];

  const groups = [
    { type: "Domain",       label: "Domains",       color: "text-violet-600", bg: "bg-violet-50" },
    { type: "SubDomain",    label: "Sub-Domains",    color: "text-indigo-600", bg: "bg-indigo-50" },
    { type: "BusinessTerm", label: "Business Terms", color: "text-slate-700",  bg: "bg-slate-50"  },
  ];

  return (
    <div className="space-y-4">
      <EstimateBanner data={data} />
      <div className="grid grid-cols-3 gap-3">
        <SummaryCard label="Created" value={s.created_count ?? created.length} color="text-emerald-600"/>
        <SummaryCard label="Skipped" value={s.skipped_count ?? skipped.length} color="text-amber-600"/>
        <SummaryCard label="Errors"  value={s.error_count ?? errors.length} color={(s.error_count || errors.length) ? "text-red-600" : "text-slate-400"}/>
      </div>
      {created.length > 0 && (
        <div className="bg-slate-100 border border-slate-300 rounded-lg p-3">
          <div className="text-xs text-slate-400 font-medium mb-2 uppercase tracking-wider">Newly created</div>
          <div className="space-y-1">
            {created.map((c, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="text-emerald-500">✓</span>
                <span className="text-slate-400 w-24">{c.type}</span>
                <span className="text-slate-700 font-medium">{c.name}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {skipped.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
          <div className="text-xs text-amber-600 font-medium mb-2 uppercase tracking-wider">Already existed (skipped)</div>
          <div className="space-y-1">
            {skipped.map((c, i) => {
              const moved   = c.reason && c.reason.includes("moved under");
              const reFailed = c.reason && c.reason.includes("re-parent failed");
              return (
                <div key={i} className="flex items-start gap-2 text-xs">
                  <span className={moved ? "text-emerald-500 mt-0.5" : reFailed ? "text-red-400 mt-0.5" : "text-amber-400 mt-0.5"}>
                    {moved ? "↪" : reFailed ? "!" : "⊘"}
                  </span>
                  <span className="text-slate-400 w-24 shrink-0">{c.type}</span>
                  <div className="flex flex-col">
                    <span className="text-slate-700 font-medium">{c.name}</span>
                    {c.reason && <span className={`text-xs mt-0.5 ${moved ? "text-emerald-500" : reFailed ? "text-red-400" : "text-amber-400"}`}>{c.reason}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {errors.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-lg p-3">
          <div className="text-xs text-red-600 font-medium mb-2 uppercase tracking-wider">Errors</div>
          <div className="space-y-1">
            {errors.map((e, i) => (
              <div key={i} className="text-xs">
                <span className="text-red-500 font-medium">{e.type}: {e.name}</span>
                <span className="text-red-400 ml-2">— {e.error}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Collapsible view of what was approved */}
      {domainItems && domainItems.length > 0 && (
        <div className="border border-slate-200 rounded-xl overflow-hidden">
          <button
            onClick={() => setShowSelection(o => !o)}
            className="w-full flex items-center justify-between px-4 py-2.5 bg-slate-50 hover:bg-slate-100 transition-colors text-sm font-medium text-slate-600"
          >
            <span>View approved selection ({domainSelected ? domainSelected.size : 0} items)</span>
            <span className="text-slate-400">{showSelection ? "▲" : "▼"}</span>
          </button>
          {showSelection && (
            <div className="p-4 space-y-3 bg-white">
              {groups.map(g => {
                const groupItems = domainItems.filter(i => i.type === g.type);
                if (!groupItems.length) return null;
                return (
                  <div key={g.type}>
                    <div className={`text-xs font-bold uppercase tracking-wider ${g.color} mb-1.5`}>{g.label}</div>
                    <div className="divide-y divide-slate-100 border border-slate-200 rounded-lg overflow-hidden">
                      {groupItems.map(item => {
                        const isSelected = domainSelected && domainSelected.has(item.name);
                        return (
                          <div key={item.name} className={`flex items-center gap-3 px-3 py-2 text-sm ${isSelected ? "bg-white" : "bg-slate-50 opacity-50"}`}>
                            <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 ${isSelected ? "bg-violet-600 border-violet-600 text-white" : "border-slate-300"}`}>
                              {isSelected && <span className="text-xs leading-none">✓</span>}
                            </span>
                            <span className={`font-medium ${isSelected ? "text-slate-700" : "text-slate-400"}`}>{item.name}</span>
                            {item.parent && <span className="text-xs bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded">{item.parent}</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* Source System & Dataset — registered alongside domain structure */}
      {data?.system_dataset && (() => {
        const sd = data.system_dataset?.result || data.system_dataset || {};
        const sys = sd.system || {};
        const ds  = sd.dataset || {};
        const de  = sd.data_elements || {};
        const linked  = de.linked?.length  ?? 0;
        const errored = de.errors?.length   ?? 0;
        return (
          <div className="border border-slate-200 rounded-xl overflow-hidden">
            <div className="flex items-center gap-2 px-4 py-2.5 bg-teal-50 border-b border-slate-200">
              <span className="text-teal-600 font-bold text-xs uppercase tracking-wider">Source System &amp; Dataset</span>
            </div>
            <div className="p-4 space-y-3 bg-white">
              {/* System row */}
              <div className="flex items-start gap-3">
                <span className="text-xs text-slate-400 w-20 shrink-0 pt-0.5 font-medium">System</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold text-slate-800">{sys.name || "—"}</div>
                  {sys.id && <div className="text-xs font-mono text-slate-400 truncate">{sys.id}</div>}
                  {sys.status && <span className={`inline-block text-xs px-1.5 py-0.5 rounded mt-0.5 font-medium ${sys.status.includes("created") ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{sys.status}</span>}
                </div>
              </div>
              {/* Dataset row */}
              <div className="flex items-start gap-3">
                <span className="text-xs text-slate-400 w-20 shrink-0 pt-0.5 font-medium">Dataset</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold text-slate-800">{ds.name || "—"}</div>
                  {ds.id && <div className="text-xs font-mono text-slate-400 truncate">{ds.id}</div>}
                  {ds.status && <span className={`inline-block text-xs px-1.5 py-0.5 rounded mt-0.5 font-medium ${ds.status.includes("created") ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}`}>{ds.status}</span>}
                </div>
              </div>
              {/* Columns */}
              <div className="flex items-center gap-4 pt-1 border-t border-slate-100">
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 inline-block"/>
                  <span className="text-xs text-slate-500">{linked} columns linked</span>
                </div>
                {errored > 0 && (
                  <div className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-red-400 inline-block"/>
                    <span className="text-xs text-red-500">{errored} errors</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// The reference implementation for EVERY gate — reused with different grouping
// and row content via props, never rebuilt. A second approval component
// anywhere in this codebase is a defect.
function DomainApprovalPanel({ items, selected, onToggle, onToggleGroup, onSelectAll, onDeselectAll, onApprove, onRename, approving,
                               groups: groupsProp, banner, approveLabel, busyLabel, tone, renamable = true }) {
  const groups = groupsProp || [
    { type: "Domain",       label: "Domains",          color: "text-violet-600",  bg: "bg-violet-50",  border: "border-violet-200" },
    { type: "SubDomain",    label: "Sub-Domains",       color: "text-indigo-600",  bg: "bg-indigo-50",  border: "border-indigo-200" },
    { type: "BusinessTerm", label: "Business Terms",    color: "text-slate-700",   bg: "bg-slate-50",   border: "border-slate-200"  },
  ];
  const [editingName, setEditingName] = React.useState(null);
  const [editValue,   setEditValue]   = React.useState("");

  const startEdit = (name, e) => {
    e.preventDefault(); e.stopPropagation();
    setEditingName(name);
    setEditValue(name);
  };
  const commitEdit = (oldName) => {
    const newName = editValue.trim();
    if (newName && newName !== oldName) onRename(oldName, newName);
    setEditingName(null);
  };

  return (
    <div className="space-y-4">
      <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center gap-3">
        <span className="text-lg">✋</span>
        <div>
          <div className="text-sm font-semibold text-amber-800">{(banner && banner.title) || "Review before creating in CDGC"}</div>
          <div className="text-xs text-amber-600">{(banner && banner.body) || "Deselect any items you don't want. Click a name to rename it."}</div>
        </div>
      </div>

      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">{selected.size} / {items.length} selected</span>
        <div className="flex gap-2">
          <button onClick={onSelectAll}   className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-brand hover:text-brand transition-colors">Select all</button>
          <button onClick={onDeselectAll} className="text-xs px-2.5 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:border-red-300 hover:text-red-500 transition-colors">Deselect all</button>
        </div>
      </div>

      {groups.map(g => {
        const groupItems = items.filter(i => i.type === g.type);
        if (!groupItems.length) return null;
        const groupSelected = groupItems.filter(i => selected.has(i.name));
        const allChecked = groupSelected.length === groupItems.length;
        return (
          <div key={g.type} className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm">
            {/* Group header */}
            <div className={`flex items-center gap-2 px-4 py-2.5 ${g.bg} border-b border-slate-200`}>
              <input
                type="checkbox"
                checked={allChecked}
                onChange={() => onToggleGroup(groupItems.map(i => i.name), !allChecked)}
                className="accent-violet-600 cursor-pointer w-3.5 h-3.5"
              />
              <span className={`text-xs font-bold uppercase tracking-wider ${g.color}`}>{g.label}</span>
              <span className="text-xs text-slate-400 font-medium">{groupSelected.length} / {groupItems.length}</span>
            </div>
            {/* Item rows */}
            <div className="divide-y divide-slate-100">
              {groupItems.map(item => {
                const isSelected = selected.has(item.name);
                const isEditing  = editingName === item.name;
                return (
                  <div key={item.name}
                    className={`flex items-center gap-3 px-4 py-2.5 group transition-colors ${isSelected ? "bg-white hover:bg-slate-50" : "bg-slate-50 opacity-50"}`}>
                    <input
                      type="checkbox"
                      checked={isSelected}
                      onChange={() => onToggle(item.name)}
                      className="accent-violet-600 cursor-pointer w-3.5 h-3.5 shrink-0"
                    />
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        {isEditing ? (
                          <input
                            autoFocus
                            value={editValue}
                            onChange={e => setEditValue(e.target.value)}
                            onBlur={() => commitEdit(item.name)}
                            onKeyDown={e => { if (e.key === "Enter") commitEdit(item.name); if (e.key === "Escape") setEditingName(null); }}
                            onClick={e => e.stopPropagation()}
                            className="flex-1 border border-violet-300 rounded px-2 py-0.5 text-sm font-medium text-slate-800 outline-none bg-white shadow-inner"
                          />
                        ) : (
                          <span className="text-sm font-medium text-slate-700 break-words">{item.name}</span>
                        )}
                        {item.parent && !isEditing && (
                          <span className="shrink-0 text-xs bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded font-normal truncate max-w-[120px]" title={item.parent}>{item.parent}</span>
                        )}
                      </div>
                      {/* Gate 3 rows carry profiling evidence as secondary text */}
                      {item.subtitle && !isEditing && (
                        <div className="text-xs text-slate-400 mt-0.5">{item.subtitle}</div>
                      )}
                    </div>
                    {renamable && (
                    <button
                      onClick={e => startEdit(item.name, e)}
                      className="shrink-0 opacity-0 group-hover:opacity-100 transition-all px-2 py-0.5 rounded bg-violet-100 text-violet-600 hover:bg-violet-200 text-xs font-medium"
                      title="Rename"
                    >✎ Rename</button>
                    )}
                  </div>

  const pct          = last.progress?.match(/\((\d+)%\)/)?.[1] || "100";

    <div className="space-y-4">

function SubStepRow({ label, result, detail }) {
  const s = result?.status || "";
  // failed is computed FIRST: "not_found".includes("found") is true, so the
  // ok-marker substring test alone would render a missing asset with a ✓.
  const failed = s.includes("failed") || s === "not_found" || result?.error;
  const ok = !failed && ["created","existing","done","published","linked","already_linked","found","partial","uploaded","saved_locally"].some(v => s.includes(v));
  const icon = failed ? "✗" : ok ? "✓" : "–";
  const color = failed ? "text-red-500" : ok ? "text-emerald-600" : "text-slate-400";
  return (
    <div className="flex items-start gap-3 py-2 border-b border-slate-100 last:border-0">
      <span className={`text-sm font-bold w-4 shrink-0 ${color}`}>{icon}</span>
      <div className="flex-1 min-w-0">
        <div className="text-xs font-semibold text-slate-700">{label}</div>
        {result?.error && <div className="text-xs text-red-500 mt-0.5 truncate">{result.error}</div>}
        {!result?.error && detail && <div className="text-xs text-slate-500 mt-0.5">{detail}</div>}
        {!result?.error && !detail && s && <div className="text-xs text-slate-400 mt-0.5">{s}</div>}
      </div>
    </div>
  );
}

      {allOk && <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-sm font-semibold text-emerald-800">✓ Delivery configuration complete</div>}

// Confirmation modal — the second gate pattern (steps 10, 13, 15). Not a
// selection to review like DomainApprovalPanel; a single irreversible action whose
// consequences are the substance of the screen. Approve on step 15 adds dual control.
function ConfirmModal({ confirm, onClose, onConfirm }) {
  if (!confirm) return null;
  const { title, subtitle, consequences = [], confirmLabel, danger, dual, tool } = confirm;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-slate-900/40"/>
      <div className="relative w-[min(470px,92vw)] bg-white rounded-xl shadow-2xl" onClick={e => e.stopPropagation()}>
        <div className="px-5 py-4 border-b border-slate-100 flex gap-3">
          <span className="text-lg">{danger ? "⛔" : dual ? "⚑" : "⚠"}</span>
          <div>
            <h3 className="text-base font-bold text-slate-800">{title}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
        </div>
        <div className="px-5 py-4">
          <ul className="text-sm text-slate-600 space-y-1.5">
            {consequences.map((c, i) => <li key={i} className="flex gap-2"><span className="text-slate-300">—</span><span>{c}</span></li>)}
          </ul>
          {dual && (
            <div className="bg-violet-50 border border-violet-200 rounded-lg p-3 mt-3 text-xs text-violet-800">
              <b>Dual control required.</b> This needs a second approver. You cannot approve your own request.
            </div>
          )}
        </div>
        <div className="px-5 py-3.5 border-t border-slate-100 flex gap-2 items-center">
          <button onClick={onConfirm}
            className={`px-4 py-2 rounded-lg text-white text-sm font-semibold ${danger && !dual ? "bg-red-600 hover:bg-red-700" : "bg-brand hover:bg-brand-dark"}`}>
            {dual ? "Submit for second approval" : (confirmLabel || "Confirm")}
          </button>
          <button onClick={onClose} className="px-3 py-2 rounded-lg border border-slate-300 text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
          {tool && <span className="ml-auto text-xs text-slate-400 font-mono">{tool}</span>}
        </div>
      </div>
    </div>
  );
}

function DataQualityResult({ data }) {
  const dqR    = data?.dq_rules;
  const scR    = data?.scores;
  const dqOk   = (dqR?.rules?.occurrences_registered?.length ?? 0) > 0;
  const scOk   = scR?.pushed > 0 || scR?.scores?.length > 0;
  const dqCount = dqR?.rules?.occurrences_registered?.length ?? null;
  const scCount = scR?.pushed ?? scR?.scores?.length ?? null;
  const dqErrors = dqR?.rules?.errors || [];
  const allOk  = dqOk && scOk;
  return (
    <div className="space-y-3">
      <EstimateBanner data={data} />
      <div className="bg-white border border-slate-200 rounded-xl px-4 py-2 shadow-sm">
        <SubStepRow label="DQ Rules"        result={{ status: dqOk ? "done" : dqErrors.length ? "failed" : dqR ? "done" : "", error: dqR?.error }} detail={dqCount != null ? `${dqCount} rule occurrences` : null}/>
        <SubStepRow label="Generate Scores" result={{ status: scOk ? "done" : scR ? "done" : "", error: scR?.error }} detail={scCount != null ? `${scCount} scores pushed` : null}/>

      {dqErrors.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-lg p-3">

  );
}

function SevBadge({ severity }) {
  const s = (severity || "").toUpperCase();

            : s === "MEDIUM" ? "bg-amber-100 text-amber-700 border-amber-300"

function DataTable({ columns, rows, empty }) {
  if (!rows || rows.length === 0) return empty || <div className="text-xs text-slate-400 italic p-3">No entries.</div>;
  return (
    <div className="overflow-x-auto border border-slate-200 rounded-xl">
      <table className="w-full text-xs">
        <thead className="bg-slate-100 text-slate-500 uppercase tracking-wider">
          <tr>{columns.map(c => <th key={c.key} className="px-3 py-2 text-left whitespace-nowrap">{c.label}</th>)}</tr>
        </thead>
        <tbody className="divide-y divide-slate-100 bg-white">
          {rows.map((r, i) => (
            <tr key={i} className="hover:bg-slate-50">
              {columns.map(c => <td key={c.key} className="px-3 py-2 text-slate-700 align-top">{c.render ? c.render(r) : (r[c.key] ?? "—")}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function fmtPct(v) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return (n <= 1 ? n * 100 : n).toFixed(1) + "%";
}

// ── Phase 4: lineage renderers ────────────────────────────────────────────────

// A CDGC core.location is origin://origin/…/<parent>/<parent>()/<node>. The
// meaningful group header is the parent segment (the Databricks notebook / job
// / schema), NOT the raw URI — that's what resolves the "every node is
// Command 1" collision: the two Command 1 nodes sit under different parents
// (02_Silver_Layer vs 03_Gold_Layer). Falls back to the origin tail when the
// shape is unfamiliar.
function locationGroup(loc, nodeName) {
  if (!loc || typeof loc !== "string" || loc.indexOf("://") < 0) return "(ungrouped)";
  const rest = loc.split("://")[1] || "";
  let parts = rest.split("/").filter(Boolean);
  // drop the leading origin uuid segment
  if (parts.length) parts = parts.slice(1);
  // drop the trailing node segment itself (it equals nodeName, e.g. "Command 1")
  if (nodeName && parts.length && parts[parts.length - 1] === nodeName) parts = parts.slice(0, -1);
  // a Databricks notebook repeats as "X" then "X()" — collapse to the name
  let last = parts.length ? parts[parts.length - 1] : "";
  last = last.replace(/\(\)$/, "");
  if (!last && parts.length > 1) last = parts[parts.length - 2].replace(/\(\)$/, "");
  return last || "(ungrouped)";
}

// Build {Upstream, Downstream} → {groupHeader → [nodes]} from flattened edges.
// A node reachable up AND down appears in both branches — expected (CDGC does
// the same). Each node carries the far end of its edge (the non-root side).
function buildLineageTree(data) {
  const rootId = data?.asset?.id;
  const branch = (dir) => {
    const groups = {};   // header -> { nodes: Map(id->node), minDist }
    (data?.edges || []).forEach(e => {
      if (e.direction !== dir) return;
      // the "far" node is whichever end is not the root
      const far = e.toId === rootId
        ? { id: e.fromId, name: e.from, type: e.fromType, loc: e.fromLocation }
        : { id: e.toId,   name: e.to,   type: e.toType,   loc: e.toLocation };
      if (!far.id || far.id === rootId) return;
      const header = locationGroup(far.loc, far.name);
      const g = groups[header] || (groups[header] = { nodes: new Map(), minDist: 999 });
      if (!g.nodes.has(far.id)) g.nodes.set(far.id, { ...far, dist: e.distance });
      if (e.distance != null && e.distance < g.minDist) g.minDist = e.distance;
    });
    // ordered: nearest hop first, header alpha as tiebreak
    return Object.entries(groups)
      .map(([header, g]) => ({ header, minDist: g.minDist, nodes: [...g.nodes.values()] }))
      .sort((a, b) => a.minDist - b.minDist || a.header.localeCompare(b.header));
  };
  const up = branch("inbound");    // inbound = upstream
  const down = branch("outbound"); // outbound = downstream
  const count = (bs) => bs.reduce((n, g) => n + g.nodes.length, 0);
  return { up, down, upCount: count(up), downCount: count(down) };
}

function TypeTag({ type }) {
  const t = (type || "").split(".").pop();
  return t ? <span className="text-xs text-slate-400">{t}</span> : null;
}

// Reuses the DiscoverResult idea: one collapsed map keyed by path string, a
// toggle, chevrons, SchemaTableList's 12-preview. Open-set lives in local
// state so expanding never touches parent state or resets scroll. Everything
// starts collapsed.
function LineageBranch({ label, groups, count, pathPrefix, open, toggle }) {
  const branchKey = pathPrefix;
  const branchOpen = open.has(branchKey);
  return (
    <div className="border border-slate-200 rounded-xl bg-white overflow-hidden">
      <button onClick={() => toggle(branchKey)}
        className="w-full flex items-center justify-between px-3 py-2 bg-slate-50 hover:bg-slate-100 transition-colors">
        <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">{label} ({count})</span>
        <span className="text-slate-400 text-sm">{branchOpen ? "▾" : "▸"}</span>
      </button>
      {branchOpen && (
        <div className="divide-y divide-slate-50">
          {groups.length === 0 && <div className="px-4 py-2 text-xs text-slate-400 italic">none</div>}
          {groups.map(g => {
            const gKey = `${pathPrefix}/${g.header}`;
            const gOpen = open.has(gKey);
            const PREVIEW = 12;
            const shown = gOpen ? g.nodes : g.nodes.slice(0, PREVIEW);
            return (
              <div key={gKey}>
                <button onClick={() => toggle(gKey)}
                  className="w-full flex items-center gap-1.5 px-3 py-1.5 hover:bg-slate-50 transition-colors text-left">
                  <span className="text-slate-400 text-xs">{gOpen ? "▾" : "▸"}</span>
                  <span className="text-xs font-semibold text-slate-700 truncate" title={g.header}>{g.header}</span>
                  <span className="text-xs text-slate-400">({g.nodes.length})</span>
                </button>
                {gOpen && (
                  <div className="pl-7 pr-3 pb-2 space-y-1">
                    {shown.map(n => (
                      <div key={n.id} className="flex items-center gap-2">
                        <span className="w-1 h-1 rounded-full bg-indigo-300 inline-block shrink-0"/>
                        <span className="text-xs font-mono text-slate-600 truncate" title={n.name}>{n.name}</span>
                        <TypeTag type={n.type}/>
                      </div>
                    ))}
                    {!gOpen && null}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function LineageTree({ data }) {
  const [open, setOpen] = React.useState(() => new Set());   // empty = all collapsed
  const toggle = (k) => setOpen(prev => { const n = new Set(prev); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const t = buildLineageTree(data);
  const total = (data?.edge_count ?? 0);
  return (
    <div className="space-y-2">
      <div className="flex items-center justify-between px-1">
        <span className="text-sm font-mono font-semibold text-slate-800 truncate" title={data?.asset?.name}>{data?.asset?.name || "—"}</span>
        <span className="text-xs text-slate-400 shrink-0">{t.upCount} up · {t.downCount} down</span>
      </div>
      {total === 0
        ? <LineageEmptyState assetName={data?.asset?.name}/>
        : (
          <div className="space-y-2">
            <LineageBranch label="Upstream" groups={t.up} count={t.upCount} pathPrefix="up" open={open} toggle={toggle}/>
            <LineageBranch label="Downstream" groups={t.down} count={t.downCount} pathPrefix="down" open={open} toggle={toggle}/>
          </div>
        )}
    </div>
  );
}

  return (
    <div className="flex items-center gap-3 px-3 py-2">
      <span className="text-xs font-mono text-slate-600 w-56 truncate shrink-0" title={entry.rule}>{entry.rule}</span>

      <span className={`text-xs font-bold w-14 text-right shrink-0 ${color}`}>{entry.delta > 0 ? "+" : ""}{Number(entry.delta).toFixed(1)}</span>
      <span className="text-xs text-slate-300 shrink-0">{entry.points} pts</span>
    </div>
  );
}

function ProfileResult({ data, scanSource, scanSchema, scanTable, profileObject }) {
  // Item 1, rule 1: never render a profile whose {connection, schema, table}
  // differs from the current selection. The result carries _selection from fetch
  // time; a mismatch means the selection moved on — show a prompt, not stale stats.
  const curTable = String(profileObject || (scanTable && scanTable !== "__ALL__" ? scanTable : "") || "").trim();
  const sel = data && data._selection;
  if (sel && curTable && (
        String(sel.table || "").toLowerCase() !== curTable.toLowerCase() ||
        String(sel.connection || "") !== String(scanSource || "") ||
        String(sel.schema || "") !== String(scanSchema || ""))) {
    return (
      <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-xs text-amber-700">
        This profile is for <span className="font-mono font-semibold">{sel.table}</span>, but the current
        selection is <span className="font-mono font-semibold">{curTable}</span>. Re-run Profile Data to
        profile the selected table.
      </div>
    );
  }
  const cols = data?.columns || {};
  const names = Object.keys(cols);
  const pathLabel = data?.profile_path === "snowflake_direct" ? "Computed locally — direct Snowflake query"
                  : data?.profile_path === "cdgc_catalog"     ? "Informatica profiling service (read from CDGC)"
                  : "Informatica profiling service";
  const totalRows = Number(data?.total_rows) || 0;
  // READS AS — UI-side inference (NOT an IDMC output): identifier / code list /
  // measure / date / free text, from type, distinct count and null rate.
  const readsAs = (st) => {
    const t = (st.data_type || "").toLowerCase();
    const dc = st.distinct_count, nl = Number(st.null_pct);
    if (/date|time/.test(t)) return "date";
    if (/num|int|float|deci|double|real/.test(t)) return "measure";
    if (dc != null && totalRows && dc >= totalRows * 0.95 && (Number.isNaN(nl) || nl <= 0.05)) return "identifier";
    if (dc != null && dc > 0 && dc <= 12) return "code list";
    return "free text";
  };
  const nullPctNum = (pct) => pct == null ? null : (Number(pct) <= 1 ? Number(pct) * 100 : Number(pct));
  return (
    <div className="space-y-3">
      {data?._cached && (
        <div className="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2 text-xs text-indigo-700 font-medium">
          Profiled {data._saved_at ? `at ${data._saved_at}` : "earlier this session"} — cached, not re-executed. Run Step to refresh.
        </div>
      )}
      {/* Single Profile results card (not one panel per substep) */}
      <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div className="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center gap-2 flex-wrap">
          <span className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Profile results</span>
          <span className="text-xs bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">NEW STEP</span>
          <span className="ml-auto text-xs text-slate-400">
            {totalRows ? `${totalRows.toLocaleString()} rows · ` : ""}{names.length} columns · {data?.profile_path === "snowflake_direct" ? "Snowflake direct" : "IDMC service"}
          </span>
        </div>
        {names.length > 0 ? (
          <DataTable
            columns={[
              { key: "name",  label: "Column", render: r => <span className="font-mono font-semibold">{r.name}</span> },
              { key: "nullpct", label: "Null %", render: r => {
                  const p = nullPctNum(r.stats.null_pct);
                  if (p == null) return <span className="text-slate-400">—</span>;
                  const bad = p > 10;
                  return (
                    <div className="flex items-center gap-2 min-w-[90px]">
                      <div className="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className={bad ? "h-full bg-red-400" : "h-full bg-emerald-400"} style={{ width: `${Math.min(p, 100)}%` }}/></div>
                      <span className={`text-xs ${bad ? "text-red-600 font-semibold" : "text-slate-500"}`}>{p.toFixed(1)}%</span>
                    </div>
                  );
                } },
              { key: "distinct", label: "Distinct", render: r => {
                  const dc = r.stats.distinct_count;
                  if (dc == null) return <span className="text-slate-400">—</span>;
                  // Duplication only signals a defect on a column that should be
                  // unique. Fire the badge only when the column reads as an identifier
                  // — suppress it on code lists and low-cardinality columns, where
                  // distinct < rows is the norm and the badge would be pure noise.
                  const dup = totalRows && dc < totalRows && readsAs(r.stats) === "identifier";
                  return <span className="flex items-center gap-1.5">{dc.toLocaleString ? dc.toLocaleString() : dc}{dup ? <span className="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-medium">dup</span> : null}</span>;
                } },
              { key: "minmax", label: "Min / Max", render: r => <span className="font-mono text-slate-500">{String(r.stats.min_value ?? "—").slice(0, 16)} / {String(r.stats.max_value ?? "—").slice(0, 16)}</span> },
              { key: "reads", label: "Reads as", render: r => <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{readsAs(r.stats)}</span> },
            ]}
            rows={names.map(n => ({ name: n, stats: cols[n] || {} }))}
          />
        ) : (
          <div className="p-4 text-xs text-slate-500">
            No column statistics returned — the connector may not enumerate columns through the profiling
            service, or CDGC hasn't ingested the run yet (statistics propagate a few minutes after the job).
            "Warehouse query" queries Snowflake directly and returns immediately.
          </div>
        )}
      </div>
      {/* The case for the step's position — the Opella argument */}
      <div className="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-3 text-xs text-indigo-700 leading-relaxed">
        <span className="font-semibold">Why this runs before taxonomy.</span> "Reads as" is derived from distinct counts,
        null rates and ranges. Without it the next step classifies on column names alone, which produces descriptions
        rather than a taxonomy.
      </div>
    </div>
  );
}

// Polls all six MCP servers and NAMES the ones that are down. During a demo a
// silent failure is worse than a visible one.
function HealthIndicator() {
  const [health, setHealth] = useState(null);
  useEffect(() => {
    let alive = true;
    const check = async () => {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        if (alive) setHealth(d);
      } catch (e) {
        if (alive) setHealth({ servers: [], down: ["ui backend"], all_ok: false, online: 0, total: 6 });
      }
    };
    check();
    const iv = setInterval(check, 30000);
    return () => { alive = false; clearInterval(iv); };
  }, []);

  // Six dots, one per MCP server, then "N of M online" — which server is down at
  // a glance (spec: The shell / header), and the failing ones named, not a ratio.
  if (!health) return (
    <div className="flex items-center gap-1.5">
      {[...Array(6)].map((_, i) => <span key={i} className="w-2 h-2 rounded-full bg-slate-300 pulse inline-block"/>)}
      <span className="text-xs text-slate-400 font-medium ml-1">checking…</span>
    </div>
  );
  const busy = health.busy || [];
  const servers = (health.servers && health.servers.length)
    ? health.servers
    : [...Array(health.total || 6)].map(() => ({ state: health.all_ok ? "up" : "down" }));
  const online = health.online != null ? health.online : servers.filter(s => s.state !== "down").length;
  const total = health.total || servers.length || 6;
  const dotCls = (s) => s.state === "down" ? "bg-red-500 pulse"
                      : busy.includes(s.server) ? "bg-amber-400 pulse" : "bg-emerald-500";
  const title = servers.map(s => `${s.server || "server"}: ${s.state || "?"}${busy.includes(s.server) ? " (busy)" : ""}${s.error ? " — " + s.error : ""}`).join("\n");
  return (
    <div className="flex items-center gap-1.5" title={title}>
      {servers.map((s, i) => <span key={i} className={`w-2 h-2 rounded-full inline-block ${dotCls(s)}`}/>)}
      <span className={`text-xs font-medium ml-1 ${online < total ? "text-red-500 font-semibold" : "text-slate-500"}`}>
        {online} of {total} online{(health.down && health.down.length) ? ` — ${health.down.join(", ")} down` : busy.length ? ` — ${busy.join(", ")} busy` : ""}
      </span>
    </div>
  );
}

// Session age — the leading indicator for the session-expiry failure the spec
// calls the most likely demo failure, so it lives in the header.
function SessionTimer() {
  const [mins, setMins] = useState(0);
  const start = useRef(Date.now());
  useEffect(() => {
    const iv = setInterval(() => setMins(Math.floor((Date.now() - start.current) / 60000)), 30000);
    return () => clearInterval(iv);
  }, []);
  return (
    <div className="flex items-center gap-1.5 text-xs text-slate-500 pl-3 border-l border-slate-200"
      title="Session age. Sessions expire; if calls start returning 401 REPO_38205, reconnect.">
      <span className="w-2 h-2 rounded-full bg-emerald-500"/>Session · {mins}m
    </div>
  );
}

// Second line under each sidebar row — how a steward reads pipeline state without
// clicking through fifteen steps (spec: The shell / sidebar).
function stepStatusLine(step, status, results) {
  if (status === STATUS.skipped) return "Skipped by steward";
  if (status === STATUS.error)   return "Failed — open to retry";
  if (status === STATUS.running) return step.gate ? "Awaiting steward review" : "Running…";
  if (status === STATUS.done) {
    const r = results[step.id] || {};
    if (step.id === "discover") {
      const g = r.catalog_sources_grouped || (r.result && r.result.catalog_sources_grouped) || [];
      if (g.length) {
        const t = g.reduce((n, s) => n + (s.total_tables || (s.schemas || []).reduce((m, x) => m + ((x.tables || []).length), 0) || 0), 0);
        return `${g.length} source${g.length !== 1 ? "s" : ""}${t ? ` · ${t} tables` : ""}`;
      }
    }
    if (step.id === "scan") {
      const t = r.table || r.object_name; const c = (r.columns || []).length;
      if (t) return `${t}${c ? ` · ${c} cols` : ""}`;
    }
    if (step.id === "profile") { const c = Object.keys(r.columns || {}).length; if (c) return `${c} columns profiled`; }
    if (step.id === "taxonomy") { const d = (r.domains || (r.taxonomy && r.taxonomy.domains) || []).length; if (d) return `${d} domain${d !== 1 ? "s" : ""}`; }
    return "Complete";
  }
  return "Not started";
}

  const _initStep = (_savedStep && VALID_STEP_IDS.has(_savedStep)) ? _savedStep : "discover";

  const [activeStep, setActiveStep] = useState(_initStep);
  const [statuses,   setStatuses]   = useState(_saved?.statuses   || {});
  const [results,    setResults]    = useState(_saved?.results     || {});
  const [errors,     setErrors]     = useState({});
  const [stepProgress, setStepProgress] = useState({});
  const [showJson,   setShowJson]   = useState({});
  const abortRef = useRef(null);

  const [scanTable,    setScanTable]    = useState(_saved?.scanTable    || "");
  const [scanSchema,   setScanSchema]   = useState(_saved?.scanSchema   || "");
  const [scanSource,   setScanSource]   = useState(_saved?.scanSource   || "");
  const [scanDatabase, setScanDatabase] = useState(_saved?.scanDatabase || "");
  // Domain structure approval state
  const [domainItems,    setDomainItems]    = useState([]);
  const [domainSelected, setDomainSelected] = useState(new Set());
  const [domainRenames,  setDomainRenames]  = useState({});
  const [domainApproving, setDomainApproving] = useState(false);
  const [subRunning, setSubRunning] = useState({});
  // Substep results for steps whose parent result is NOT a substep map
  // (composite steps like Create Collection keep writing into results[stepId]).
  const [subResults, setSubResults] = useState({});
  const [settingsOpen, setSettingsOpen] = useState(false);
  // propagate_dq_score (step 10) — the one substep that needs inputs
  const [propagateForm, setPropagateForm] = useState({ asset_name: "", score: "", dimension: "Accuracy" });
  // Step 2 lineage substeps (Phase 4)
  const [lineageForm, setLineageForm] = useState({ asset_name: "", direction: "all", depth: 5, change_description: "" });
  // Step 6 glossary substeps (Phase 5)
  const [glossForm, setGlossForm] = useState({ asset_name: "", domain_context: "", term_name: "", definition: "", category: "", synonyms: "", scan_scope: "all" });
  // Step 11 monitor (Phase 3) — entered cold; free text is the primary selector
  const [monitorForm, setMonitorForm] = useState({ asset_name: "", lookback_days: "30", threshold: "10", notify_email: "" });
  // Step 3 (Phase 1): profile once, cache, two consumers
  const [profileObject, setProfileObject] = useState(_saved?.profileObject || "");
  const [profileMode, setProfileMode] = useState(_saved?.profileMode || "local");
  // Step 3 selector must carry the {database, schema} triple, or
  // compute_profile_from_snowflake falls back to IDMC_DQ_SCHEMA_PATH and fails
  // "table not found in INFORMATION_SCHEMA" for any table outside that default.
  const [profileSchema, setProfileSchema] = useState(_saved?.profileSchema || "");
  const [profileDatabase, setProfileDatabase] = useState(_saved?.profileDatabase || "");
  // Step 7 (Phase 1): Gate 3 state + approved selection carried into step 8
  const [recItems, setRecItems] = useState([]);
  const [recSelected, setRecSelected] = useState(new Set());
  const [approvedRecs, setApprovedRecs] = useState(_saved?.approvedRecs || []);
  // Step 7 rule authoring (Phase 6)
  const [ruleForm, setRuleForm] = useState({ rule_name: "", description: "", dimension: "COMPLETENESS", rule_template: "" });
  const [ruleTemplates, setRuleTemplates] = useState([]);
  const [orgRules, setOrgRules] = useState([]);
  // Step 9 (Phase 2)
  const [dqTaskForm, setDqTaskForm] = useState({ source_table: "", rule_spec_id: "", task_name: "" });
  const [mtaskForm, setMtaskForm] = useState({ name: "", mapping_id: "" });
  const [scheduleForm, setScheduleForm] = useState({ name: "", interval: "Daily", startLocal: "", frequency: "", day_of_month: "" });
  const [taskflowForm, setTaskflowForm] = useState({ name: "", picked: [] });
  const [runTaskId, setRunTaskId] = useState("");
  const [jobRuns, setJobRuns] = useState([]);
  const [config, setConfig] = useState(null);
  // Step 1 (Phase 6): catalog source scan inputs
  const [mccForm, setMccForm] = useState({ tables: "", schema_hint: "" });
  // Gate 2 (curate): proposed links awaiting review — nothing written until approve
  const [curMatches, setCurMatches] = useState([]);
  const [curSelected, setCurSelected] = useState(new Set());
  const [curApproving, setCurApproving] = useState(false);
  // Gates 4/5 (step 15): single-item confirmation before approve / withdraw
  const [accessGate, setAccessGate] = useState(null);
  const [confirm, setConfirm] = useState(null);   // confirmation-modal payload (steps 10 / 13 / 15)
  const [pending, setPending] = useState([]);      // dual-control queue awaiting a second approver
  // Settings panel: export/import
  const [expForm, setExpForm] = useState({ ids: "", name: "" });
  const [expBusy, setExpBusy] = useState(false);
  const [expOut, setExpOut] = useState(null);
  const [expErr, setExpErr] = useState(null);
  const [impFile, setImpFile] = useState(null);
  const [impBusy, setImpBusy] = useState(false);
  const [impOut, setImpOut] = useState(null);
  const [impErr, setImpErr] = useState(null);
  const [sessionExpired, setSessionExpired] = useState(null);

  const doExport = async () => {
    setExpBusy(true); setExpErr(null); setExpOut(null);
    try {
      const object_ids = expForm.ids.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      const body = { object_ids };
      if (expForm.name) body.name = expForm.name;
      setExpOut(await apiPost("/api/settings/export", body));
    } catch (e) { setExpErr(e.message); }
    finally { setExpBusy(false); }
  };

  const doImport = async () => {
    if (!impFile) return;
    setImpBusy(true); setImpErr(null); setImpOut(null);
    try {
      const b64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(String(fr.result).split(",")[1] || "");
        fr.onerror = rej;
        fr.readAsDataURL(impFile);
      });
      setImpOut(await apiPost("/api/settings/import", { filename: impFile.name, content_base64: b64 }));
    } catch (e) { setImpErr(e.message); }
    finally { setImpBusy(false); }
  };

  useEffect(() => { fetch("/api/config").then(r => r.json()).then(setConfig).catch(() => {}); }, []);

  // Rule pickers (steps 7 and 9) — load org rules + local templates on first entry.
  useEffect(() => {
    if ((activeStep === "recommend_rules" || activeStep === "schedule_execution") && !orgRules.length && !ruleTemplates.length) {
      apiPost("/api/step/list_rule_specifications", {})
        .then(d => { setOrgRules(d.rules || []); setRuleTemplates(d.local_templates || []); })
        .catch(() => {});
    }
  }, [activeStep]);

  // Step 3 cache-hit: show the stored profile rather than silently re-executing
  // a multi-minute run.
  useEffect(() => {
    if (activeStep !== "profile") return;
    const scanned = (resultsRef.current.scan?.columns || []).map(c => c?.table).filter(Boolean);
    const obj = profileObject || (scanTable && scanTable !== "__ALL__" ? scanTable : "") || scanned[0] || "";
    if (!obj || resultsRef.current.profile) return;
    fetch(`/api/profile_state?connection=${encodeURIComponent(scanSource || "")}&schema=${encodeURIComponent(scanSchema || "")}&table=${encodeURIComponent(obj)}`)
      .then(r => r.json())
      .then(d => {
        if (d.found && d.entry?.profile && !resultsRef.current.profile) {
          setResults(prev => prev.profile ? prev : ({ ...prev, profile: { ...d.entry.profile, _cached: true, _saved_at: d.entry.saved_at, object_name: obj } }));
          setStatuses(prev => ({ ...prev, profile: prev.profile || STATUS.done }));
        }
      })
      .catch(() => {});
  }, [activeStep]);

  // Step 9 live job monitoring — poll the activity monitor while any run is live;
  // an empty monitor response is not failure (the job may have moved to the log).
  useEffect(() => {
    const live = jobRuns.some(r => !JOB_TERMINAL.has((r.state_label || "").toUpperCase()));
    if (!live) return;
    const iv = setInterval(async () => {
      for (const r of jobRuns.filter(x => !JOB_TERMINAL.has((x.state_label || "").toUpperCase()))) {
        try {
          const st = await apiPost("/api/step/get_job_status", { run_id: r.runId, task_id: r.taskId });
          const entry = st.first || (st.entries || [])[0];
          if (entry) setJobRuns(prev => prev.map(p => p.runId === r.runId ? { ...p, entry, state_label: entry.state_label } : p));
        } catch (e) {}
      }
    }, 5000);
    return () => clearInterval(iv);
  }, [jobRuns]);

  // Always-fresh results/statuses for derivations inside async callbacks.
  const resultsRef = useRef(results);
  useEffect(() => { resultsRef.current = results; });
  const statusesRef = useRef(statuses);
  useEffect(() => { statusesRef.current = statuses; });

  useEffect(() => {
    notifySessionExpired = (msg) => setSessionExpired(msg);
    return () => { notifySessionExpired = null; };
  }, []);

  // Persist key state to localStorage whenever it changes
  useEffect(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ activeStep, statuses, results, scanTable, scanSchema, scanSource, scanDatabase, profileObject, profileMode, profileSchema, profileDatabase, approvedRecs }));
    } catch {}
  }, [activeStep, statuses, results, scanTable, scanSchema, scanSource, scanDatabase, profileObject, profileMode, profileSchema, profileDatabase, approvedRecs]);

  const discoverTables    = results.discover?.result?.tables_for_selection || [];
  const discoverSources   = results.discover?.result?.catalog_sources_grouped || [];

  const setStatus = (id, s) => {
    setStatuses(prev => ({ ...prev, [id]: s }));
    if (s === STATUS.running) {
      setStepProgress(prev => ({ ...prev, [id]: 0 }));
    } else if (s === STATUS.done || s === STATUS.error) {
      setStepProgress(prev => ({ ...prev, [id]: 100 }));
      setTimeout(() => setStepProgress(prev => ({ ...prev, [id]: 0 })), 1200);
    } else {
      setStepProgress(prev => ({ ...prev, [id]: 0 }));
    }
  };

  // Advance progress bar while running
  useEffect(() => {
    const runningIds = Object.entries(statuses).filter(([, s]) => s === STATUS.running).map(([id]) => id);
    if (runningIds.length === 0) return;
    const iv = setInterval(() => {
      setStepProgress(prev => {
        const next = { ...prev };
        runningIds.forEach(id => {
          const cur = next[id] || 0;
          if (cur < 97) next[id] = cur + (97 - cur) * 0.018;
        });
        return next;
      });
    }, 150);
    return () => clearInterval(iv);
  }, [statuses]);

  const stopStep = useCallback((stepId) => {
    if (abortRef.current) {
      abortRef.current.abort();
      abortRef.current = null;
    }
    setStatus(stepId, STATUS.idle);
    setErrors(prev => ({ ...prev, [stepId]: null }));
  }, []);

  // One runner for every "Run individually" button, driven by the STEPS
  // declaration. Composite steps (substepsInParent) merge into results[stepId]
  // so their existing renderers keep reading the same keys; everything else
  // goes to subResults[stepId] and renders in its own panel below the result.
  const runSubAction = useCallback(async (step, ss) => {
    // Default asset: the selected/scanned table — every selector degrades to text.
    const scannedNow = (resultsRef.current.scan?.columns || []).map(c => c?.table).filter(Boolean);
    const defaultAsset = (scanTable && scanTable !== "__ALL__" ? scanTable : "") || scannedNow[0] || "";
    const lineageAsset = lineageForm.asset_name || defaultAsset;
    const glossAsset   = glossForm.asset_name || defaultAsset;
    let body = {};
    if (ss.form === "propagate") {
      if (!propagateForm.asset_name || propagateForm.score === "") return;
      body = {
        asset_name: propagateForm.asset_name,
        score:      parseFloat(propagateForm.score),
        dimension:  propagateForm.dimension,
      };
    }
    else if (ss.form === "lineage") {
      if (!lineageAsset) return;
      body = { asset_name: lineageAsset, direction: lineageForm.direction, depth: lineageForm.depth };
    }
    else if (ss.form === "impact") {
      if (!lineageAsset) return;
      body = { asset_name: lineageAsset, change_description: lineageForm.change_description, depth: lineageForm.depth };
    }
    else if (ss.form === "source") {
      if (!lineageAsset) return;
      body = { asset_name: lineageAsset, depth: 5 };
    }
    else if (ss.form === "suggest") {
      if (!glossAsset) return;
      body = { asset_name: glossAsset };
      if (glossForm.domain_context) body.domain_context = glossForm.domain_context;
    }
    else if (ss.form === "term") {
      if (!glossForm.term_name || !glossForm.definition) return;
      body = { term_name: glossForm.term_name, definition: glossForm.definition };
      if (glossForm.category) body.category = glossForm.category;
      if (glossForm.synonyms) body.synonyms = glossForm.synonyms.split(",").map(s => s.trim()).filter(Boolean);
    }
    else if (ss.form === "health") {
      body = { scan_scope: glossForm.scan_scope };
    }
    else if (ss.form === "trends") {
      if (!monitorForm.asset_name) return;
      body = { asset_name: monitorForm.asset_name, lookback_days: parseInt(monitorForm.lookback_days, 10) || 30 };
    }
    else if (ss.form === "remediation") {
      if (!monitorForm.asset_name) return;
      body = { asset_name: monitorForm.asset_name };
    }
    else if (ss.form === "alert") {
      if (!monitorForm.asset_name || !monitorForm.threshold || !monitorForm.notify_email) return;
      body = { asset_name: monitorForm.asset_name, threshold: parseFloat(monitorForm.threshold),
               notify_email: monitorForm.notify_email, lookback_days: parseInt(monitorForm.lookback_days, 10) || 30 };
    }
    else if (ss.form === "profileObj") {
      const obj = profileObject || defaultAsset;
      if (!obj) return;
      body = { object_name: obj, database: profileDatabase || undefined, schema: profileSchema || scanSchema || undefined };
      // create_profile can't resolve columns from CDGC even for a just-scanned
      // table — hand it the list step 2 already holds rather than letting it fail.
      if (ss.tool === "create_profile") {
        const scanCols = (resultsRef.current.scan?.columns || []);
        const forObj = scanCols.find(c => c && c.table === obj) || scanCols[0] || {};
        const detail = forObj.columns_detail || [];
        if (detail.length) body.columns = detail.map(c => ({ name: c.name, dataType: c.data_type || "" }));
      }
    }
    else if (ss.form === "rule") {
      if (!ruleForm.rule_name) return;
      body = { rule_name: ruleForm.rule_name, description: ruleForm.description, dimension: ruleForm.dimension };
      if (ruleForm.rule_template) body.rule_template = ruleForm.rule_template;
    }
    else if (ss.form === "ruleValidate") {
      body = { dimension: ruleForm.dimension };
      if (ruleForm.rule_template) body.rule_template = ruleForm.rule_template;
    }
    else if (ss.form === "mtask") {
      if (!mtaskForm.name || !mtaskForm.mapping_id) return;
      body = { name: mtaskForm.name, mapping_id: mtaskForm.mapping_id };
    }
    else if (ss.form === "dqtask") {
      if (!dqTaskForm.source_table) return;
      body = { source_table: dqTaskForm.source_table };
      if (dqTaskForm.rule_spec_id) body.rule_spec_id = dqTaskForm.rule_spec_id;
      if (dqTaskForm.task_name) body.task_name = dqTaskForm.task_name;
    }
    else if (ss.form === "schedule") {
      if (!scheduleForm.name || !scheduleForm.startLocal) return;
      body = { name: scheduleForm.name, interval: scheduleForm.interval,
               start_time: new Date(scheduleForm.startLocal).toISOString() };   // always .000Z
      if (scheduleForm.frequency) body.frequency = parseInt(scheduleForm.frequency, 10);
      if (scheduleForm.interval === "Monthly" && scheduleForm.day_of_month) body.day_of_month = parseInt(scheduleForm.day_of_month, 10);
    }
    else if (ss.form === "taskflow") {
      if (!taskflowForm.name || !taskflowForm.picked.length) return;
      const tasks = (resultsRef.current.schedule_execution?.tasks || []);
      body = { name: taskflowForm.name,
               tasks: taskflowForm.picked.map(id => ({ taskId: id, type: "MTT", name: (tasks.find(t => t.id === id) || {}).name || id })) };
    }
    else if (ss.form === "runtask") {
      if (!runTaskId) return;
      body = { task_id: runTaskId };
    }
    else if (ss.form === "jobstatus") {
      if (!jobRuns.length) return;
      body = { run_id: jobRuns[0].runId, task_id: jobRuns[0].taskId };
    }
