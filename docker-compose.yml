version: "3.9"

# Scale test stack — MCP servers on 9765-9770, UI on 9080 (demov2 uses 8765/8770/8080)
services:
  governance-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      GOVERNANCE_MCP_PORT: "9765"
    command: python -m idmc_governance.servers.governance_engine
    ports:
      - "9765:9765"
    volumes:
      - ./.scan_cache:/app/.scan_cache
      - ./state:/app/state

  ai-governance:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      AI_GOVERNANCE_MCP_PORT: "9770"
    command: python -m idmc_governance.servers.ai_governance
    ports:
      - "9770:9770"
    volumes:
      - ./.scan_cache:/app/.scan_cache
    depends_on:
      - governance-engine

  lineage-reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      LINEAGE_MCP_PORT: "9766"
    command: python -m idmc_governance.servers.lineage_reporter
    ports:
      - "9766:9766"

  glossary-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      GLOSSARY_MCP_PORT: "9767"
    command: python -m idmc_governance.servers.glossary_manager
    ports:
      - "9767:9767"

  dq-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      DQ_MONITOR_MCP_PORT: "9768"
      # Alert rules persist to <repo-root>/.dq_monitor_alerts.json — point the
      # root at the shared ./state mount so the UI container can read them too.
      IDMC_REPO_ROOT: "/app/state"
    command: python -m idmc_governance.servers.dq_monitor
    ports:
      - "9768:9768"
    volumes:
      # Alert rules persist to a local JSON file (CDGC has no alert API) —
      # keep them across container restarts.
      - ./state:/app/state

  data-onboarding:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      DATA_ONBOARDING_MCP_PORT: "9769"
    command: python -m idmc_governance.servers.data_onboarding
    ports:
      - "9769:9769"
    volumes:
      - ./.scan_cache:/app/.scan_cache

  governance-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    environment:
      GOVERNANCE_UI_PORT: "9080"
      GOVERNANCE_ENGINE_URL: "http://governance-engine:9765/mcp"
      AI_GOVERNANCE_URL: "http://ai-governance:9770/mcp"
      LINEAGE_REPORTER_URL: "http://lineage-reporter:9766/mcp"
      GLOSSARY_MANAGER_URL: "http://glossary-manager:9767/mcp"
      DQ_MONITOR_URL: "http://dq-monitor:9768/mcp"
      DATA_ONBOARDING_URL: "http://data-onboarding:9769/mcp"
    command: python -m idmc_governance.ui.app
    ports:
      - "9080:9080"
    volumes:
      # Shared with governance-engine so export packages written by the engine
      # are downloadable through the UI, and uploaded import ZIPs are readable.
      - ./state:/app/state
    depends_on:
      - governance-engine
      - ai-governance
      - lineage-reporter
      - glossary-manager
      - dq-monitor
      - data-onboarding
